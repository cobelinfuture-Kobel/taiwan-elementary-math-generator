name: P03F40 Current Authority Reconciliation Staging

on:
  push:
    branches:
      - p03f40-g5b-u06-rank9-integer-division-decimal-quotient
    paths:
      - ".github/workflows/p03f40-reconciliation-staging.yml"

permissions:
  contents: write

concurrency:
  group: p03f40-current-authority-reconciliation-staging
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply deterministic Slice040 reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []

          def update(path, transform):
              p = Path(path)
              old = p.read_text(encoding="utf-8")
              new = transform(old)
              if new != old:
                  p.write_text(new, encoding="utf-8")
                  changed.append(path)

          def current_inventory(text):
              new = text
              new = re.sub(r'(getCurrentPixelRegistrySnapshot\(\)\.sourceCount\s*,\s*)32\b', r'\g<1>33', new)
              new = re.sub(r'(getCurrentPixelRegistrySnapshot\(\)\.visibleKnowledgePointCount\s*,\s*)237\b', r'\g<1>238', new)
              new = re.sub(r'(listCurrentPixelSourceOptions\(\)\.length\s*,\s*)32\b', r'\g<1>33', new)
              new = re.sub(r'(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS\.length\s*,\s*)32\b', r'\g<1>33', new)

              current_vars = set(re.findall(r'(?:const|let)\s+(\w+)\s*=\s*getCurrentPixelRegistrySnapshot\(\)', new))
              for var in current_vars:
                  new = re.sub(rf'({re.escape(var)}\.sourceCount\s*,\s*)32\b', r'\g<1>33', new)
                  new = re.sub(rf'({re.escape(var)}\.visibleKnowledgePointCount\s*,\s*)237\b', r'\g<1>238', new)
                  new = re.sub(
                      rf'(\[{re.escape(var)}\.sourceCount\s*,\s*{re.escape(var)}\.visibleKnowledgePointCount\]\s*,\s*\[)32(\s*,\s*)237(\])',
                      r'\g<1>33\g<2>238\g<3>',
                      new,
                  )

              source_vars = set(re.findall(r'(?:const|let)\s+(\w+)\s*=\s*listCurrentPixelSourceOptions\(\)', new))
              for var in source_vars:
                  new = re.sub(rf'({re.escape(var)}\.length\s*,\s*)32\b', r'\g<1>33', new)

              return new

          for p in sorted(Path('tests/curriculum').glob('p03f-slice*.test.js')):
              update(str(p), current_inventory)

          # Current shared-consumer expectations advance from Slice039 facades to Slice040.
          current_consumer_paths = [
              Path('tests/curriculum/p03f-slice025-improper-mixed-integer-conversion.test.js'),
              Path('tests/curriculum/p03f-slice027-public-ui-binding.test.js'),
              Path('tests/curriculum/p03f-slice028-public-ui-binding.test.js'),
              Path('tests/curriculum/p03f-slice030-g5a-u06-rank8-fraction.test.js'),
              Path('tests/curriculum/p03f-slice031-g5b-u04-rank8-decimal-times-integer.test.js'),
              Path('tests/curriculum/p03f-slice032-g6b-u01-rank8-mixed-domain-conversion.test.js'),
              Path('tests/curriculum/p03f-slice033-d0-closeout.test.js'),
              Path('tests/curriculum/p03f-slice033-public-ui-binding.test.js'),
              Path('tests/curriculum/p03f-slice034-d0-closeout.test.js'),
              Path('tests/curriculum/p03f-slice034-public-ui-binding.test.js'),
              Path('tests/curriculum/p03f-slice035-public-ui-binding.test.js'),
              Path('tests/curriculum/p03f-slice036-d0-closeout.test.js'),
              Path('tests/curriculum/p03f-slice036-public-ui-binding.test.js'),
              Path('tests/curriculum/p03f-slice037-d0-closeout.test.js'),
              Path('tests/curriculum/p03f-slice037-public-ui-binding.test.js'),
              Path('tests/curriculum/p03f-slice038-d0-closeout.test.js'),
              Path('tests/curriculum/p03f-slice038-g5a-u06-rank9-mixed-improper-add-sub.test.js'),
          ]
          for p in current_consumer_paths:
              if not p.exists():
                  continue
              old = p.read_text(encoding='utf-8')
              new = old
              new = new.replace('public-ui-capability-binding-p03f39\\.js', 'public-ui-capability-binding-p03f40\\.js')
              new = new.replace('batch-a-selector-p03f39-extension\\.js', 'batch-a-selector-p03f40-extension\\.js')
              new = new.replace('batch-a-browser-worksheet-p03f39-extension\\.js', 'batch-a-browser-worksheet-p03f40-extension\\.js')
              if new != old:
                  p.write_text(new, encoding='utf-8')
                  if str(p) not in changed:
                      changed.append(str(p))

          # Freeze PGC-R01 V6 to its canonical Slice032 authority so later new public sources
          # do not mutate the historical V6 rebuild. Slice040 is validated by its own current facade.
          def patch_r01_builder(text):
              new = text.replace(
                  'import { listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";',
                  'import { BATCH_A_SELECTOR_AVAILABILITY, listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";'
              )
              anchor = 'function buildSlice032CapabilityRows(matrix) {'
              frozen = '''const P03F32_FROZEN_SOURCE_IDS = new Set(Object.keys(BATCH_A_SELECTOR_AVAILABILITY.bySourceId));\nconst P03F32_FROZEN_PUBLIC_SOURCE_UNITS = Object.freeze(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.filter((row) => P03F32_FROZEN_SOURCE_IDS.has(row.sourceId)));\n\nfunction buildSlice032CapabilityRows(matrix) {'''
              if 'P03F32_FROZEN_SOURCE_IDS' not in new:
                  new = new.replace(anchor, frozen)
              new = new.replace('CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.find((row) => row.sourceId === G6B_U01_P03F32_SOURCE_ID)', 'P03F32_FROZEN_PUBLIC_SOURCE_UNITS.find((row) => row.sourceId === G6B_U01_P03F32_SOURCE_ID)')
              matrix_anchor = '  const matrix = clone(buildPublicGenerationCapabilityMatrixV5());\n'
              matrix_patch = '''  const matrix = clone(buildPublicGenerationCapabilityMatrixV5());\n  matrix.capabilities = matrix.capabilities.filter((row) => P03F32_FROZEN_SOURCE_IDS.has(row.sourceId));\n  matrix.gaps = matrix.gaps.filter((gap) => !gap.sourceId || P03F32_FROZEN_SOURCE_IDS.has(gap.sourceId));\n  matrix.uiOptionCoverage = matrix.uiOptionCoverage.filter((row) => P03F32_FROZEN_SOURCE_IDS.has(row.sourceId));\n'''
              if 'matrix.capabilities = matrix.capabilities.filter((row) => P03F32_FROZEN_SOURCE_IDS.has(row.sourceId));' not in new:
                  new = new.replace(matrix_anchor, matrix_patch)
              new = new.replace('publicSourceCount:CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length,', 'publicSourceCount:P03F32_FROZEN_PUBLIC_SOURCE_UNITS.length,')
              return new

          update('tools/curriculum/materialize-pgc-r01-public-capability-matrix-v6.mjs', patch_r01_builder)

          def patch_r01_test(text):
              new = text.replace(
                  'import { listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";',
                  'import { BATCH_A_SELECTOR_AVAILABILITY, listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";'
              )
              new = new.replace('test("PGC-R01 V6 accounts for all 32 current public sources and 226 visible KnowledgePoints", () => {', 'test("PGC-R01 V6 remains frozen to the exact Slice032 32-source / 226-KP authority", () => {')
              new = new.replace('  assert.equal(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length, 32);', '  assert.ok(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length >= 32);\n  const frozenSourceIds = new Set(Object.keys(BATCH_A_SELECTOR_AVAILABILITY.bySourceId));\n  assert.equal(frozenSourceIds.size, 32);')
              new = new.replace('  for (const source of CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS) assert.equal(matrixSources.has(source.sourceId), true, `missing capability source ${source.sourceId}`);', '  for (const source of CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.filter((row) => frozenSourceIds.has(row.sourceId))) assert.equal(matrixSources.has(source.sourceId), true, `missing capability source ${source.sourceId}`);')
              return new

          update('tests/curriculum/pgc-r01-public-capability-matrix.test.js', patch_r01_test)

          # Freeze PGC-R02 R05 to the same Slice032 authority boundary.
          def patch_r02_builder(text):
              new = text.replace(
                  'import { listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";',
                  'import { BATCH_A_SELECTOR_AVAILABILITY, listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";'
              )
              anchor = 'function currentBaseCaseCount() {'
              frozen = '''const P03F32_FROZEN_SOURCE_IDS = new Set(Object.keys(BATCH_A_SELECTOR_AVAILABILITY.bySourceId));\nconst P03F32_FROZEN_PUBLIC_SOURCE_UNITS = Object.freeze(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.filter((row) => P03F32_FROZEN_SOURCE_IDS.has(row.sourceId)));\n\nfunction currentBaseCaseCount() {'''
              if 'P03F32_FROZEN_SOURCE_IDS' not in new:
                  new = new.replace(anchor, frozen)
              new = new.replace('  for (const source of CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS) {', '  for (const source of P03F32_FROZEN_PUBLIC_SOURCE_UNITS) {')
              new = new.replace('  const oldBindings = predecessor.bindings.filter((row)=>!belongsToSlice032(row));', '  const oldBindings = predecessor.bindings.filter((row)=>!belongsToSlice032(row) && P03F32_FROZEN_SOURCE_IDS.has(row.sourceId));')
              new = new.replace('  const gaps = predecessor.gaps.filter((gap)=>!belongsToSlice032(gap));', '  const gaps = predecessor.gaps.filter((gap)=>!belongsToSlice032(gap) && (!gap.sourceId || P03F32_FROZEN_SOURCE_IDS.has(gap.sourceId)));')
              new = new.replace('publicSourceCount:CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length,', 'publicSourceCount:P03F32_FROZEN_PUBLIC_SOURCE_UNITS.length,')
              return new

          update('tools/curriculum/materialize-pgc-r02-ui-capability-binding-r05.mjs', patch_r02_builder)

          def patch_r02_test(text):
              new = text.replace(
                  'import { listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";',
                  'import { BATCH_A_SELECTOR_AVAILABILITY, listVisibleBatchAKnowledgePoints } from "../../site/modules/curriculum/registry/batch-a-selector-p03f32-extension.js";'
              )
              if 'const P03F32_FROZEN_SOURCE_IDS' not in new:
                  new = new.replace(
                      'const optionValues = (binding) => binding.availableQuestionTypeOptions.map((option)=>option.value);',
                      'const P03F32_FROZEN_SOURCE_IDS = new Set(Object.keys(BATCH_A_SELECTOR_AVAILABILITY.bySourceId));\nconst optionValues = (binding) => binding.availableQuestionTypeOptions.map((option)=>option.value);'
                  )
              new = new.replace('  for (const source of CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS) {', '  for (const source of CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.filter((row) => P03F32_FROZEN_SOURCE_IDS.has(row.sourceId))) {')
              new = new.replace('test("PGC-R02 R05 keeps Classic, 404 fallback and Pixel capacity parity", () => {', 'test("PGC-R02 R05 keeps Classic, 404 fallback and Pixel capacity parity for frozen Slice032 sources", () => {')
              return new

          update('tests/curriculum/pgc-r02-public-ui-capability-binding.test.js', patch_r02_test)

          # R00 historical freeze remains 26 sources; only the live public-source count advances.
          def patch_r00(text):
              new = text.replace('assert.equal(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length, 32);', 'assert.equal(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length, 33);')
              new = new.replace('    32,\n  );', '    33,\n  );')
              return new
          update('tests/curriculum/pgc-r00-public-generation-scope.test.js', patch_r00)

          # GCI keeps S01 historical evidence immutable; Slice040 is another approved post-S01 workflow.
          def patch_gci_s01(text):
              if '.github/workflows/p03f-slice040-product-acceptance.yml' in text:
                  return text
              return text.replace('  ".github/workflows/p03f-slice039-live-pages-e2e.yml",\n', '  ".github/workflows/p03f-slice039-live-pages-e2e.yml",\n  ".github/workflows/p03f-slice040-product-acceptance.yml",\n')
          update('tests/governance/gci-s01-workflow-inventory.test.js', patch_gci_s01)

          def patch_gci_s02(text):
              new = text
              if '.github/workflows/p03f-slice040-product-acceptance.yml' not in new:
                  new = new.replace('  ".github/workflows/p03f-slice039-live-pages-e2e.yml",\n', '  ".github/workflows/p03f-slice039-live-pages-e2e.yml",\n  ".github/workflows/p03f-slice040-product-acceptance.yml",\n')
              new = new.replace('assert.equal(current.summary.pullRequestWorkflowCount, 85);', 'assert.equal(current.summary.pullRequestWorkflowCount, 86);')
              new = new.replace('assert.equal(current.summary.lateSkipCandidateCount, 44);', 'assert.equal(current.summary.lateSkipCandidateCount, 45);')
              hist = '  assert.ok(!historical.workflows.some((row) => row.file === ".github/workflows/p03f-slice039-live-pages-e2e.yml"));\n'
              if 'historical.workflows.some((row) => row.file === ".github/workflows/p03f-slice040-product-acceptance.yml")' not in new:
                  new = new.replace(hist, hist + '  assert.ok(!historical.workflows.some((row) => row.file === ".github/workflows/p03f-slice040-product-acceptance.yml"));\n')
              return new
          update('tests/governance/gci-s02-pr-gate-pilot.test.js', patch_gci_s02)

          print(f'P03F40_RECONCILIATION_CHANGED_FILE_COUNT={len(changed)}')
          for path in changed:
              print(f'P03F40_RECONCILIATION_CHANGED={path}')
          if len(changed) < 20:
              raise SystemExit(f'expected broad current-side reconciliation, got only {len(changed)} changed files')
          PY

      - name: Remove staging workflow and commit reconciled tree
        shell: bash
        run: |
          rm .github/workflows/p03f40-reconciliation-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P03F40: reconcile current inventory and frozen PGC authorities"
          git push origin HEAD:${{ github.ref_name }}
