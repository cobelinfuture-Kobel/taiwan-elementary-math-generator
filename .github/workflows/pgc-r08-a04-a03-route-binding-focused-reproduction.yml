name: PGC-R08 A04 A03 Route Binding Repair Replay

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pgc-r08-a04-a03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: github.head_ref == 'pgc-r08-a04-a03-route-binding-focused-reproduction'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run A03 contracts
        run: |
          node --test tests/curriculum/pgc-r08-a04-a03-route-binding-focused-reproduction.test.js
          node --test tests/curriculum/pgc-r08-a04-a03-route-binding-exact-authority-probe.test.js
          node --test tests/curriculum/pgc-r08-a04-a03-route-binding-shared-resolver-repair.test.js
          node --test tests/curriculum/public-question-count-no-one-lock.test.js
      - name: Recheck four route-binding canaries
        run: node tools/curriculum/run-pgc-r08-a04-a03-route-binding-focused-reproduction.mjs
      - name: Recheck exact capacity-authority PatternGroup sets
        run: node tools/curriculum/run-pgc-r08-a04-a03-route-binding-exact-authority-probe.mjs
      - name: Replay all 136 route-binding family routes
        run: node tools/curriculum/run-pgc-r08-a04-a03-route-binding-family-replay.mjs
      - name: Upload A03 repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a03-route-binding-repair-replay
          path: |
            tmp/pgc-r08-a04-a03-route-binding-focused-reproduction
            tmp/pgc-r08-a04-a03-route-binding-exact-authority-probe
            tmp/pgc-r08-a04-a03-route-binding-family-replay
            tmp/pgc-r08-a03-all-legal-routes
          if-no-files-found: warn
          retention-days: 30
