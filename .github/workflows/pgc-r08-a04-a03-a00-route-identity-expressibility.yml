name: PGC-R08 A04 A03 A00 Route Identity Expressibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pgc-r08-a04-a03-a00-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.head_ref == 'pgc-r08-a04-a03-a00-route-identity-expressibility'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize route identity expressibility report
        run: node tools/curriculum/materialize-pgc-r08-a04-a03-route-identity-expressibility.mjs
      - name: Upload route identity expressibility artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a03-a00-route-identity-expressibility-artifact
          path: tmp/pgc-r08-a04-a03-a00-route-identity-expressibility
          if-no-files-found: error
          retention-days: 30
