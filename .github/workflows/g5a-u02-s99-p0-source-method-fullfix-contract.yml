name: G5A-U02 S99 P0 Source Method FullFix Contract

on:
  workflow_dispatch:

jobs:
  focused-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate bounded P0 FullFix contract
        run: node --test tests/curriculum/g5a-u02-s99-p0-source-method-fullfix-contract.test.js

  full-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - name: Run complete Node regression
        run: npm test

