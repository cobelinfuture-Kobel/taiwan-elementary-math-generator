name: PGC-R08 A04 A02 Disabled Control Family Replay

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pgc-r08-a04-a02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: github.head_ref == 'pgc-r08-a04-a02-disabled-control-family-replay'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Replay all 180 disabled-control routes
        run: node tools/curriculum/run-pgc-r08-a04-a02-disabled-control-family-replay.mjs
      - name: Upload disabled-control family replay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a02-disabled-control-family-replay-artifact
          path: |
            tmp/pgc-r08-a04-a02-disabled-control-family-replay
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: warn
          retention-days: 30
