name: P03F16 Slice016 Chromium Product Acceptance TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03f-slice016-product-acceptance-temp.yml'
      - 'tools/curriculum/render-p03f-slice016-product-acceptance.mjs'
      - 'data/curriculum/full-product/p03f/slice016-decimal-add-sub-compare-authority.json'
      - 'site/modules/curriculum/batch-a/**p03f16*'
      - 'site/modules/curriculum/batch-a/decimal-add-sub-compare-runtime-p03f16.js'
      - 'site/modules/curriculum/registry/batch-a-selector-p03f16-extension.js'
      - 'site/modules/curriculum/registry/g3b-u09-decimal-add-sub-compare-selector-projection.js'
      - 'site/pixel/pixel-registry-bridge.js'
      - 'tests/curriculum/p03f-slice016-decimal-add-sub-compare.test.js'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install project dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1

      - name: Validate Slice016 focused contract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/p03f-slice016-product-acceptance
          node --test tests/curriculum/p03f-slice016-decimal-add-sub-compare.test.js 2>&1 | tee tmp/p03f-slice016-product-acceptance/focused-test.log

      - name: Run read-only Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice016-product-acceptance.mjs

      - name: Verify repository remained read-only
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload Slice016 product acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice016-product-acceptance
          path: tmp/p03f-slice016-product-acceptance
          if-no-files-found: error
          retention-days: 30
