name: P03F2 One-Shot Accepted Artifact Materialization

on:
  push:
    branches:
      - p03f-w3-direct-product-vertical-slice002-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice002-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/materialize-p03f2-accepted-artifacts.mjs
