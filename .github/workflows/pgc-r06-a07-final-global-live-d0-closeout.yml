name: PGC-R06 A07 Final Global Live D0 Closeout

on:
  pull_request:
    paths:
      - "tools/curriculum/apply-pgc-r06-a07-evidence-projection-fix.mjs"
      - "tools/curriculum/materialize-pgc-r06-a07-final-global-live-d0-closeout.mjs"
      - "tests/curriculum/pgc-r06-a07-final-global-live-d0-closeout.test.js"
      - "tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js"
      - "tests/governance/gci-s01-workflow-inventory.test.js"
      - "tests/governance/gci-s02-pr-gate-pilot.test.js"
      - "data/curriculum/public-generation/generator_capacity_contract.json"
      - "data/curriculum/public-generation/ui_capability_binding_contract.json"
      - "data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json"
      - "data/curriculum/public-generation/PGC-R06-A07.final-global-live-closeout.json"
      - "site/modules/curriculum/public/public-generator-capacity-registry.js"
      - "docs/curriculum/output/PGC-R06-A07_FinalReconciliationGlobalLiveGateAndD0Closeout.md"
      - "docs/curriculum/output/PGC-R06_D0_CLOSEOUT_PASS.marker"
      - ".github/workflows/pgc-r06-a07-final-global-live-d0-closeout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r06-a07-final-global-live-d0-closeout-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  final-global-live-d0:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout A07 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply canonical evidence projection remediation
        run: node tools/curriculum/apply-pgc-r06-a07-evidence-projection-fix.mjs

      - name: Syntax-check A07 authorities
        run: |
          node --check tools/curriculum/apply-pgc-r06-a07-evidence-projection-fix.mjs
          node --check tools/curriculum/materialize-pgc-r06-a07-final-global-live-d0-closeout.mjs
          node --check tests/curriculum/pgc-r06-a07-final-global-live-d0-closeout.test.js
          node --check tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js
          node --check tests/governance/gci-s01-workflow-inventory.test.js
          node --check tests/governance/gci-s02-pr-gate-pilot.test.js

      - name: Materialize 389-route final global live closeout
        run: node tools/curriculum/materialize-pgc-r06-a07-final-global-live-d0-closeout.mjs

      - name: Require exact A07 D0 authority
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06-A07.final-global-live-closeout.json", "utf8"));
          const expectedStatus = "PASS_R06_A07_GLOBAL_LIVE_RUNTIME_RECONCILED_AND_D0_CLOSED";
          if (report.status !== expectedStatus
            || report.summary.capacityRouteCount !== 1155
            || report.summary.runtimeRegistryRowCount !== 1155
            || report.summary.r06RouteCount !== 659
            || report.summary.legalR06RouteCount !== 389
            || report.summary.illegalR06RouteCount !== 270
            || report.summary.globalLiveTargetRouteCount !== 389
            || report.summary.globalLivePassRouteCount !== 389
            || report.summary.globalLiveFailRouteCount !== 0
            || report.summary.repairQueueCount !== 0
            || report.summary.zeroCapacityRouteCount !== 0
            || report.summary.limitedCapacityRouteCount !== 0
            || report.summary.diversityGapRouteCount !== 0
            || report.summary.parallelGapFieldCount !== 0
            || report.summary.uiUnverifiedCapacityExposureCount !== 0
            || report.routes.length !== 389
            || report.routes.some((route) => route.accepted !== true)) {
            throw new Error(`PGC_R06_A07_D0_GATE_FAILED:${JSON.stringify(report.summary)}`);
          }
          console.log(`PGC_R06_A07_D0_GATE=PASS:${JSON.stringify(report.summary)}`);
          NODE

      - name: Focused A07 and historical compatibility tests
        run: |
          node --test tests/curriculum/pgc-r06-a07-final-global-live-d0-closeout.test.js
          node --test tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js
          node --test tests/governance/gci-s01-workflow-inventory.test.js
          node --test tests/governance/gci-s02-pr-gate-pilot.test.js

      - name: Capture A07 authority hashes before full regression
        run: |
          sha256sum \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            data/curriculum/public-generation/PGC-R06-A07.final-global-live-closeout.json \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            docs/curriculum/output/PGC-R06-A07_FinalReconciliationGlobalLiveGateAndD0Closeout.md \
            docs/curriculum/output/PGC-R06_D0_CLOSEOUT_PASS.marker \
            > /tmp/pgc-r06-a07-authority-before.sha256

      - name: Full repository regression
        run: npm test

      - name: Require authority hashes unchanged by full regression
        run: |
          sha256sum \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            data/curriculum/public-generation/PGC-R06-A07.final-global-live-closeout.json \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            docs/curriculum/output/PGC-R06-A07_FinalReconciliationGlobalLiveGateAndD0Closeout.md \
            docs/curriculum/output/PGC-R06_D0_CLOSEOUT_PASS.marker \
            > /tmp/pgc-r06-a07-authority-after.sha256
          diff -u /tmp/pgc-r06-a07-authority-before.sha256 /tmp/pgc-r06-a07-authority-after.sha256
          echo "PGC_R06_A07_AUTHORITY_HASH_CHECK=7/7_PASS"

      - name: Commit deterministic A07 authorities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/curriculum/materialize-pgc-r06-a07-final-global-live-d0-closeout.mjs \
            tests/curriculum/pgc-r06-a07-final-global-live-d0-closeout.test.js \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            data/curriculum/public-generation/PGC-R06-A07.final-global-live-closeout.json \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            docs/curriculum/output/PGC-R06-A07_FinalReconciliationGlobalLiveGateAndD0Closeout.md \
            docs/curriculum/output/PGC-R06_D0_CLOSEOUT_PASS.marker
          if git diff --cached --quiet; then
            echo "A07 authorities already synchronized."
          else
            git commit -m "closeout(pgc-r06): materialize A07 global live D0 authority [skip ci]"
            git fetch origin "${{ github.head_ref || github.ref_name }}"
            git rebase "origin/${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload A07 closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r06-a07-final-global-live-d0-closeout
          path: |
            data/curriculum/public-generation/PGC-R06-A07.final-global-live-closeout.json
            docs/curriculum/output/PGC-R06-A07_FinalReconciliationGlobalLiveGateAndD0Closeout.md
            docs/curriculum/output/PGC-R06_D0_CLOSEOUT_PASS.marker
            /tmp/pgc-r06-a07-authority-before.sha256
            /tmp/pgc-r06-a07-authority-after.sha256
          if-no-files-found: warn
