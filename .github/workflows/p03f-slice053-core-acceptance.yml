name: P03F Slice053 Core Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p03f53-core-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-core-acceptance:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p03f53-g6a-u04-rank13-rounding'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run Slice053 focused contracts
        run: |
          node --test \
            tests/curriculum/p03f53-g6a-u04-source-witness-resolution.test.js \
            tests/curriculum/p03f-slice053-g6a-u04-rank13-rounding.test.js

  chromium-product-acceptance:
    needs: focused-core-acceptance
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p03f53-g6a-u04-rank13-rounding'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and acceptance font
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium
      - name: Run Slice053 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice053-product-acceptance.mjs
      - name: Upload Slice053 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice053-product-acceptance
          path: tmp/p03f-slice053-product-acceptance
          if-no-files-found: error
          retention-days: 30

  live-pages-e2e:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p03f53-postmerge-pages-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify Slice053 deployed dependency closure and UI hydration
        env:
          P03F53_DEPLOYMENT_RETRIES: "20"
          P03F53_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: |
          for attempt in 1 2 3 4 5; do
            echo "P03F53_PREFLIGHT_ATTEMPT=${attempt}"
            if node tools/curriculum/preflight-p03f-slice053-live-pages-e2e.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1
      - name: Run Slice053 exact deployed Main/Pages E2E
        env:
          P03F53_DEPLOYMENT_RETRIES: "20"
          P03F53_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: |
          for attempt in 1 2 3; do
            echo "P03F53_FULL_E2E_ATTEMPT=${attempt}"
            if node tools/curriculum/run-p03f-slice053-live-pages-e2e.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - name: Upload Slice053 Main/Pages E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice053-postmerge-main-pages-e2e
          path: tmp/p03f-slice053-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
