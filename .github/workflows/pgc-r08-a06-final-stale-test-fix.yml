# One-shot final reconciliation; removed by its own successful job.
name: PGC-R08 A06 One-Shot Final Stale Test Fix

on:
  pull_request:
    paths:
      - ".github/workflows/pgc-r08-a06-final-stale-test-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconcile A04 historical test with A06 terminal state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/curriculum/pgc-r08-a04-a04-question-type-state-settlement.test.js")
          text = path.read_text(encoding="utf-8")
          replacements = {
            "A04 closes the immutable nine-route settlement queue and later active state advances to position 5": "A04 closes the immutable nine-route settlement queue and later active state advances to position 6",
            "assert.equal(activeState.reconciliation.nextRepairPosition, 5);": "assert.equal(activeState.reconciliation.nextRepairPosition, 6);",
            '"PGC-R08-A04-A06_CapacityShortfallFocusedReproductionAnd3RouteRepair",': '"PGC-R08-A04-A07_FinalGlobalReconciliationAndD0Closeout",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f"expected one stale token: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/curriculum/pgc-r08-a04-a04-question-type-state-settlement.test.js
          git rm .github/workflows/pgc-r08-a06-final-stale-test-fix.yml
          git commit -m "PGC-R08 A06 reconcile final historical test"
          git push origin "HEAD:${{ github.head_ref }}"
