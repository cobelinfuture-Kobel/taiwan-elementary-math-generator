name: P04F Slice003 Product Acceptance

on:
  push:
    branches:
      - p04f3-q003-product-acceptance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04f3-product-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-core-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run P04F3 focused contract
        run: node --test tests/curriculum/p04f-slice003-g3b-u03-time-12-24-hour-conversion.test.js

  chromium-product-acceptance:
    needs: focused-core-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and acceptance font
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium
      - name: Run P04F3 Chromium product acceptance
        run: node tools/curriculum/render-p04f-slice003-product-acceptance.mjs
      - name: Upload P04F3 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04f-slice003-product-acceptance
          path: tmp/p04f-slice003-product-acceptance
          if-no-files-found: error
          retention-days: 30
