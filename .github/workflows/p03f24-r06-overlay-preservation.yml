name: P03F24 R06 Overlay Preservation

on:
  pull_request:
    paths:
      - ".github/workflows/p03f24-r06-overlay-preservation.yml"

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch main authority
        run: git fetch origin main

      - name: Preserve R06-owned overlay on current 211-KP R02 contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const path = "data/curriculum/public-generation/ui_capability_binding_contract.json";
          const A03 = "PGC-R06-A03_CapacityPublicBindingRuntimeConsumerAndRepairQueueReconciliation";
          const A07 = "PGC-R06-A07_FinalReconciliationGlobalLiveGateAndD0Closeout";
          const current = JSON.parse(fs.readFileSync(path, "utf8"));
          const historical = JSON.parse(execFileSync("git", ["show", `origin/main:${path}`], { encoding: "utf8", maxBuffer: 32 * 1024 * 1024 }));

          if (current.summary?.visibleKnowledgePointCount !== 211) throw new Error(`current KP count ${current.summary?.visibleKnowledgePointCount}`);
          if (current.bindings?.length !== 1161) throw new Error(`current binding count ${current.bindings?.length}`);
          if (current.summary?.gapCount !== 0) throw new Error(`current gap count ${current.summary?.gapCount}`);
          if (historical.lastReconciliation?.taskId !== A03) throw new Error(`historical A03 overlay missing: ${historical.lastReconciliation?.taskId}`);
          if (historical.lastR06A07Closeout?.taskId !== A07) throw new Error(`historical A07 overlay missing: ${historical.lastR06A07Closeout?.taskId}`);
          if (historical.r06TerminalStatus !== "D0_CLOSED") throw new Error(`historical R06 terminal status ${historical.r06TerminalStatus}`);

          current.lastReconciliation = historical.lastReconciliation;
          current.lastR06A07Closeout = historical.lastR06A07Closeout;
          current.r06TerminalStatus = historical.r06TerminalStatus;
          current.summary = {
            ...current.summary,
            ...(Object.hasOwn(historical.summary ?? {}, "maximumPublicInputQuestionCount")
              ? { maximumPublicInputQuestionCount: historical.summary.maximumPublicInputQuestionCount }
              : {}),
            ...(Object.hasOwn(historical.summary ?? {}, "reconciledG5AU02BindingCount")
              ? { reconciledG5AU02BindingCount: historical.summary.reconciledG5AU02BindingCount }
              : {}),
          };

          const oldById = new Map(historical.bindings.map((row) => [row.bindingId, row]));
          let a03OverlayCount = 0;
          for (const row of current.bindings) {
            const old = oldById.get(row.bindingId);
            if (!old) continue;
            if (old.lastCapacityReconciliation?.taskId === A03) {
              row.lastCapacityReconciliation = old.lastCapacityReconciliation;
              row.verifiedCapacityQuestionCountMax = old.verifiedCapacityQuestionCountMax;
              a03OverlayCount += 1;
            }
          }
          if (a03OverlayCount <= 0) throw new Error("no A03 binding overlays preserved");

          const slice024Kps = new Set([
            "kp_g3b_u07_combined_fraction_context",
            "kp_g3b_u07_fraction_plus_count_context",
            "kp_g3b_u07_original_or_difference_context",
            "kp_g3b_u07_whole_and_fraction_add_sub",
          ]);
          const newRows = current.bindings.filter((row) => (row.selectedKnowledgePointIds ?? []).some((id) => slice024Kps.has(id)));
          if (newRows.length === 0) throw new Error("Slice024 current bindings missing");
          if (newRows.some((row) => row.lastCapacityReconciliation?.taskId === A03 || Object.hasOwn(row, "verifiedCapacityQuestionCountMax"))) {
            throw new Error("historical R06 overlay leaked into Slice024 bindings");
          }

          fs.writeFileSync(path, `${JSON.stringify(current, null, 2)}\n`);
          console.log(`P03F24_R06_A03_OVERLAY_BINDINGS=${a03OverlayCount}`);
          console.log(`P03F24_SLICE024_BINDINGS_WITHOUT_LEGACY_EVIDENCE=${newRows.length}`);
          console.log(`P03F24_CURRENT_VISIBLE_KP=${current.summary.visibleKnowledgePointCount}`);
          console.log(`P03F24_CURRENT_BINDINGS=${current.bindings.length}`);
          NODE

      - name: Focused R02 R06 Slice024 acceptance
        run: >-
          node --test
          tests/curriculum/pgc-r02-public-ui-capability-binding.test.js
          tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js
          tests/curriculum/pgc-r06-a07-final-global-live-d0-closeout.test.js
          tests/curriculum/p03f-slice024-fraction-context-core.test.js

      - name: Create detached Git blob for corrected R02 contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/p03f24-r06-overlay-preservation
          path="data/curriculum/public-generation/ui_capability_binding_contract.json"
          sha=$(python -c 'import base64,json,sys; p=sys.argv[1]; print(json.dumps({"content":base64.b64encode(open(p,"rb").read()).decode(),"encoding":"base64"}))' "$path" \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          printf '%s %s\n' "$sha" "$path" | tee tmp/p03f24-r06-overlay-preservation/blob-sha.txt

      - name: Upload corrected contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: p03f24-r06-overlay-preserved-r02-contract
          path: |
            data/curriculum/public-generation/ui_capability_binding_contract.json
            tmp/p03f24-r06-overlay-preservation/blob-sha.txt
          if-no-files-found: error
