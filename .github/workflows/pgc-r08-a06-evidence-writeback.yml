name: PGC-R08 A06 One-Shot GCI Evidence Writeback

on:
  pull_request:
    paths:
      - ".github/workflows/pgc-r08-a06-evidence-writeback.yml"

permissions:
  contents: write

jobs:
  writeback:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize final read-only GCI-S01 evidence
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import zlib from "node:zlib";
          import { materializeGciS01WorkflowInventory } from "./tools/governance/materialize-gci-s01-workflow-inventory.mjs";

          const root = ".github/ci/gci-s01";
          const inventoryPath = `${root}/workflow-inventory.json.br`;
          const fanoutPath = `${root}/workflow-fanout-matrix.json.br`;
          const ownershipPath = `${root}/workflow-ownership-readback.json.br`;
          const manifestPath = `${root}/evidence-manifest.json`;
          const readBr = (file) => JSON.parse(zlib.brotliDecompressSync(fs.readFileSync(file)).toString("utf8"));
          const inventoryAsOfCommit = readBr(inventoryPath).inventoryAsOfCommit;
          const report = materializeGciS01WorkflowInventory({
            excludeFiles: [
              ".github/workflows/pr-gate.yml",
              ".github/workflows/pgc-r06-a02-g5a-u02-live-diagnostics.yml",
              ".github/workflows/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.yml",
              ".github/workflows/pgc-r06-a07-final-global-live-d0-closeout.yml",
              ".github/workflows/pgc-r08-a06-evidence-writeback.yml",
            ],
          });
          const oldFanout = readBr(fanoutPath);
          const oldOwnership = readBr(ownershipPath);
          const next = [
            [inventoryPath, { inventoryAsOfCommit, ...report }],
            [fanoutPath, {
              ...oldFanout,
              inventoryAsOfCommit,
              summary: report.summary,
              triggerMatrix: report.triggerMatrix,
              sharedPathOverlapMatrix: report.sharedPathOverlapMatrix,
            }],
            [ownershipPath, {
              ...oldOwnership,
              inventoryAsOfCommit,
              summary: report.summary,
              workflowIds: report.workflowIds,
              ownershipMatrix: report.ownershipMatrix,
            }],
          ];
          const options = {
            params: {
              [zlib.constants.BROTLI_PARAM_QUALITY]: 11,
              [zlib.constants.BROTLI_PARAM_MODE]: zlib.constants.BROTLI_MODE_TEXT,
            },
          };
          const artifacts = [];
          for (const [file, value] of next) {
            const serialized = Buffer.from(JSON.stringify(value, null, 2), "utf8");
            const compressed = zlib.brotliCompressSync(serialized, options);
            fs.writeFileSync(file, compressed);
            artifacts.push({
              path: file,
              mediaType: "application/json",
              contentEncoding: "br",
              sha256: crypto.createHash("sha256").update(compressed).digest("hex"),
              compressedBytes: compressed.length,
              uncompressedBytes: serialized.length,
            });
          }
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          fs.writeFileSync(manifestPath, `${JSON.stringify({
            ...manifest,
            inventoryAsOfCommit,
            artifacts,
          }, null, 2)}\n`);
          NODE

      - name: Commit evidence and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ci/gci-s01
          git rm .github/workflows/pgc-r08-a06-evidence-writeback.yml
          git commit -m "PGC-R08 A06 commit materialized GCI evidence [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
