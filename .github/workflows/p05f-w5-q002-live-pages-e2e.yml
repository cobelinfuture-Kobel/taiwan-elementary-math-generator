name: P05F W5 Q002 Post-Merge Pages E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p05f-w5-q002-postmerge-pages-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Q002 exact deployed Main/Pages E2E
        env:
          P05F2_DEPLOYMENT_RETRIES: "20"
          P05F2_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: node tools/curriculum/run-p05f-w5-q002-live-pages-e2e.mjs

      - name: Upload Q002 Main/Pages E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05f-w5-q002-postmerge-main-pages-e2e
          path: tmp/p05f-w5-q002-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
