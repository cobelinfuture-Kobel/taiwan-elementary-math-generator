name: PGC-R06 A04 Post-Regression Authority Closeout

on:
  pull_request:
    paths:
      - "tools/curriculum/apply-pgc-r06-a04-idempotent-replay-fix.mjs"
      - "tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs"
      - "data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json"
      - "data/curriculum/public-generation/generator_capacity_contract.json"
      - "data/curriculum/public-generation/ui_capability_binding_contract.json"
      - "site/modules/curriculum/public/public-generator-capacity-registry.js"
      - ".github/workflows/pgc-r06-a04-post-regression-authority-closeout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r06-a04-post-regression-authority-closeout-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout A04 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply idempotent A04 replay fix
        run: node tools/curriculum/apply-pgc-r06-a04-idempotent-replay-fix.mjs

      - name: Syntax-check patched authorities
        run: |
          node --check tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs
          node --check site/modules/curriculum/public/fifteen-unit-public-pbl-runtime.js
          node --check tests/curriculum/fifteen-unit-public-pbl-pipeline.test.js
          node --check tests/curriculum/pgc-r03-generator-capacity-contract.test.js
          node --check tests/curriculum/pgc-r06-a01-g4b-u04-capacity-contract-closeout.test.js
          node --check tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js

      - name: Pre-regression A04 materialization
        run: node tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs

      - name: Verify pre-regression authority
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const inventory = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json", "utf8"));
          const capacity = JSON.parse(fs.readFileSync("data/curriculum/public-generation/generator_capacity_contract.json", "utf8"));
          if (inventory.summary?.repairQueueCount !== 35
            || inventory.repairQueue?.length !== 35
            || inventory.repairQueue.some((route) => route.sourceId === "g5a_u02_5a02")
            || inventory.lastR06A04Reconciliation?.repairQueueBefore !== 47
            || inventory.lastR06A04Reconciliation?.repairQueueAfter !== 35
            || capacity.lastR06A04Reconciliation?.routeCount !== 12) {
            throw new Error(`PGC_R06_A04_PRE_REGRESSION_AUTHORITY_FAILED:${JSON.stringify({
              queue: inventory.summary?.repairQueueCount,
              last: inventory.lastR06A04Reconciliation,
              capacity: capacity.lastR06A04Reconciliation,
            })}`);
          }
          console.log("PGC_R06_A04_PRE_REGRESSION_AUTHORITY=PASS");
          NODE

      - name: Retire temporary closeout files before governance regression
        run: |
          rm .github/workflows/pgc-r06-a04-post-regression-authority-closeout.yml
          rm tools/curriculum/apply-pgc-r06-a04-idempotent-replay-fix.mjs
          rm -f tools/curriculum/apply-pgc-r06-a04-stale-repair-queue-baseline-fix.mjs

      - name: Full repository regression
        run: npm test

      - name: Re-materialize A04 after full regression
        run: node tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs

      - name: Verify post-regression final authority
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const TASK_ID = "PGC-R06-A04_G5A-U02_12_PBL_CrossSeedDiversityFullFix";
          const inventory = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json", "utf8"));
          const capacity = JSON.parse(fs.readFileSync("data/curriculum/public-generation/generator_capacity_contract.json", "utf8"));
          const ui = JSON.parse(fs.readFileSync("data/curriculum/public-generation/ui_capability_binding_contract.json", "utf8"));
          const diagnostics = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06-A04.g5a-u02-pbl-cross-seed-diagnostics.json", "utf8"));
          const registry = fs.readFileSync("site/modules/curriculum/public/public-generator-capacity-registry.js", "utf8");
          const targetCapacity = capacity.routes.filter((route) => route.sourceId === "g5a_u02_5a02" && route.questionType === "pbl" && route.legalRoute === true);
          const failed = diagnostics.summary?.acceptedRouteCount !== 12
            || diagnostics.summary?.failedRouteCount !== 0
            || targetCapacity.length !== 12
            || targetCapacity.some((route) => route.gapCodes.includes("CROSS_SEED_ITEM_DIVERSITY_DEFICIENT"))
            || targetCapacity.some((route) => route.qualityStatus !== "DIVERSE_PARAMETER_GENERATOR")
            || inventory.summary?.repairQueueCount !== 35
            || inventory.repairQueue?.length !== 35
            || inventory.repairQueue.some((route) => route.sourceId === "g5a_u02_5a02")
            || inventory.lastR06A04Reconciliation?.taskId !== TASK_ID
            || inventory.lastR06A04Reconciliation?.repairQueueBefore !== 47
            || inventory.lastR06A04Reconciliation?.removedFromRepairQueueCount !== 12
            || inventory.lastR06A04Reconciliation?.repairQueueAfter !== 35
            || inventory.lastR06A04Reconciliation?.replayedFromCurrentCapacityLineage !== true
            || capacity.lastR06A04Reconciliation?.taskId !== TASK_ID
            || capacity.lastR06A04Reconciliation?.routeCount !== 12
            || ui.lastR06A04Reconciliation?.taskId !== TASK_ID
            || !registry.includes(`"taskId":"${TASK_ID}"`);
          if (failed) {
            throw new Error(`PGC_R06_A04_POST_REGRESSION_AUTHORITY_FAILED:${JSON.stringify({
              diagnostics: diagnostics.summary,
              targetCapacity: targetCapacity.length,
              queue: inventory.summary?.repairQueueCount,
              inventoryLast: inventory.lastR06A04Reconciliation,
              capacityLast: capacity.lastR06A04Reconciliation,
              uiLast: ui.lastR06A04Reconciliation,
            })}`);
          }
          console.log(`PGC_R06_A04_POST_REGRESSION_AUTHORITY=PASS:${JSON.stringify({ queue: 35, removed: 12 })}`);
          NODE

      - name: Focused read-only acceptance after final materialization
        run: |
          node --test tests/curriculum/fifteen-unit-public-pbl-pipeline.test.js
          node --test tests/curriculum/pgc-r03-generator-capacity-contract.test.js
          node --test tests/curriculum/pgc-r06-a01-g4b-u04-capacity-contract-closeout.test.js
          node --test tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js
          node --test tests/governance/gci-s01-workflow-inventory.test.js
          node --test tests/governance/gci-s02-pr-gate-pilot.test.js

      - name: Commit post-regression A04 authority and retire closeout tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs
          git add -A -- \
            .github/workflows/pgc-r06-a04-post-regression-authority-closeout.yml \
            tools/curriculum/apply-pgc-r06-a04-idempotent-replay-fix.mjs \
            tools/curriculum/apply-pgc-r06-a04-stale-repair-queue-baseline-fix.mjs
          git add \
            data/curriculum/public-generation/PGC-R06-A04.g5a-u02-pbl-cross-seed-diagnostics.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            docs/curriculum/output/PGC-R06-A04_G5A_U02_PBL_CrossSeedDiversity.md
          if git diff --cached --quiet; then
            echo "A04 post-regression authority already synchronized."
          else
            git commit -m "chore(pgc-r06): persist A04 post-regression authority [skip ci]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
