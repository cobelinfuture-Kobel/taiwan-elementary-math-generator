name: P03F25 Exact Head Chromium Acceptance

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: p03f25-exact-head-product-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install acceptance runtime dependencies
        run: npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Slice025 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice025-product-acceptance.mjs

      - name: Upload Slice025 product acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: p03f25-product-acceptance
          path: tmp/p03f-slice025-product-acceptance
          if-no-files-found: error

