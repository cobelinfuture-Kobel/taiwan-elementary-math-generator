name: P03F25 Exact Head Chromium Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p03f25-exact-head-product-acceptance.yml"
      - "tools/curriculum/render-p03f-slice025-product-acceptance.mjs"
      - "site/modules/curriculum/batch-a/**"
      - "site/modules/curriculum/registry/**"
      - "site/modules/renderer/**"
      - "src/renderer/**"

permissions:
  contents: read

concurrency:
  group: p03f25-exact-head-product-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Slice025 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice025-product-acceptance.mjs

      - name: Upload Slice025 product acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: p03f25-product-acceptance
          path: tmp/p03f-slice025-product-acceptance
          if-no-files-found: error
