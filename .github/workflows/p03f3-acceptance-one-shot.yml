name: P03F3 Product Acceptance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: p03f3-product-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accept-and-materialize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice003-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run P03F3 Chromium acceptance
        run: node tools/curriculum/render-p03f-slice003-product-acceptance.mjs
      - name: Materialize accepted D0 artifacts and authorities
        run: node tools/curriculum/materialize-p03f3-d0-closeout.mjs
      - name: Run artifact-materialized full Node regression
        run: npm test
      - name: Validate artifact-materialized admission
        run: node tools/curriculum/validate-p03f-slice003-product-admission.mjs
      - name: Check patch hygiene
        run: git diff --check
      - name: Upload accepted P03F3 product artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice003-product-acceptance
          path: tmp/p03f-slice003-product-acceptance
          if-no-files-found: error
          retention-days: 30
      - name: Commit accepted D0 materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P03F3: materialize accepted D0 artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
