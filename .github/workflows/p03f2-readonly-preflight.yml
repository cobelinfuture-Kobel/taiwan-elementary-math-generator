name: P03F2 Readonly Authority Preflight

on:
  push:
    branches:
      - p03f-w3-direct-product-vertical-slice002-v1

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/curriculum/readback-p03f-slice002-preflight.mjs
