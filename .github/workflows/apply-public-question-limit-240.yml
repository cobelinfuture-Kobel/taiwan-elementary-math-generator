name: Apply Public Question Limit 240

on:
  push:
    branches:
      - pgc-public-question-limit-240

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pgc-public-question-limit-240
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply approved minimal patch
        run: node tools/temporary/apply-public-question-limit-240.mjs

      - name: Focused acceptance
        run: node --test tests/public-question-limit-240.test.js tests/curriculum/pgc-r03-generator-capacity-contract.test.js

      - name: Commit approved result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: raise public question limit to 240"
          git push origin HEAD:pgc-public-question-limit-240
