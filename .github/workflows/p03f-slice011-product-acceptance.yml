name: P03F11 Slice011 Product Acceptance

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: p03f11-slice011-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  chromium:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice011-v1'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P03F11_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout pull request head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install project dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1
      - name: Apply monotonic current-surface compatibility
        run: node tools/curriculum/apply-p03f11-current-surface-compatibility.mjs
      - name: Detect binary materialization state
        id: materialization
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('data/curriculum/full-product/p03f/slice011-product-admission.manifest.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${manifest.status === 'SLICE011_RUNTIME_CONNECTED_PENDING_CHROMIUM_ACCEPTANCE'}\n`);
          NODE
      - name: Validate slice011 fail-closed or admitted state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/p03f-slice011-product-acceptance
          node tools/curriculum/validate-p03f-slice011-product-admission.mjs 2>&1 | tee tmp/p03f-slice011-product-acceptance/validator.log
      - name: Render Chromium acceptance
        run: node tools/curriculum/render-p03f-slice011-product-acceptance.mjs
      - name: Materialize runner artifacts
        if: steps.materialization.outputs.needed == 'true'
        run: node tools/curriculum/materialize-p03f-slice011-runner-artifacts.mjs
      - name: Commit compatibility and exact artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/curriculum/p03f-slice00{3,4,5,6,7,8,9}-*.test.js tests/curriculum/p03f-slice010-hundredth-decimal.test.js || true
          git add src/curriculum/full-product/p03f-slice00{5,6,7,8,9}-product-admission.mjs src/curriculum/full-product/p03f-slice010-product-admission.mjs || true
          git add tools/curriculum/validate-p03f-slice00{5,6,7,8,9}-product-admission.mjs tools/curriculum/validate-p03f-slice010-product-admission.mjs || true
          if [[ "${{ steps.materialization.outputs.needed }}" == "true" ]]; then
            git add data/curriculum/full-product/p03f/slice011-product-admission.manifest.json docs/curriculum/output/p03f-slice011-product-admission
          fi
          git diff --cached --stat
          if test -n "$(git diff --cached --name-only)"; then
            git commit -m "P03F11: materialize compatibility and Chromium artifacts"
            git fetch origin "${{ github.event.pull_request.head.ref }}"
            git rebase "origin/${{ github.event.pull_request.head.ref }}"
            git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload slice011 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice011-product-acceptance
          path: tmp/p03f-slice011-product-acceptance
          if-no-files-found: warn
          retention-days: 30

