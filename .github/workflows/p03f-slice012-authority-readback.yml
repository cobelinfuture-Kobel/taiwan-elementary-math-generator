name: P03F12 Slice012 Authority Readback

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readback:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice012-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize queue and source authority
        run: |
          mkdir -p tmp/p03f-slice012-authority-readback
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { materializeP03EW3DirectProductVerticalSliceQueue } from './src/curriculum/full-product/p03e-w3-direct-product-vertical-slice-queue.mjs';
          const queue = materializeP03EW3DirectProductVerticalSliceQueue();
          const slice = queue.queueEntries[11];
          const directRows = queue.directRows.filter((row) => slice.knowledgePointIds.includes(row.knowledgePointId));
          const output = {
            schemaName: 'P03F12AuthorityReadbackV1',
            queueFrozen: queue.queueFrozen,
            queueDigest: queue.queueRegistry?.queueDigest ?? null,
            slice,
            directRows,
          };
          fs.writeFileSync('tmp/p03f-slice012-authority-readback/readback.json', `${JSON.stringify(output, null, 2)}\n`);
          if (!queue.queueFrozen || slice.queuePosition !== 12 || directRows.length !== slice.knowledgePointCount) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p03f-slice012-authority-readback
          path: tmp/p03f-slice012-authority-readback/readback.json
          if-no-files-found: error
          retention-days: 7
