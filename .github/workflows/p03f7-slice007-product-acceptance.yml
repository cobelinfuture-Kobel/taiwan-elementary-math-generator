name: P03F7 Slice007 E5 Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f7-slice007-e5-finalizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice007-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout slice007 head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Run committed-byte E5 finalizer
        run: python tools/curriculum/finalize-p03f-slice007-e5.py
      - name: Commit E5 admission evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A tools/curriculum/finalize-p03f-slice007-e5.py \
            data/curriculum/full-product/p03f/slice007-product-admission.manifest.json \
            data/project/milestones/FPL-P03F7.claim.json \
            docs/curriculum/output/P03F_W3_DIRECT_PRODUCT_VERTICAL_SLICE007_READBACK.md \
            docs/curriculum/output/p03f-slice007-product-admission/p03f-slice007-product-acceptance-report.json \
            tests/curriculum/p03f-slice007-fraction-unit-conversion.test.js
          git commit -m 'P03F7: finalize committed hashes and E5 product admission'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
