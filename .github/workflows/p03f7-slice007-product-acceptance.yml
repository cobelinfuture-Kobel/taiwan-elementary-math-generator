name: P03F7 Slice007 Artifact Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f7-slice007-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice007-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout slice007 head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Validate and render exact slice007 product
        run: |
          node tools/curriculum/validate-p03f-slice007-product-admission.mjs
          node tools/curriculum/render-p03f-slice007-product-acceptance.mjs
      - name: Materialize reviewed HTML PDF report
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT=docs/curriculum/output/p03f-slice007-product-admission
          TMP=tmp/p03f-slice007-product-acceptance
          mkdir -p "$OUT"
          cp "$TMP/g3b-u07-fraction-unit-conversion-numeric.html" "$OUT/"
          cp "$TMP/g3b-u07-fraction-unit-conversion-numeric.pdf" "$OUT/"
          cp "$TMP/g3b-u07-fraction-unit-conversion-application.html" "$OUT/"
          cp "$TMP/g3b-u07-fraction-unit-conversion-application.pdf" "$OUT/"
          cp "$TMP/p03f-slice007-product-acceptance-report.json" "$OUT/"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/curriculum/output/p03f-slice007-product-admission/p03f-slice007-product-acceptance-report.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['status'] = 'PASS_VISUAL_AND_SEMANTIC_REVIEWED'
          data['visualReview'] = {
              'status': 'PASS_MANUAL_RENDER_REVIEW',
              'numericReviewed': True,
              'applicationReviewed': True,
              'answerKeysReviewed': True,
              'physicalPageParityReviewed': True,
              'clippedTextFindingCount': 0,
              'overlapFindingCount': 0,
              'brokenGlyphFindingCount': 0,
              'semanticScopeFindingCount': 0,
              'reviewBasis': 'Four rendered A4 pages reviewed: numeric/application question and answer-key pages.',
              'reviewedHeadSha': os.environ['HEAD_SHA'],
              'materializationWorkflowRunId': int(os.environ['RUN_ID']),
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit exact artifacts to slice007 branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/curriculum/output/p03f-slice007-product-admission
          if git diff --cached --quiet; then
            echo 'Artifacts already materialized.'
            exit 0
          fi
          git commit -m 'P03F7: materialize reviewed HTML PDF artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
