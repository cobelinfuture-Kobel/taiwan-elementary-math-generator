name: PGC-R04 Numeric Gap Inventory

on:
  pull_request:
    paths:
      - "tools/curriculum/materialize-pgc-r04-numeric-gap-inventory.mjs"
      - "tests/curriculum/pgc-r04-numeric-gap-inventory.test.js"
      - "data/curriculum/public-generation/numeric_generation_gap_inventory.json"
      - "data/curriculum/public-generation/numeric_generation_gap_inventory.csv"
      - "docs/curriculum/output/PGC-R04_numeric_generation_gap_inventory.md"
      - ".github/workflows/pgc-r04-numeric-gap-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r04-numeric-gap-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout R04 branch
        uses: actions/checkout@v4
        with:
          ref: pgc-r04-numeric-generation-fullfix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check inventory materializer
        run: node --check tools/curriculum/materialize-pgc-r04-numeric-gap-inventory.mjs

      - name: Materialize frozen numeric gap inventory fail-closed
        continue-on-error: true
        run: node tools/curriculum/materialize-pgc-r04-numeric-gap-inventory.mjs

      - name: Commit deterministic inventory artifacts before acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/curriculum/public-generation/numeric_generation_gap_inventory.json \
            data/curriculum/public-generation/numeric_generation_gap_inventory.csv \
            docs/curriculum/output/PGC-R04_numeric_generation_gap_inventory.md
          if git diff --cached --quiet; then
            echo "R04 inventory artifacts already synchronized."
          else
            git commit -m "data(pgc-r04): materialize numeric gap inventory [skip ci]"
            git fetch origin pgc-r04-numeric-generation-fullfix
            git rebase origin/pgc-r04-numeric-generation-fullfix
            git push origin HEAD:pgc-r04-numeric-generation-fullfix
          fi

      - name: Focused R04 inventory acceptance
        run: node --test tests/curriculum/pgc-r04-numeric-gap-inventory.test.js

      - name: Upload R04 inventory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r04-numeric-gap-inventory
          path: |
            data/curriculum/public-generation/numeric_generation_gap_inventory.json
            data/curriculum/public-generation/numeric_generation_gap_inventory.csv
            docs/curriculum/output/PGC-R04_numeric_generation_gap_inventory.md
          if-no-files-found: error
