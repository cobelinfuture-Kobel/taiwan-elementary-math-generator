name: P05F W5 Q041 Post-Merge Pages E2E

on:
  push:
    branches:
      - main
    paths:
      - 'data/curriculum/full-product/p05f/q041-g3b-u05-area-compare-same-perimeter-implementation.json'
      - '.github/workflows/p05f-w5-q041-live-pages-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p05f-w5-q041-postmerge-pages-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Q041 exact deployed Main Pages E2E
        env:
          P05F41_DEPLOYMENT_RETRIES: "30"
          P05F41_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: node tools/curriculum/run-p05f-w5-q041-live-pages-e2e.mjs
      - name: Upload Q041 Main Pages E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05f-w5-q041-pages-e2e
          path: tmp/p05f-w5-q041-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
