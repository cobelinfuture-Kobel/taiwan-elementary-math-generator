name: P03F27 R02 Exact Head Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p03f27-r02-exact-head-materialize.yml"
      - "site/modules/curriculum/public/public-ui-capability-binding.js"
      - "tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs"
      - "tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs"
      - "tests/curriculum/pgc-r02-public-ui-capability-binding.test.js"

permissions:
  contents: write

concurrency:
  group: p03f27-r02-exact-head-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Slice027 exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize current R02 authority with R06 lineage preservation
        run: node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs

      - name: Validate exact 218-KP authority and hidden application boundary
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const contract = JSON.parse(fs.readFileSync("data/curriculum/public-generation/ui_capability_binding_contract.json", "utf8"));
          if (contract.status !== "PASS") throw new Error(`R02 status ${contract.status}`);
          if (contract.summary.publicSourceCount !== 29) throw new Error(`source count ${contract.summary.publicSourceCount}`);
          if (contract.summary.visibleKnowledgePointCount !== 218) throw new Error(`KP count ${contract.summary.visibleKnowledgePointCount}`);
          if (contract.r06TerminalStatus !== "D0_CLOSED") throw new Error(`R06 terminal ${contract.r06TerminalStatus}`);
          const serialized = JSON.stringify(contract);
          for (const forbidden of [
            "ps_g4b_u08_fraction_compare_cross_product_comparison_application",
            "ps_g4b_u08_unlike_denominator_add_sub_result_application",
          ]) {
            if (serialized.includes(forbidden)) throw new Error(`hidden application spec leaked: ${forbidden}`);
          }
          console.log(`P03F27_R02_EXACT_HEAD=${JSON.stringify(contract.summary)}`);
          NODE
          node --test tests/curriculum/pgc-r02-public-ui-capability-binding.test.js

      - name: Commit generated authority and remove one-shot workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/ui_option_filter_matrix.csv \
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md
          git rm .github/workflows/p03f27-r02-exact-head-materialize.yml
          git commit -m "data(p03f27): materialize current 218-KP R02 authority"
          git fetch origin "$HEAD_BRANCH"
          git rebase "origin/$HEAD_BRANCH"
          git push origin "HEAD:$HEAD_BRANCH"
