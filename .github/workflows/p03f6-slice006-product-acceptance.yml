name: P03F6 Slice006 Artifact Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f6-artifact-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice006-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice006-v1
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Render exact slice006 artifacts
        run: |
          node tools/curriculum/validate-p03f-slice006-product-admission.mjs
          node tools/curriculum/render-p03f-slice006-product-acceptance.mjs
          mkdir -p docs/curriculum/output/p03f-slice006-product-admission
          cp tmp/p03f-slice006-product-acceptance/g3a-u08-same-denominator-compare-numeric.html docs/curriculum/output/p03f-slice006-product-admission/
          cp tmp/p03f-slice006-product-acceptance/g3a-u08-same-denominator-compare-numeric.pdf docs/curriculum/output/p03f-slice006-product-admission/
          cp tmp/p03f-slice006-product-acceptance/g3a-u08-same-denominator-compare-application.html docs/curriculum/output/p03f-slice006-product-admission/
          cp tmp/p03f-slice006-product-acceptance/g3a-u08-same-denominator-compare-application.pdf docs/curriculum/output/p03f-slice006-product-admission/
          cp tmp/p03f-slice006-product-acceptance/p03f-slice006-product-acceptance-report.json docs/curriculum/output/p03f-slice006-product-admission/
      - name: Commit materialized artifacts only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/curriculum/output/p03f-slice006-product-admission
          git commit -m "chore(p03f6): materialize reviewed HTML PDF artifacts"
          git push origin HEAD:p03f-w3-direct-product-vertical-slice006-v1
