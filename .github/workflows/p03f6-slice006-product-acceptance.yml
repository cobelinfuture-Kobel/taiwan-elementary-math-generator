name: P03F6 Slice006 Product Acceptance

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: p03f6-slice006-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice006-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Validate slice006 product admission
        run: node tools/curriculum/validate-p03f-slice006-product-admission.mjs
      - name: Render slice006 Chromium acceptance
        run: node tools/curriculum/render-p03f-slice006-product-acceptance.mjs
      - name: Upload slice006 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice006-product-acceptance
          path: tmp/p03f-slice006-product-acceptance
          if-no-files-found: warn
          retention-days: 30

