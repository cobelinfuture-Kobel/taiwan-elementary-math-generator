name: P03F6 E5 Artifact Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f6-e5-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice006-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice006-v1
          fetch-depth: 1
      - name: Finalize committed hashes, review and E5 claim
        run: python tools/curriculum/p03f6-finalize-e5.py
      - name: Commit E5 evidence and stage-aware test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(p03f6): admit reviewed artifacts at E5"
          git push origin HEAD:p03f-w3-direct-product-vertical-slice006-v1
