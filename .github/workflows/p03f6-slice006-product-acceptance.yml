name: P03F6 Slice006 Implementation Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f6-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice006-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice006-v1
          fetch-depth: 1
      - name: Reconstruct implementation materializer
        shell: bash
        run: |
          cat tmp/p03f6_bootstrap/payload.* | base64 --decode | gzip --decompress > tools/curriculum/p03f6-materialize-implementation.py
          python -m py_compile tools/curriculum/p03f6-materialize-implementation.py
      - name: Materialize exact slice006 tree
        shell: bash
        run: |
          python tools/curriculum/p03f6-materialize-implementation.py
          rm -rf tmp/p03f6_bootstrap
      - name: Validate materialized syntax and JSON
        shell: bash
        run: |
          find site src tools tests -type f \( -name '*.js' -o -name '*.mjs' \) -newer .git/index -print0 2>/dev/null | xargs -0 -r -n1 node --check
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
            Path('data/curriculum/full-product/p03f/slice006-same-denominator-compare-authority.json'),
            Path('data/curriculum/full-product/p03f/slice006-product-admission.manifest.json'),
            Path('data/project/milestones/FPL-P03F6.claim.json'),
          ]:
            json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Commit formal implementation tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(p03f6): implement same-denominator comparison vertical slice"
          git push origin HEAD:p03f-w3-direct-product-vertical-slice006-v1
