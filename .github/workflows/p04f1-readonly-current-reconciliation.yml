name: P04F1 Readonly Current Reconciliation

on:
  push:
    branches: [p04f1-w4-ruler-reading-implementation-v1]

permissions:
  contents: read

concurrency:
  group: p04f1-readonly-current-reconciliation
  cancel-in-progress: true

jobs:
  reconcile-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p04f1-w4-ruler-reading-implementation-v1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Materialize current-only reconciliation in working tree
        shell: bash
        run: |
          rm .github/workflows/p04f1-readonly-current-reconciliation.yml
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const inventoryTitles = new Set([
            'P03F3 current Pixel preserves early G3B-U07 KPs while later slices extend the current source surface',
            'P03F4 current Pixel retains historical sources and includes later successor sources and KPs',
            'P03F5 historical authority stays one KP while current Pixel expands monotonically through Slice043',
            'P03F6 current Classic and Pixel preserve four G3A-U08 KPs while successor sources extend',
            'P03F7 historical selector remains two KPs while current Pixel advances G3B-U07 to eight',
            'P03F8 historical selector remains three KPs while current Pixel includes later slices through Slice032',
            'P03F9 historical Classic stays at four KPs while current Pixel includes later slices through Slice032',
            'P03F10 historical selector stays at one G4A-U09 KP while current Pixel preserves it after successors',
            'P03F11 historical KP remains visible while current Pixel advances G4B-U06 monotonically through reconciled Slice042',
            'P03F12 selector remains two historical G4B-U08 KPs while current Pixel includes later slices through Slice043',
            'P03F13 historical selector stays two KPs while current Pixel advances through Slice037 monotonically',
            'P03F25 historical two-KP projection remains intact while current public total advances through Slice053 to 258',
            'P03F27 current registry advances through Slice053 to exactly 34 public sources and 258 visible KPs',
            'P03F28 historical selector remains 219 while current public inventory advances through Slice053 to 34 sources / 259 KPs',
            'P03F30 historical selector remains 30/224 while current inventory advances through Slice053 to 34/259',
            'P03F31 current source and Pixel inventories expand monotonically through Slice051',
            'P03F32 current Classic and Pixel inventories advance monotonically through Slice053 to 34 sources / 259 KPs',
            'P03F33 historical selector remains exactly 32 sources / 229 KPs while current Pixel advances through Slice053 to 259 KPs',
            'P03F33 pattern-group state remains intact while current Pixel registry advances through Slice053 to 34 sources / 259 KPs',
            'P03F34 historical selector stays exactly 32 sources / 230 KPs while current Pixel advances through Slice053 to 259 KPs',
            'P03F34 pattern-group state remains intact while Pixel current registry advances through Slice053 to 34 sources / 259 KPs',
            'P03F35 historical selector stays exactly 32 sources / 231 KPs while current Pixel remains monotonic',
            'P03F35 pattern-group state stays intact while Pixel current registry advances through Slice053 to 34 sources / 259 KPs',
            'P03F36 historical selector stays exactly 32 sources / 234 KPs while current Pixel advances through Slice053 to 259 KPs',
            'P03F36 pattern-group state stays intact while Pixel current registry advances through Slice053 to 34 sources / 259 KPs',
            'P03F37 historical authority remains 32/235 while current Pixel advances through Slice053 to 34/259',
            'P03F37 pattern group exposes exactly three target specs while current registry advances through Slice053 to 34/259',
            'P03F38 historical D0 authority remains 32/236 while current Pixel advances through Slice053 to 34/259',
            'P03F38 historical selector remains exactly 32/236 and G5A-U06 remains 5/2/2 while current Pixel advances through Slice053 to 34/259 and Slice030 stays historical',
            'P03F39 historical authority is exactly 32/237 while current Pixel advances through Slice053 to 34/259',
            'P03F39 current Pixel registry advances through Slice053 to 34/259 and G5B-U04 contains q031 q039 q045 plus q049 application and estimation',
            'P03F40 historical selector stays 33/238 and G5B-U06 1/4/4 while current Pixel advances through Slice053 to 34/259',
            'P03F41 current Pixel inventory through Slice053 is 34 sources / 259 KPs with G6B-U01 3/2/2',
            'P03F42 corrected current Pixel inventory advances through Slice053 to 34 sources / 259 KPs while G4B-U06 remains 6/0/0',
            'P03F44 current Pixel authority advances through Slice053 to 34/259 while G5A-U01 remains fully visible 8/0/0',
            'P03F45 current Pixel authority advances through Slice053 to 34/259 while G5B-U04 remains 5/0/0',
            'P03F46 current Pixel authority advances through Slice053 to 34/259 with G5B-U06 5/0/0',
            'P03F47 current Pixel authority advances through Slice053 to 34/259 and G6B-U01 remains 3/2/2',
            'P03F48 current Pixel authority advances through Slice053 to 34/259 while G5A-U01 remains fully visible 8/0/0',
            'q048 Classic/Pixel public surfaces preserve q048 binding while current registry advances to 34 sources and 259 KPs',
            'P03F49 current Pixel authority advances through Slice053 to 34/259 while G5B-U04 remains fully visible 5/0/0',
            'P03F50 current Pixel authority advances through Slice053 to 34/259 while G5B-U06 remains fully visible 5/0/0',
            'P03F51 current Pixel authority advances through Slice053 to 34/259 and G6A-U04 is 5/0/0',
            'P03F52 current Pixel authority is 34/259 and G6A-U04 remains 5/0/0',
            'P03F52 current Pixel authority is 34/259 and G6A-U04 is 5/0/0',
            'P03F53 current registry and exact rational runtime remain D0-usable',
            'P03F53 current Pixel authority is 34/259 and G6A-U04 is fully visible',
          ]);

          const consumerTitles = new Set([
            'P03F36 current Classic Pixel query-state and worksheet consumers point to P03F53 successors',
            'P03F37 current Classic Pixel query-state and worksheet consumers point to P03F53 successors',
            'P03F47 current Classic, Pixel and query-state consumers are cut over to the same Slice053 successor selector/binding',
            'P03F51 current Classic and Pixel consumers point to the Slice053 successor',
            'P03F53 current consumers stay cut over to Slice053 and Change Impact remains bounded L3',
          ]);

          const changed = new Set();

          function walk(dir) {
            const out=[];
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const p=path.join(dir,entry.name);
              if(entry.isDirectory()) out.push(...walk(p)); else if(entry.isFile() && p.endsWith('.test.js')) out.push(p.replaceAll('\\','/'));
            }
            return out;
          }

          function replaceTestBlock(file, title, transform) {
            const before=fs.readFileSync(file,'utf8');
            const quoted=JSON.stringify(title);
            let start=before.indexOf(`test(${quoted}`);
            if(start<0) start=before.indexOf(`test(\n  ${quoted}`);
            if(start<0) throw new Error(`P04F1_TEST_TITLE_NOT_FOUND:${file}:${title}`);
            const end=before.indexOf('\n});',start);
            if(end<0) throw new Error(`P04F1_TEST_BLOCK_END_NOT_FOUND:${file}:${title}`);
            const blockEnd=end+'\n});'.length;
            const block=before.slice(start,blockEnd);
            const next=transform(block);
            if(next===block) throw new Error(`P04F1_RECONCILIATION_NO_CHANGE:${file}:${title}`);
            fs.writeFileSync(file,before.slice(0,start)+next+before.slice(blockEnd));
            changed.add(file);
          }

          function advanceInventory(block) {
            return block
              .replaceAll('34/258','35/260')
              .replaceAll('34/259','35/260')
              .replaceAll('34 sources / 258 KPs','35 sources / 260 KPs')
              .replaceAll('34 sources / 259 KPs','35 sources / 260 KPs')
              .replaceAll('34 sources and 258 KPs','35 sources and 260 KPs')
              .replaceAll('34 sources and 259 KPs','35 sources and 260 KPs')
              .replaceAll('34 public sources and 258 visible KPs','35 public sources and 260 visible KPs')
              .replaceAll('34 public sources and 259 visible KPs','35 public sources and 260 visible KPs')
              .replaceAll('34 sources / 258 visible KPs','35 sources / 260 visible KPs')
              .replaceAll('34 sources / 259 visible KPs','35 sources / 260 visible KPs')
              .replaceAll('to 258 KPs','to 260 KPs')
              .replaceAll('to 259 KPs','to 260 KPs')
              .replace(/assert\.equal\(([^\n;]*?sourceCount),\s*34\);/g,'assert.equal($1, 35);')
              .replace(/assert\.equal\(([^\n;]*?visibleKnowledgePointCount),\s*(?:258|259)\);/g,'assert.equal($1, 260);')
              .replace(/assert\.equal\((sources\.length),\s*34\);/g,'assert.equal($1, 35);')
              .replace(/assert\.deepEqual\(([^\n;]+),\s*\[34,\s*(?:258|259)\]\);/g,'assert.deepEqual($1, [35, 260]);');
          }

          const files=walk('tests/curriculum');
          const titleToFile=new Map();
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            for(const title of [...inventoryTitles,...consumerTitles]) if(text.includes(title)) titleToFile.set(title,file);
          }

          for(const title of inventoryTitles){
            const file=titleToFile.get(title);
            if(!file) throw new Error(`P04F1_INVENTORY_TITLE_FILE_NOT_FOUND:${title}`);
            replaceTestBlock(file,title,advanceInventory);
          }

          for(const title of consumerTitles){
            const file=titleToFile.get(title);
            if(!file) throw new Error(`P04F1_CONSUMER_TITLE_FILE_NOT_FOUND:${title}`);
            replaceTestBlock(file,title,(block)=>block
              .replaceAll('P03F53','P04F1')
              .replaceAll('p03f53','p04f1')
              .replaceAll('Slice053 successor','P04F1 successor')
              .replaceAll('same Slice053 successor','same P04F1 successor'));
          }

          const pgcFile='tests/curriculum/pgc-r08-a04-a04-question-type-state-settlement.test.js';
          const pgcTitle='repair is one shared query-state reconciliation and does not extend timeouts or patch routes';
          replaceTestBlock(pgcFile,pgcTitle,(block)=>block.replace(
            'batch-a-selector-p03f\\d+-extension',
            'batch-a-selector-(?:p03f\\d+|p04f1)-extension'
          ));

          for(const file of ['tests/governance/gci-s01-workflow-inventory.test.js','tests/governance/gci-s02-pr-gate-pilot.test.js']){
            let text=fs.readFileSync(file,'utf8');
            const anchor='  ".github/workflows/p03f-slice053-core-acceptance.yml",\n';
            if(!text.includes(anchor)) throw new Error(`P04F1_GCI_ANCHOR_MISSING:${file}`);
            if(!text.includes('.github/workflows/p04f-slice001-product-acceptance.yml')){
              text=text.replace(anchor,`${anchor}  ".github/workflows/p04f-slice001-product-acceptance.yml",\n`);
            }
            if(file.endsWith('gci-s02-pr-gate-pilot.test.js')){
              text=text
                .replace('assert.equal(current.summary.pullRequestWorkflowCount, 102);','assert.equal(current.summary.pullRequestWorkflowCount, 103);')
                .replace('assert.equal(current.summary.lateSkipCandidateCount, 61);','assert.equal(current.summary.lateSkipCandidateCount, 62);');
            }
            fs.writeFileSync(file,text);
            changed.add(file);
          }

          if(changed.size<50) throw new Error(`P04F1_RECONCILIATION_TOO_SMALL:${changed.size}`);
          console.log(`P04F1_RECONCILED_FILES=${changed.size}`);
          for(const file of [...changed].sort()) console.log(`P04F1_RECONCILED_FILE=${file}`);
          NODE
      - name: Verify working-tree scope
        shell: bash
        run: |
          git diff --check
          git status --short
          test "$(git diff --name-only | grep -Ev '^(tests/|\.github/workflows/p04f1-readonly-current-reconciliation\.yml$)' | wc -l)" -eq 0
      - name: Run full regression on reconciled working tree
        id: full
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tmp/p04f1-current-reconciliation
          set +e
          npm test > tmp/p04f1-current-reconciliation/npm-test.log 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" > tmp/p04f1-current-reconciliation/npm-test-exit-code.txt
      - name: Export reconciled files and diff
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/p04f1-current-reconciliation/files
          git diff --binary > tmp/p04f1-current-reconciliation/reconciliation.patch
          git diff --name-only | grep -v '^\.github/workflows/p04f1-readonly-current-reconciliation.yml$' > tmp/p04f1-current-reconciliation/reconciled-files.txt
          while IFS= read -r file; do
            mkdir -p "tmp/p04f1-current-reconciliation/files/$(dirname "$file")"
            cp "$file" "tmp/p04f1-current-reconciliation/files/$file"
          done < tmp/p04f1-current-reconciliation/reconciled-files.txt
      - name: Upload reconciliation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04f1-current-reconciliation
          path: tmp/p04f1-current-reconciliation
          if-no-files-found: error
          retention-days: 7
      - name: Enforce full regression pass
        if: steps.full.outputs.exit_code != '0'
        run: exit 1
