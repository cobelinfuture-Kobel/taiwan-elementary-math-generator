name: P07F W7 Q001 Post-Merge Pages E2E
on:
  workflow_dispatch:

permissions:
contents: read
jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/run-p07f-w7-q001-live-pages-e2e.mjs
        env:
          P07F01_DEPLOYMENT_RETRIES: "40"
          P07F01_DEPLOYMENT_RETRY_DELAY_MS: "15000"
      - uses: actions/upload-artifact@v4
        with:
          name: p07f-w7-q001-pages-e2e
          path: tmp/p07f-w7-q001-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
