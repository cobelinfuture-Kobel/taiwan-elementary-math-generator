name: P04F1 Readonly Current Reconciliation V4

on:
  push:
    branches: [p04f1-w4-ruler-reading-implementation-v1]

permissions:
  contents: write

concurrency:
  group: p04f1-readonly-current-reconciliation-v4
  cancel-in-progress: true

jobs:
  reconcile-and-stage-tested-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p04f1-w4-ruler-reading-implementation-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize minimal current-only reconciliation
        shell: bash
        run: |
          rm .github/workflows/p04f1-readonly-current-reconciliation.yml
          rm .github/workflows/p04f1-readonly-current-reconciliation-v2.yml
          rm .github/workflows/p04f1-readonly-current-reconciliation-v3.yml
          rm .github/workflows/p04f1-readonly-current-reconciliation-v4.yml
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const changed=new Set();
          function walk(dir){const out=[];for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())out.push(...walk(p));else if(e.isFile()&&p.endsWith('.test.js'))out.push(p.replaceAll('\\','/'));}return out;}
          function put(file,text,before){if(text!==before){fs.writeFileSync(file,text);changed.add(file);}}
          for(const file of walk('tests/curriculum').filter(f=>f.includes('/p03f-'))){
            const before=fs.readFileSync(file,'utf8');
            let t=before
              .replace(/assert\.equal\((listCurrentPixelSourceOptions\(\)\.length),\s*34\);/g,'assert.equal($1, 35);')
              .replace(/assert\.equal\((getCurrentPixelRegistrySnapshot\(\)\.sourceCount),\s*34\);/g,'assert.equal($1, 35);')
              .replace(/assert\.equal\(((?:pixel|registry|currentPixel|snapshot)\.sourceCount),\s*34\);/g,'assert.equal($1, 35);')
              .replace(/assert\.equal\(((?:pixel|registry|currentPixel|snapshot)\.visibleKnowledgePointCount),\s*(?:258|259)\);/g,'assert.equal($1, 260);')
              .replace(/\[34,\s*(?:258|259)\]/g,(m,offset,whole)=>{const ctx=whole.slice(Math.max(0,offset-180),offset);return /(?:pixel|registry|current)/i.test(ctx)?'[35, 260]':m;})
              .replaceAll('public-ui-capability-binding-p03f53\\.js','public-ui-capability-binding-p04f1\\.js')
              .replaceAll('batch-a-selector-p03f53-extension\\.js','batch-a-selector-p04f1-extension\\.js')
              .replaceAll('batch-a-browser-worksheet-p03f53-extension\\.js','batch-a-browser-worksheet-p04f1-extension\\.js');
            if(['tests/curriculum/p03f-slice003-quotient-fraction.test.js','tests/curriculum/p03f-slice004-tenth-decimal.test.js','tests/curriculum/p03f-slice005-equivalent-fraction.test.js','tests/curriculum/p03f-slice010-hundredth-decimal.test.js'].includes(file)){
              t=t.replace(/(const sources\s*=\s*listCurrentPixelSourceOptions\(\);[\s\S]{0,220}?assert\.equal\(sources\.length,\s*)34(\);)/g,'$135$2');
            }
            put(file,t,before);
          }
          const pgc='tests/curriculum/pgc-r08-a04-a04-question-type-state-settlement.test.js';
          {const before=fs.readFileSync(pgc,'utf8');const t=before.replace('batch-a-selector-p03f\\d+-extension','batch-a-selector-(?:p03f\\d+|p04f1)-extension');put(pgc,t,before);}
          const controls='site/assets/browser/state/public-pattern-group-selection.js';
          {const before=fs.readFileSync(controls,'utf8');const t=before.replace('batch-a-selector-p03f53-extension.js','batch-a-selector-p04f1-extension.js');if(t===before)throw new Error('P04F1_PATTERN_GROUP_CONTROLS_POINTER_NOT_FOUND');put(controls,t,before);}
          for(const file of ['tests/governance/gci-s01-workflow-inventory.test.js','tests/governance/gci-s02-pr-gate-pilot.test.js']){
            const before=fs.readFileSync(file,'utf8');let t=before;
            const anchor='  ".github/workflows/p03f-slice053-core-acceptance.yml",\n';
            if(!t.includes(anchor))throw new Error(`P04F1_GCI_ANCHOR_MISSING:${file}`);
            if(!t.includes('.github/workflows/p04f-slice001-product-acceptance.yml'))t=t.replace(anchor,`${anchor}  ".github/workflows/p04f-slice001-product-acceptance.yml",\n`);
            if(file.endsWith('gci-s02-pr-gate-pilot.test.js'))t=t.replace('pullRequestWorkflowCount, 102','pullRequestWorkflowCount, 103').replace('lateSkipCandidateCount, 61','lateSkipCandidateCount, 62');
            put(file,t,before);
          }
          console.log(`P04F1_RECONCILED_FILES=${changed.size}`);
          NODE
      - name: Verify scope and exact tested manifest
        shell: bash
        run: |
          git diff --check
          bad="$(git diff --name-only | grep -Ev '^(tests/|site/assets/browser/state/public-pattern-group-selection\.js$|\.github/workflows/p04f1-readonly-current-reconciliation.*\.yml$)' || true)"
          test -z "$bad"
          grep -q 'batch-a-selector-p03f53-extension.js' tests/curriculum/p03f-slice053-g6a-u04-rank13-rounding.test.js
          grep -q 'BATCH_A_SELECTOR_AVAILABILITY.sourceCount,34' tests/curriculum/p03f-slice053-g6a-u04-rank13-rounding.test.js
          grep -q 'batch-a-selector-p04f1-extension.js' site/assets/browser/state/public-pattern-group-selection.js
          mkdir -p tmp/p04f1-current-reconciliation-v4
          git diff --name-only | grep -Ev '^\.github/workflows/p04f1-readonly-current-reconciliation.*\.yml$' > tmp/p04f1-current-reconciliation-v4/reconciled-files.txt
          test "$(wc -l < tmp/p04f1-current-reconciliation-v4/reconciled-files.txt)" -eq 53
          echo 'e21aa40f30bae5f002ad722d9249c74e4aadf18f107c4fb24de56715f7f7fa0c  tmp/p04f1-current-reconciliation-v4/reconciled-files.txt' | sha256sum -c -
          sha256sum $(cat tmp/p04f1-current-reconciliation-v4/reconciled-files.txt) > tmp/p04f1-current-reconciliation-v4/formal-file-sha256.txt
          echo 'fd6a9812cc1151567508252269ac984f3ce0abf80cbb730359addff7e22c8f1b  tmp/p04f1-current-reconciliation-v4/formal-file-sha256.txt' | sha256sum -c -
      - name: Stage detached consolidated Git candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const repo=process.env.GITHUB_REPOSITORY;
            const token=process.env.GITHUB_TOKEN;
            const headSha=process.env.GITHUB_SHA;
            const api='https://api.github.com';
            const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
            async function request(path, options={}){
              const response=await fetch(`${api}${path}`,{...options,headers:{...headers,...options.headers}});
              const text=await response.text();
              if(!response.ok)throw new Error(`GITHUB_API_${response.status}:${path}:${text}`);
              return text?JSON.parse(text):null;
            }
            const formalFiles=fs.readFileSync('tmp/p04f1-current-reconciliation-v4/reconciled-files.txt','utf8').trim().split('\n').filter(Boolean);
            if(formalFiles.length!==53)throw new Error(`P04F1_FORMAL_FILE_COUNT_${formalFiles.length}`);
            const head=await request(`/repos/${repo}/git/commits/${headSha}`);
            const entries=formalFiles.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}));
            for(const path of [
              '.github/workflows/p04f1-readonly-current-reconciliation.yml',
              '.github/workflows/p04f1-readonly-current-reconciliation-v2.yml',
              '.github/workflows/p04f1-readonly-current-reconciliation-v3.yml',
              '.github/workflows/p04f1-readonly-current-reconciliation-v4.yml'
            ])entries.push({path,mode:'100644',type:'blob',sha:null});
            const tree=await request(`/repos/${repo}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:head.tree.sha,tree:entries})});
            const commit=await request(`/repos/${repo}/git/commits`,{method:'POST',body:JSON.stringify({message:'test: reconcile P04F1 current authority after W4 q001',tree:tree.sha,parents:[headSha]})});
            const candidate={status:'DETACHED_CANDIDATE_CREATED_NO_REF_UPDATE',testedRunId:32871042251,testedHeadSha:'efa951d6b8a24ed023e379cb048b3932b7ce6f04',testedPassCount:3429,testedFailCount:0,fileListSha256:'e21aa40f30bae5f002ad722d9249c74e4aadf18f107c4fb24de56715f7f7fa0c',formalFileManifestSha256:'fd6a9812cc1151567508252269ac984f3ce0abf80cbb730359addff7e22c8f1b',baseHeadSha:headSha,baseTreeSha:head.tree.sha,candidateTreeSha:tree.sha,candidateCommitSha:commit.sha,formalFileCount:53,temporaryWorkflowDeletionCount:4};
            fs.writeFileSync('tmp/p04f1-current-reconciliation-v4/detached-candidate.json',JSON.stringify(candidate,null,2)+'\n');
            console.log(`P04F1_DETACHED_CANDIDATE=${commit.sha}`);
            console.log(`P04F1_DETACHED_TREE=${tree.sha}`);
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04f1-current-reconciliation-v4-stage-only
          path: tmp/p04f1-current-reconciliation-v4
          if-no-files-found: error
          retention-days: 7
