name: PGC-R02 UI Capability Binding

on:
  pull_request:
    paths:
      - "site/modules/curriculum/public/public-ui-capability-binding.js"
      - "site/assets/browser/public-capability-ui.js"
      - "site/pixel/pixel-public-capability-ui.js"
      - "site/index.html"
      - "site/404.html"
      - "site/pixel/index.html"
      - "tools/curriculum/apply-pgc-r02-public-ui-entry-patch.mjs"
      - "tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs"
      - "tools/curriculum/render-pgc-r02-public-ui-binding-acceptance.mjs"
      - "tests/curriculum/pgc-r02-public-ui-capability-binding.test.js"
      - "data/curriculum/public-generation/ui_capability_binding_contract.json"
      - "data/curriculum/public-generation/ui_option_filter_matrix.csv"
      - "docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md"
      - ".github/workflows/pgc-r02-ui-capability-binding.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r02-ui-capability-binding
  cancel-in-progress: true

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout R02 branch
        uses: actions/checkout@v4
        with:
          ref: pgc-r02-kp-driven-ui-binding
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deterministic public entry and observer patch
        run: node tools/curriculum/apply-pgc-r02-public-ui-entry-patch.mjs

      - name: Materialize UI binding authority fail-closed
        continue-on-error: true
        run: node tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs

      - name: Commit UI entries adapters and deterministic artifacts before acceptance
        run: |
          echo "PGC-R02 historical branch-writer step disabled by current CI safety policy."
          exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/index.html \
            site/404.html \
            site/pixel/index.html \
            site/assets/browser/public-capability-ui.js \
            site/pixel/pixel-public-capability-ui.js \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/ui_option_filter_matrix.csv \
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md
          if git diff --cached --quiet; then
            echo "R02 UI binding artifacts already synchronized."
          else
            git commit -m "data(pgc-r02): synchronize non-recursive KP-driven UI binding [skip ci]"
            git fetch origin pgc-r02-kp-driven-ui-binding
            git rebase origin/pgc-r02-kp-driven-ui-binding
            git push origin HEAD:pgc-r02-kp-driven-ui-binding
          fi

      - name: Focused R02 acceptance
        run: node --test tests/curriculum/pgc-r02-public-ui-capability-binding.test.js

      - name: Install browser dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Three-surface Chromium UI acceptance
        run: node tools/curriculum/render-pgc-r02-public-ui-binding-acceptance.mjs

      - name: Upload R02 Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r02-public-ui-binding-acceptance
          path: tmp/pgc-r02-public-ui-binding-acceptance
          if-no-files-found: warn
