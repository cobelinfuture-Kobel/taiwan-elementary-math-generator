name: P03F24 Exact Head Chromium Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/p03f24-exact-head-chromium-acceptance.yml"
      - "tools/curriculum/render-p03f-slice024-product-acceptance.mjs"

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stage discrete-item-safe fraction-plus-count sampler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("site/modules/curriculum/batch-a/fraction-context-runtime-p03f24.js")
          old = "const itemsPerWhole = 8 + 2 * ((ordinal + seedOffset(seed, 5)) % 5);"
          new = "const itemsPerWhole = 8 + 4 * ((ordinal + seedOffset(seed, 5)) % 5);"
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"unexpected sampler match count: {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          print("P03F24_DISCRETE_ITEM_SAFE_SAMPLER_STAGED=true")
          PY

      - name: Focused Slice024 diversity and discrete-item semantics
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/curriculum/p03f-slice024-fraction-context-core.test.js \
            tests/curriculum/p03f-slice024-diversity-regression.test.js
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { generateBatchABrowserQuestions } from "./site/modules/curriculum/batch-a/batch-a-browser-question-router-p03f24.js";
          import { G3B_U07_P03F24_NUMERIC_SPEC_IDS, G3B_U07_P03F24_APPLICATION_SPEC_IDS } from "./site/modules/curriculum/registry/g3b-u07-fraction-context-selector-projection-p03f24.js";

          for (const [questionMode, patternSpecIds, generationSeed] of [
            ["numeric", G3B_U07_P03F24_NUMERIC_SPEC_IDS, "p03f24-chromium-numeric"],
            ["application", G3B_U07_P03F24_APPLICATION_SPEC_IDS, "p03f24-chromium-application"],
          ]) {
            const result = generateBatchABrowserQuestions({
              sourceId: "g3b_u07_3b07",
              patternSpecIds,
              questionMode,
              questionCount: 20,
              generationSeed,
            });
            assert.equal(result.ok, true, JSON.stringify(result.errors));
            assert.equal(new Set(result.questions.map((q) => q.blankedDisplayText)).size, 20);
            for (const question of result.questions.filter((q) => q.conversion)) {
              const { itemsPerWhole } = question.conversion;
              assert.equal((itemsPerWhole * question.leftValue.numerator) % question.leftValue.denominator, 0, question.blankedDisplayText);
              assert.equal(Number.isInteger(question.conversion.itemCount), true, question.blankedDisplayText);
            }
          }
          console.log("P03F24_DISCRETE_ITEM_SEMANTICS=PASS");
          NODE

      - name: Install Chromium acceptance dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium

      - name: Run Slice024 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice024-product-acceptance.mjs

      - name: Create detached runtime blob after acceptance
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path="site/modules/curriculum/batch-a/fraction-context-runtime-p03f24.js"
          sha=$(python -c 'import base64,json,sys; p=sys.argv[1]; print(json.dumps({"content":base64.b64encode(open(p,"rb").read()).decode(),"encoding":"base64"}))' "$path" \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
          printf '%s %s\n' "$sha" "$path" | tee tmp/p03f-slice024-product-acceptance/runtime-blob-sha.txt

      - name: Upload Slice024 Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice024-product-acceptance
          path: tmp/p03f-slice024-product-acceptance
          if-no-files-found: error
          retention-days: 30
