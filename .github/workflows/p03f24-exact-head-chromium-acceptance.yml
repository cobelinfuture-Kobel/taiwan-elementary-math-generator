name: P03F24 Exact Head Chromium Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/p03f24-exact-head-chromium-acceptance.yml"
      - "tools/curriculum/render-p03f-slice024-product-acceptance.mjs"

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Chromium acceptance dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium

      - name: Run Slice024 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice024-product-acceptance.mjs

      - name: Upload Slice024 Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice024-product-acceptance
          path: tmp/p03f-slice024-product-acceptance
          if-no-files-found: error
          retention-days: 30
