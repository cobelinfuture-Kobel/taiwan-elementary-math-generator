name: PGC-R08 A04 A03 A01 Exact PatternGroup Replay

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pgc-r08-a04-a03-a01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: github.head_ref == 'pgc-r08-a04-a03-a01-exact-pattern-group-binder'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run exact binder contracts
        run: |
          node --test tests/curriculum/pgc-r08-a04-a03-a00-route-identity-expressibility.test.js
          node --test tests/curriculum/pgc-r08-a04-a03-a01-exact-pattern-group-binder.test.js
      - name: Replay all 136 route-binding routes
        run: node tools/curriculum/run-pgc-r08-a04-a03-a01-exact-pattern-group-replay.mjs
      - name: Upload exact binder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a03-a01-exact-pattern-group-replay
          path: |
            tmp/pgc-r08-a04-a03-a01-exact-pattern-group-replay
            tmp/pgc-r08-a03-all-legal-routes
          if-no-files-found: warn
          retention-days: 30
