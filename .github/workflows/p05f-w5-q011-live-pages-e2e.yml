name: P05F W5 Q011 Post-Merge Pages E2E

on:
  push:
    branches:
      - main
    paths:
      - 'data/curriculum/full-product/p05f/q011-g3a-u09-circle-geometry-property-implementation.json'
      - 'site/modules/curriculum/registry/g3a-u09-circle-geometry-property-selector-projection-p05f11.js'
      - 'site/modules/curriculum/registry/batch-a-selector-p05f11-extension.js'
      - 'site/modules/curriculum/public/public-ui-capability-binding-p05f11.js'
      - 'site/modules/curriculum/batch-a/g3a-u09-circle-geometry-property-runtime-p05f11.js'
      - 'site/modules/curriculum/batch-a/batch-a-browser-generator-p05f11.js'
      - 'site/modules/curriculum/batch-a/batch-a-browser-worksheet-p05f11-extension.js'
      - 'site/modules/renderer/circle-geometry-property-diagram.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p05f-w5-q011-postmerge-pages-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact merged main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Q011 exact deployed Main/Pages E2E
        env:
          P05F11_DEPLOYMENT_RETRIES: "36"
          P05F11_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: node tools/curriculum/run-p05f-w5-q011-live-pages-e2e.mjs

      - name: Upload Q011 Main/Pages E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05f-w5-q011-postmerge-main-pages-e2e
          path: tmp/p05f-w5-q011-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
