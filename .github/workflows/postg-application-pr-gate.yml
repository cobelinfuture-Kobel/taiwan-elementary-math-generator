name: POSTG Application PR Gate

on:
  workflow_call:
    inputs:
      base_sha:
        required: false
        type: string
      head_sha:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postg-application-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  application-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate single-orchestrator routing contract
        run: node --test tests/governance/postg-ci-two-gate-policy.test.js
      - name: Run POSTG application focused suite
        run: node --test tests/curriculum/postg-app-*.test.js
      - name: Validate master controller
        run: node tools/curriculum/validate-postg-app-m00-master-controller.mjs
      - name: Validate milestone claims
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^data/project/milestones/POSTG-APP-.*\.claim\.json$'; then
              npm run governance:claims:pr
              exit 0
            fi
          fi
          npm run governance:claims
