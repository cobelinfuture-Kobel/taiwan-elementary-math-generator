name: P03F Slice035 Post-Merge Pages E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/curriculum/run-p03f-slice035-live-pages-e2e.mjs"
      - ".github/workflows/p03f-slice035-live-pages-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p03f35-postmerge-pages-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-e2e:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p03f35-postmerge-pages-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Bind exact repaired Main/Pages evidence target
        env:
          P03F35_EXACT_MERGE_SHA: "3715ac02f993f8cc5a0d09e5599c427f788a3251"
          P03F35_EXACT_PAGES_RUN_ID: "31856970854"
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "tools/curriculum/run-p03f-slice035-live-pages-e2e.mjs";
          let source = readFileSync(path, "utf8");
          source = source.replace(
            /const EXACT_MERGE_SHA = "[0-9a-f]+";/,
            `const EXACT_MERGE_SHA = "${process.env.P03F35_EXACT_MERGE_SHA}";`,
          );
          source = source.replace(
            /const EXACT_PAGES_RUN_ID = \d+;/,
            `const EXACT_PAGES_RUN_ID = ${process.env.P03F35_EXACT_PAGES_RUN_ID};`,
          );
          writeFileSync(path, source);
          NODE

      - name: Run Slice035 exact deployed Main/Pages E2E
        env:
          P03F35_DEPLOYMENT_RETRIES: "20"
          P03F35_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: node tools/curriculum/run-p03f-slice035-live-pages-e2e.mjs

      - name: Upload Slice035 Main/Pages E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice035-postmerge-main-pages-e2e
          path: tmp/p03f-slice035-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
