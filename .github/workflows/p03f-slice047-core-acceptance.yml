name: P03F Slice047 Core Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p03f47-core-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-core-acceptance:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p03f47-g6b-u01-rank10-mixed-decimal-fraction-add-sub'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run Slice047 focused contracts
        run: |
          node --test \
            tests/curriculum/p03f-slice047-g6b-u01-rank10-mixed-decimal-fraction-add-sub.test.js \
            tests/curriculum/p03f-slice047-public-ui-binding.test.js

  chromium-product-acceptance:
    needs: focused-core-acceptance
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p03f47-g6b-u01-rank10-mixed-decimal-fraction-add-sub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and acceptance font
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium
      - name: Run Slice047 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice047-product-acceptance.mjs
      - name: Upload Slice047 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice047-product-acceptance
          path: tmp/p03f-slice047-product-acceptance
          if-no-files-found: error
          retention-days: 30
