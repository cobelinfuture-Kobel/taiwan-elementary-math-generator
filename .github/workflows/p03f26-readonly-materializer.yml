name: P03F26 One Shot Staging Materializer

on:
  push:
    branches:
      - p03f26-readonly-materialize-staging

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p03f26-readonly-materialize-staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply exact Slice026 current-consumer cutover
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            "site/modules/curriculum/registry/batch-a-selector-extension.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
              ("P03F25 successor", "P03F26 successor"),
            ],
            "site/modules/curriculum/public/public-ui-capability-binding.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/assets/browser/state/public-pattern-group-selection.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/pixel/pixel-registry-bridge.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/modules/curriculum/batch-a/batch-a-browser-worksheet-s59j-r1-extension.js": [
              ("batch-a-browser-worksheet-p03f25-extension.js", "batch-a-browser-worksheet-p03f26-extension.js"),
            ],
            "tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "tests/curriculum/pgc-r02-public-ui-capability-binding.test.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
              ("assert.equal(contract.summary.visibleKnowledgePointCount, 212);", "assert.equal(contract.summary.visibleKnowledgePointCount, 216);"),
            ],
          }
          for repo_path, pairs in replacements.items():
            path = Path(repo_path)
            text = path.read_text(encoding="utf-8")
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f"P03F26_EXPECTED_TOKEN_MISSING:{repo_path}:{old}")
              text = text.replace(old, new)
            path.write_text(text, encoding="utf-8")
          PY

      - name: Materialize canonical PGC-R02 authority
        run: node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs

      - name: Focused acceptance
        run: |
          node --test \
            tests/curriculum/p03f-slice026-authority-preflight.test.js \
            tests/curriculum/p03f-slice026-g4a-u09-rank8-decimal.test.js \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js

      - name: Publish exact staging tree and remove executor
        run: |
          rm -f .github/workflows/p03f26-readonly-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/p03f26-readonly-materializer.yml \
            site/modules/curriculum/registry/batch-a-selector-extension.js \
            site/modules/curriculum/public/public-ui-capability-binding.js \
            site/assets/browser/state/public-pattern-group-selection.js \
            site/pixel/pixel-registry-bridge.js \
            site/modules/curriculum/batch-a/batch-a-browser-worksheet-s59j-r1-extension.js \
            tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/ui_option_filter_matrix.csv \
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md
          git diff --cached --check
          git commit -m "fix(p03f26): materialize current consumer cutover [skip ci]"
          git push origin HEAD:p03f26-readonly-materialize-staging
