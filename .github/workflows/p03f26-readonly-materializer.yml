name: P03F26 Readonly Cutover Materializer

on:
  push:
    branches:
      - p03f26-readonly-materialize-staging

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply Slice026 current-consumer cutover in workspace only
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            "site/modules/curriculum/registry/batch-a-selector-extension.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
              ("P03F25 successor", "P03F26 successor"),
            ],
            "site/modules/curriculum/public/public-ui-capability-binding.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/assets/browser/state/public-pattern-group-selection.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/pixel/pixel-registry-bridge.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/modules/curriculum/batch-a/batch-a-browser-worksheet-s59j-r1-extension.js": [
              ("batch-a-browser-worksheet-p03f25-extension.js", "batch-a-browser-worksheet-p03f26-extension.js"),
            ],
            "tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "tests/curriculum/pgc-r02-public-ui-capability-binding.test.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
              ("assert.equal(contract.summary.visibleKnowledgePointCount, 212);", "assert.equal(contract.summary.visibleKnowledgePointCount, 216);"),
            ],
          }

          for repo_path, pairs in replacements.items():
            path = Path(repo_path)
            text = path.read_text(encoding="utf-8")
            original = text
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f"P03F26_EXPECTED_TOKEN_MISSING:{repo_path}:{old}")
              text = text.replace(old, new)
            if text == original:
              raise SystemExit(f"P03F26_NO_CHANGE:{repo_path}")
            path.write_text(text, encoding="utf-8")
          PY

      - name: Materialize deterministic PGC-R02 authority
        run: node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs

      - name: Focused Slice026 and PGC-R02 acceptance
        run: |
          node --test \
            tests/curriculum/p03f-slice026-authority-preflight.test.js \
            tests/curriculum/p03f-slice026-g4a-u09-rank8-decimal.test.js \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js

      - name: Verify exact output scope
        run: |
          git diff --check
          git status --short

      - name: Stage exact materialized files for artifact
        run: |
          mkdir -p tmp/p03f26-readonly-materialized/site/modules/curriculum/registry
          mkdir -p tmp/p03f26-readonly-materialized/site/modules/curriculum/public
          mkdir -p tmp/p03f26-readonly-materialized/site/assets/browser/state
          mkdir -p tmp/p03f26-readonly-materialized/site/pixel
          mkdir -p tmp/p03f26-readonly-materialized/site/modules/curriculum/batch-a
          mkdir -p tmp/p03f26-readonly-materialized/tools/curriculum
          mkdir -p tmp/p03f26-readonly-materialized/tests/curriculum
          mkdir -p tmp/p03f26-readonly-materialized/data/curriculum/public-generation
          mkdir -p tmp/p03f26-readonly-materialized/docs/curriculum/output
          cp site/modules/curriculum/registry/batch-a-selector-extension.js tmp/p03f26-readonly-materialized/site/modules/curriculum/registry/
          cp site/modules/curriculum/public/public-ui-capability-binding.js tmp/p03f26-readonly-materialized/site/modules/curriculum/public/
          cp site/assets/browser/state/public-pattern-group-selection.js tmp/p03f26-readonly-materialized/site/assets/browser/state/
          cp site/pixel/pixel-registry-bridge.js tmp/p03f26-readonly-materialized/site/pixel/
          cp site/modules/curriculum/batch-a/batch-a-browser-worksheet-s59j-r1-extension.js tmp/p03f26-readonly-materialized/site/modules/curriculum/batch-a/
          cp tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs tmp/p03f26-readonly-materialized/tools/curriculum/
          cp tests/curriculum/pgc-r02-public-ui-capability-binding.test.js tmp/p03f26-readonly-materialized/tests/curriculum/
          cp data/curriculum/public-generation/ui_capability_binding_contract.json tmp/p03f26-readonly-materialized/data/curriculum/public-generation/
          cp data/curriculum/public-generation/ui_option_filter_matrix.csv tmp/p03f26-readonly-materialized/data/curriculum/public-generation/
          cp docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md tmp/p03f26-readonly-materialized/docs/curriculum/output/

      - name: Upload exact materialized cutover
        uses: actions/upload-artifact@v4
        with:
          name: p03f26-readonly-materialized-cutover
          path: tmp/p03f26-readonly-materialized
          if-no-files-found: error
