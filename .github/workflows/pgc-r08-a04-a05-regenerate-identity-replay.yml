name: PGC-R08 A04 A05 Regenerate Identity Replay

on:
  pull_request:
    paths:
      - "site/modules/curriculum/batch-a/regenerate-identity-seed-order.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-question-router.js"
      - "data/curriculum/public-generation/PGC-R08-A04-A05.regenerate-identity-plan.json"
      - "tests/curriculum/pgc-r08-a04-a05-regenerate-identity.test.js"
      - "tools/curriculum/run-pgc-r08-a04-a05-regenerate-identity-replay.mjs"
      - ".github/workflows/pgc-r08-a04-a05-regenerate-identity-replay.yml"

permissions:
  contents: read

concurrency:
  group: pgc-r08-a04-a05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-ten-route-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused contract tests
        run: node --test tests/curriculum/pgc-r08-a04-a05-regenerate-identity.test.js

      - name: Exact ten-route browser replay
        run: node tools/curriculum/run-pgc-r08-a04-a05-regenerate-identity-replay.mjs

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a05-regenerate-identity-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a04-a05-regenerate-identity
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: warn
          retention-days: 14
