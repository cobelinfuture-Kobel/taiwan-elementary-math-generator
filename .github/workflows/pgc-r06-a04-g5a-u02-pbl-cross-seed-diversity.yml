name: PGC-R06 A04 G5A-U02 PBL Cross-Seed Diversity

on:
  pull_request:
    paths:
      - "site/modules/curriculum/public/fifteen-unit-public-pbl-runtime.js"
      - "tests/curriculum/fifteen-unit-public-pbl-pipeline.test.js"
      - "tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs"
      - "tools/curriculum/apply-pgc-r06-a04-stale-repair-queue-baseline-fix.mjs"
      - "tools/curriculum/apply-pgc-r06-a04-historical-governance-compatibility-fix.mjs"
      - "data/curriculum/public-generation/PGC-R06-A04.g5a-u02-pbl-cross-seed-diagnostics.json"
      - "data/curriculum/public-generation/generator_capacity_contract.json"
      - "data/curriculum/public-generation/ui_capability_binding_contract.json"
      - "data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json"
      - "site/modules/curriculum/public/public-generator-capacity-registry.js"
      - "docs/curriculum/output/PGC-R06-A04_G5A_U02_PBL_CrossSeedDiversity.md"
      - ".github/workflows/pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout A04 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check A04 authorities
        run: |
          node --check site/modules/curriculum/public/fifteen-unit-public-pbl-runtime.js
          node --check tests/curriculum/fifteen-unit-public-pbl-pipeline.test.js
          node --check tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs
          node --check tools/curriculum/apply-pgc-r06-a04-stale-repair-queue-baseline-fix.mjs
          node --check tools/curriculum/apply-pgc-r06-a04-historical-governance-compatibility-fix.mjs

      - name: Reconcile stale A03 queue materialization baseline
        run: node tools/curriculum/apply-pgc-r06-a04-stale-repair-queue-baseline-fix.mjs

      - name: Focused producer acceptance
        run: node --test tests/curriculum/fifteen-unit-public-pbl-pipeline.test.js

      - name: Materialize capacity public runtime and repair reconciliation
        run: node tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs

      - name: Require all 12 PBL routes reconciled
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const diagnostics = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06-A04.g5a-u02-pbl-cross-seed-diagnostics.json", "utf8"));
          const capacity = JSON.parse(fs.readFileSync("data/curriculum/public-generation/generator_capacity_contract.json", "utf8"));
          const ui = JSON.parse(fs.readFileSync("data/curriculum/public-generation/ui_capability_binding_contract.json", "utf8"));
          const inventory = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json", "utf8"));
          const target = capacity.routes.filter((route) => route.sourceId === "g5a_u02_5a02" && route.questionType === "pbl" && route.legalRoute === true);
          if (diagnostics.summary.targetRouteCount !== 12
            || diagnostics.summary.acceptedRouteCount !== 12
            || diagnostics.summary.failedRouteCount !== 0
            || target.length !== 12
            || target.some((route) => route.gapCodes.includes("CROSS_SEED_ITEM_DIVERSITY_DEFICIENT"))
            || target.some((route) => route.qualityStatus !== "DIVERSE_PARAMETER_GENERATOR")
            || inventory.repairQueue.length !== 35
            || inventory.repairQueue.some((route) => route.sourceId === "g5a_u02_5a02")
            || inventory.lastR06A04Reconciliation?.staleQueueMaterializationRepaired !== true
            || ui.lastR06A04Reconciliation?.status !== "PASS_R06_A04_PUBLIC_BINDING_RECONCILED") {
            throw new Error(`PGC_R06_A04_RECONCILIATION_GATE_FAILED:${JSON.stringify({ diagnostics: diagnostics.summary, queue: inventory.repairQueue.length })}`);
          }
          console.log(`PGC_R06_A04_GATE=PASS:${JSON.stringify({ routeCount: target.length, repairQueueAfter: inventory.repairQueue.length })}`);
          NODE

      - name: Apply historical and governance compatibility
        run: node tools/curriculum/apply-pgc-r06-a04-historical-governance-compatibility-fix.mjs

      - name: Focused compatibility acceptance
        run: |
          node --test tests/curriculum/pgc-r03-generator-capacity-contract.test.js
          node --test tests/curriculum/pgc-r06-a01-g4b-u04-capacity-contract-closeout.test.js
          node --test tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js
          node --test tests/governance/gci-s01-workflow-inventory.test.js
          node --test tests/governance/gci-s02-pr-gate-pilot.test.js

      - name: Full repository regression
        run: npm test

      - name: Commit A04 authorities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/curriculum/materialize-pgc-r06-a04-g5a-u02-pbl-cross-seed-diversity.mjs \
            tests/curriculum/pgc-r03-generator-capacity-contract.test.js \
            tests/curriculum/pgc-r06-a01-g4b-u04-capacity-contract-closeout.test.js \
            tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js \
            tests/governance/gci-s01-workflow-inventory.test.js \
            tests/governance/gci-s02-pr-gate-pilot.test.js \
            data/curriculum/public-generation/PGC-R06-A04.g5a-u02-pbl-cross-seed-diagnostics.json \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            docs/curriculum/output/PGC-R06-A04_G5A_U02_PBL_CrossSeedDiversity.md
          if git diff --cached --quiet; then
            echo "A04 authorities already synchronized."
          else
            git commit -m "chore(pgc-r06): materialize A04 PBL diversity authorities [skip ci]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
