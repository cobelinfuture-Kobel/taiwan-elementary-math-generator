name: P03F28 Slice028 Product Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p03f28-slice028-product-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  accept:
    if: github.head_ref == 'p03f28-g5a-u01-rank8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run focused Slice028 contracts
        run: node --test tests/curriculum/p03f-slice028-g5a-u01-rank8-decimal.test.js tests/curriculum/p03f-slice028-public-ui-binding.test.js
      - name: Install Chromium acceptance dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium
      - name: Run exact-head Slice028 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice028-product-acceptance.mjs
      - name: Upload exact-head Slice028 product artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice028-product-acceptance
          path: tmp/p03f-slice028-product-acceptance
          if-no-files-found: error
          retention-days: 30
