name: P06F W6 Q009 Post-Merge Pages E2E
on:
  push:
    branches: [main]
    paths:
      - "site/modules/renderer/one-way-statistics-table.js"
      - "site/modules/renderer/bar-chart-data.js"
      - "site/modules/curriculum/registry/g4b-u05-chart-construction-missing-compare-selector-projection-p06f09.js"
      - "site/modules/curriculum/registry/batch-a-selector-p06f09-extension.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p06f09.js"
      - "site/modules/curriculum/batch-a/g4b-u05-chart-construction-missing-compare-runtime-p06f09.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p06f09.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p06f09-extension.js"
permissions:
  contents: read
jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/run-p06f-w6-q009-live-pages-e2e.mjs
        env:
          P06F09_DEPLOYMENT_RETRIES: "30"
          P06F09_DEPLOYMENT_RETRY_DELAY_MS: "15000"
      - uses: actions/upload-artifact@v4
        with:
          name: p06f-w6-q009-pages-e2e
          path: tmp/p06f-w6-q009-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
