name: G5A-U02 S105 P1 P2 Source Parity Milestone Definition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate bounded P1 P2 source-parity program
        run: node --test tests/curriculum/g5a-u02-s105-p1-p2-source-parity-milestone-definition.test.js

  full-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - name: Run complete Node regression
        run: npm test

