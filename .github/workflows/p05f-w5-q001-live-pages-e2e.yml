name: P05F W5 Q001 Post-Merge Pages E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/curriculum/run-p05f-w5-q001-live-pages-e2e.mjs"
      - ".github/workflows/p05f-w5-q001-live-pages-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p05f-w5-q001-postmerge-pages-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-e2e:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p05f-w5-q001-postmerge-pages-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Run Q001 exact deployed Main/Pages E2E
        env:
          P05F1_DEPLOYMENT_RETRIES: "20"
          P05F1_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: node tools/curriculum/run-p05f-w5-q001-live-pages-e2e.mjs

      - name: Upload Q001 Main/Pages E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05f-w5-q001-postmerge-main-pages-e2e
          path: tmp/p05f-w5-q001-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
