name: PGC-R05 Application Generation FullFix

on:
  pull_request:
    paths:
      - "tools/curriculum/materialize-pgc-r05-application-gap-diagnostics.mjs"
      - "tests/curriculum/pgc-r05-application-gap-diagnostics.test.js"
      - "data/curriculum/public-generation/PGC-R05.application-gap-diagnostics.json"
      - "data/curriculum/public-generation/application_generation_gap_inventory.csv"
      - "docs/curriculum/output/PGC-R05_application_generation_gap_diagnostics.md"
      - ".github/workflows/pgc-r05-application-generation-full-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r05-application-generation-full-fix
  cancel-in-progress: true

jobs:
  application-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout R05 branch
        uses: actions/checkout@v4
        with:
          ref: pgc-r05-application-generation-full-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check R05 authorities
        run: |
          node --check tools/curriculum/materialize-pgc-r05-application-gap-diagnostics.mjs
          node --check tests/curriculum/pgc-r05-application-gap-diagnostics.test.js

      - name: Materialize legal application-route runtime baseline
        run: node tools/curriculum/materialize-pgc-r05-application-gap-diagnostics.mjs

      - name: Focused R05 baseline acceptance
        run: node --test tests/curriculum/pgc-r05-application-gap-diagnostics.test.js

      - name: Full repository regression
        run: npm test

      - name: Commit deterministic R05 baseline artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/curriculum/public-generation/PGC-R05.application-gap-diagnostics.json \
            data/curriculum/public-generation/application_generation_gap_inventory.csv \
            docs/curriculum/output/PGC-R05_application_generation_gap_diagnostics.md
          if git diff --cached --quiet; then
            echo "R05 baseline artifacts already synchronized."
          else
            git commit -m "docs(pgc-r05): materialize application gap baseline [skip ci]"
            git fetch origin pgc-r05-application-generation-full-fix
            git rebase origin/pgc-r05-application-generation-full-fix
            git push origin HEAD:pgc-r05-application-generation-full-fix
          fi

      - name: Upload R05 application baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r05-application-gap-baseline
          path: |
            data/curriculum/public-generation/PGC-R05.application-gap-diagnostics.json
            data/curriculum/public-generation/application_generation_gap_inventory.csv
            docs/curriculum/output/PGC-R05_application_generation_gap_diagnostics.md
          if-no-files-found: error
