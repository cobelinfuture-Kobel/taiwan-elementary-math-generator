name: PGC-R05 Application Generation FullFix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgc-r05-application-generation-historical-readback-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  historical-readback:
    name: Historical R05 application read-only acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate committed R05 D0 terminal authority
        run: node --test tests/curriculum/pgc-r05-capacity-contract-reconciliation-d0.test.js
      - name: Focused historical R05 application acceptance
        run: |
          node --test tests/curriculum/pgc-r05-application-gap-diagnostics.test.js
          node --test tests/curriculum/pgc-r05-bounded-application-capacity.test.js
          node --test tests/curriculum/pgc-r05-source-unit-application-alias.test.js
          node --test tests/curriculum/pgc-r05-g5a-u02-application-diversity.test.js
          node --test tests/curriculum/pgc-r05-g3b-u04-application-diversity.test.js
          node --test tests/curriculum/pgc-r05-g5a-u08-application-diversity.test.js
          node --test tests/curriculum/pgc-r05-g3a-u08-application-diversity.test.js
          node --test tests/curriculum/pgc-r05-g3b-u07-application-diversity.test.js
          node --test tests/curriculum/pgc-r05-g4a-u08-application-diversity.test.js
          node --test tests/curriculum/pgc-r05-g5a-u03-application-diversity.test.js
