name: PGC-R08 A06 One-Shot Closeout Authority Writer

on:
  pull_request:
    paths:
      - ".github/workflows/pgc-r08-a06-closeout-writeback.yml"

permissions:
  contents: write

jobs:
  closeout-writeback:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize A06 closeout
        run: python tools/curriculum/materialize-pgc-r08-a04-a06-closeout.py

      - name: Commit closeout and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curriculum/public-generation tests/curriculum
          git rm \
            .github/workflows/pgc-r08-a06-closeout-writeback.yml \
            tools/curriculum/materialize-pgc-r08-a04-a06-closeout.py
          git commit -m "PGC-R08 A06 materialize final closeout authority [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
