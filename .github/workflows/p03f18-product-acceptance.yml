name: P03F18 Slice018 Chromium Product Acceptance TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03f18-product-acceptance.yml'
      - 'tools/curriculum/render-p03f-slice018-product-acceptance.mjs'
      - 'data/curriculum/full-product/p03f/slice018-decimal-compose-decompose-authority.json'
      - 'site/modules/curriculum/batch-a/**p03f18*'
      - 'site/modules/curriculum/batch-a/decimal-compose-decompose-runtime-p03f18.js'
      - 'site/modules/curriculum/registry/batch-a-selector-p03f18-extension.js'
      - 'site/modules/curriculum/registry/g4a-u09-decimal-compose-decompose-selector-projection.js'
      - 'tests/curriculum/p03f-slice018-decimal-compose-decompose.test.js'
      - 'tests/curriculum/p03f-slice018-current-surface-cutover.test.js'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install project dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1

      - name: Validate Slice018 focused contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/p03f-slice018-product-acceptance
          node --test tests/curriculum/p03f-slice018-decimal-compose-decompose.test.js tests/curriculum/p03f-slice018-current-surface-cutover.test.js 2>&1 | tee tmp/p03f-slice018-product-acceptance/focused-test.log

      - name: Run read-only Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice018-product-acceptance.mjs

      - name: Verify repository remained read-only
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload Slice018 product acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice018-product-acceptance
          path: tmp/p03f-slice018-product-acceptance
          if-no-files-found: error
          retention-days: 30
