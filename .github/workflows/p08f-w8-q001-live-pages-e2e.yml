name: P08F W8 Q001 Post-Merge Pages E2E
on:
  push:
    branches: [main]
    paths:
      - "site/modules/curriculum/batch-a/source-units.js"
      - "site/modules/curriculum/registry/g4a-u03-protractor-angle-measurement-selector-projection-p08f01.js"
      - "site/modules/curriculum/registry/batch-a-selector-p08f01-extension.js"
      - "site/modules/curriculum/registry/batch-a-selector-p04f33-extension.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p08f01.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p04f33.js"
      - "site/modules/curriculum/batch-a/g4a-u03-protractor-angle-measurement-runtime-p08f01.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p08f01.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p05f60.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p08f01-extension.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p05f60-extension.js"
      - "site/modules/renderer/protractor-angle-measurement-diagram-p08f01.js"
      - "site/modules/renderer/html-renderer.js"
permissions:
  contents: read
jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/run-p08f-w8-q001-live-pages-e2e.mjs
        env:
          P08F01_DEPLOYMENT_RETRIES: "40"
          P08F01_DEPLOYMENT_RETRY_DELAY_MS: "15000"
      - uses: actions/upload-artifact@v4
        with:
          name: p08f-w8-q001-pages-e2e
          path: tmp/p08f-w8-q001-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
