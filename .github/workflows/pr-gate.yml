name: PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify_validation:
    name: Classify validation impact
    runs-on: ubuntu-latest
    outputs:
      policy_conformance: ${{ steps.classify.outputs.policy_conformance }}
      derived_gate: ${{ steps.classify.outputs.derived_gate }}
      run_full_regression: ${{ steps.classify.outputs.run_full_regression }}
      run_global_replay: ${{ steps.classify.outputs.run_global_replay }}
      governance_changed: ${{ steps.classify.outputs.governance_changed }}
      impact_manifest_path: ${{ steps.classify.outputs.impact_manifest_path }}
      current_scope: ${{ steps.classify.outputs.current_scope }}
      global_replay_execution_status: ${{ steps.classify.outputs.global_replay_execution_status }}
      postg_changed: ${{ steps.postg.outputs.postg_changed }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize changed-file inventory
        shell: bash
        run: |
          mkdir -p tmp/pr-gate
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            head_sha="$(git rev-parse HEAD)"
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base_sha" "$head_sha" | sort > tmp/pr-gate/changed-files.txt
          cat tmp/pr-gate/changed-files.txt
      - name: Detect POSTG application focused-gate impact
        id: postg
        shell: bash
        run: node tools/governance/detect-postg-application-impact.mjs tmp/pr-gate/changed-files.txt "$GITHUB_OUTPUT"
      - name: Classify validation policy
        id: classify
        shell: bash
        run: |
          node tools/governance/classify-unit-validation-impact.mjs \
            --policy .github/ci/unit-validation-policy.json \
            --changed-files tmp/pr-gate/changed-files.txt \
            --github-output "$GITHUB_OUTPUT" \
            --json-out tmp/pr-gate/classification.json
      - name: Upload validation classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-validation-classification
          path: |
            tmp/pr-gate/changed-files.txt
            tmp/pr-gate/classification.json
          if-no-files-found: warn
          retention-days: 30

  postg_application:
    name: POSTG Application focused reusable gate
    needs: classify_validation
    if: needs.classify_validation.outputs.postg_changed == 'true'
    uses: ./.github/workflows/postg-application-pr-gate.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read

  focused_governance:
    name: Focused validation governance QA
    needs: classify_validation
    if: needs.classify_validation.outputs.governance_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run GCI/UIV governance contracts
        shell: bash
        run: |
          set -o pipefail
          find tests/governance -maxdepth 1 -type f -name 'gci-*.test.js' -print0 \
            | sort -z \
            | xargs -0 node --test
          node --test tests/governance/postg-ci-two-gate-policy.test.js
      - name: Materialize current PR workflow fanout inventory
        shell: bash
        run: node tools/governance/inventory-current-pr-workflows.mjs tmp/pr-gate/current-pr-workflow-inventory.json
      - name: Upload current PR workflow fanout inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gci-uiv02-current-pr-workflow-inventory
          path: tmp/pr-gate/current-pr-workflow-inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare single-orchestrator trigger-only cutover preview
        shell: bash
        run: node tools/governance/prepare-single-pr-orchestrator-cutover.mjs tmp/pr-gate/uiv02-single-orchestrator-cutover
      - name: Upload single-orchestrator cutover preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gci-uiv02-single-orchestrator-cutover-preview
          path: tmp/pr-gate/uiv02-single-orchestrator-cutover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  full_regression:
    name: Full repository regression
    needs: classify_validation
    if: needs.classify_validation.outputs.run_full_regression == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run authoritative PR full regression
        shell: bash
        run: |
          mkdir -p tmp/pr-gate
          set -o pipefail
          npm test 2>&1 | tee tmp/pr-gate/npm-test.log
      - name: Upload full regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-full-regression-diagnostics
          path: tmp/pr-gate/npm-test.log
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: PR Gate / aggregate
    if: always()
    needs:
      - classify_validation
      - postg_application
      - focused_governance
      - full_regression
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate result
        env:
          CLASSIFY_RESULT: ${{ needs.classify_validation.result }}
          POSTG_RESULT: ${{ needs.postg_application.result }}
          POSTG_CHANGED: ${{ needs.classify_validation.outputs.postg_changed }}
          FOCUSED_RESULT: ${{ needs.focused_governance.result }}
          FULL_RESULT: ${{ needs.full_regression.result }}
          DERIVED_GATE: ${{ needs.classify_validation.outputs.derived_gate }}
          RUN_FULL_REGRESSION: ${{ needs.classify_validation.outputs.run_full_regression }}
          RUN_GLOBAL_REPLAY: ${{ needs.classify_validation.outputs.run_global_replay }}
          GLOBAL_REPLAY_STATUS: ${{ needs.classify_validation.outputs.global_replay_execution_status }}
        shell: bash
        run: |
          printf 'classify_validation=%s\n' "$CLASSIFY_RESULT"
          printf 'postg_application=%s\n' "$POSTG_RESULT"
          printf 'postg_changed=%s\n' "$POSTG_CHANGED"
          printf 'focused_governance=%s\n' "$FOCUSED_RESULT"
          printf 'full_regression=%s\n' "$FULL_RESULT"
          printf 'derived_gate=%s\n' "$DERIVED_GATE"
          printf 'run_full_regression=%s\n' "$RUN_FULL_REGRESSION"
          printf 'run_global_replay=%s\n' "$RUN_GLOBAL_REPLAY"
          printf 'global_replay_execution_status=%s\n' "$GLOBAL_REPLAY_STATUS"

          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$FOCUSED_RESULT" == "success" || "$FOCUSED_RESULT" == "skipped" ]]

          if [[ "$POSTG_CHANGED" == "true" ]]; then
            [[ "$POSTG_RESULT" == "success" ]]
          else
            [[ "$POSTG_RESULT" == "skipped" ]]
          fi

          if [[ "$RUN_FULL_REGRESSION" == "true" ]]; then
            [[ "$FULL_RESULT" == "success" ]]
          else
            [[ "$FULL_RESULT" == "skipped" ]]
          fi

          if [[ "$RUN_GLOBAL_REPLAY" == "true" ]]; then
            echo "GLOBAL_CERTIFICATION requires the canonical global browser replay gate. Layer 3 fails closed until that authority is aggregated."
            exit 1
          fi
