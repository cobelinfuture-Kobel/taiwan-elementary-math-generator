name: PGC-R06 A06 Final Five PBL Residual Closeout

on:
  pull_request:
    paths:
      - "site/modules/curriculum/public/fifteen-unit-public-pbl-runtime.js"
      - "tests/curriculum/pgc-r06-reasoning-mixed-pbl-inventory.test.js"
      - "tests/curriculum/pgc-r06-a06-five-pbl-residual-closeout.test.js"
      - "tools/curriculum/apply-pgc-r06-a06-canonical-gap-field-repair.mjs"
      - "tools/curriculum/materialize-pgc-r06-a06-five-pbl-residual-closeout.mjs"
      - "data/curriculum/public-generation/PGC-R06-A06.five-pbl-residual-diagnostics.json"
      - "data/curriculum/public-generation/generator_capacity_contract.json"
      - "data/curriculum/public-generation/ui_capability_binding_contract.json"
      - "data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json"
      - "data/curriculum/public-generation/reasoning_mixed_pbl_route_inventory.csv"
      - "site/modules/curriculum/public/public-generator-capacity-registry.js"
      - "docs/curriculum/output/PGC-R06-A06_5ResidualPBLFixtureDiversityFullFix.md"
      - ".github/workflows/pgc-r06-a06-five-pbl-residual-closeout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r06-a06-five-pbl-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout A06 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check A06 sources
        run: |
          node --check site/modules/curriculum/public/fifteen-unit-public-pbl-runtime.js
          node --check tests/curriculum/pgc-r06-reasoning-mixed-pbl-inventory.test.js
          node --check tests/curriculum/pgc-r06-a06-five-pbl-residual-closeout.test.js
          node --check tools/curriculum/apply-pgc-r06-a06-canonical-gap-field-repair.mjs
          node --check tools/curriculum/materialize-pgc-r06-a06-five-pbl-residual-closeout.mjs

      - name: Focused live runtime acceptance
        run: node --test tests/curriculum/pgc-r06-a06-five-pbl-residual-closeout.test.js

      - name: Repair prior reconciled canonical gap fields
        run: node tools/curriculum/apply-pgc-r06-a06-canonical-gap-field-repair.mjs

      - name: Materialize canonical A05 repair and A06 authorities
        run: node tools/curriculum/materialize-pgc-r06-a06-five-pbl-residual-closeout.mjs

      - name: Focused post-materialization acceptance
        run: |
          node --test tests/curriculum/pgc-r06-a06-five-pbl-residual-closeout.test.js
          node --test tests/curriculum/pgc-r06-reasoning-mixed-pbl-inventory.test.js

      - name: Require canonical queue zero
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const capacity = JSON.parse(fs.readFileSync("data/curriculum/public-generation/generator_capacity_contract.json", "utf8"));
          const inventory = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json", "utf8"));
          const ui = JSON.parse(fs.readFileSync("data/curriculum/public-generation/ui_capability_binding_contract.json", "utf8"));
          const diagnostics = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06-A06.five-pbl-residual-diagnostics.json", "utf8"));
          const target = capacity.routes.filter((route) => route.lastReconciliation?.taskId === "PGC-R06-A06_5ResidualPBLFixtureDiversityFullFix");
          if (diagnostics.summary.targetRouteCount !== 5
            || diagnostics.summary.acceptedRouteCount !== 5
            || diagnostics.summary.failedRouteCount !== 0
            || target.length !== 5
            || target.some((route) => route.downstreamGapCodes.length !== 0 || Object.hasOwn(route, "gapCodes"))
            || capacity.summary.diversityGapRouteCount !== 0
            || inventory.repairQueue.length !== 0
            || inventory.summary.repairQueueCount !== 0
            || inventory.lastR06A05Reconciliation?.canonicalGapFieldRepairApplied !== true
            || inventory.lastR06A06Reconciliation?.status !== "PASS_R06_A06_FINAL_FIVE_PBL_RECONCILED"
            || ui.lastR06A06Reconciliation?.status !== "PASS_R06_A06_PUBLIC_BINDING_RECONCILED") {
            throw new Error(`PGC_R06_A06_ZERO_QUEUE_GATE_FAILED:${JSON.stringify({ diagnostics: diagnostics.summary, target: target.length, capacityDiversity: capacity.summary.diversityGapRouteCount, queue: inventory.repairQueue.length })}`);
          }
          console.log(`PGC_R06_A06_ZERO_QUEUE_GATE=PASS:${JSON.stringify({ target: target.length, queue: inventory.repairQueue.length })}`);
          NODE

      - name: Freeze authority hashes before full regression
        run: |
          sha256sum \
            data/curriculum/public-generation/PGC-R06-A06.five-pbl-residual-diagnostics.json \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            data/curriculum/public-generation/reasoning_mixed_pbl_route_inventory.csv \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            > /tmp/a06-authority.sha256

      - name: Retire temporary A06 writer before full regression
        run: rm .github/workflows/pgc-r06-a06-five-pbl-residual-closeout.yml

      - name: Full repository regression
        run: npm test

      - name: Prove full regression is authority read-only
        run: sha256sum -c /tmp/a06-authority.sha256

      - name: Commit A06 authorities and retire writer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/pgc-r06-a06-five-pbl-residual-closeout.yml
          git add \
            site/modules/curriculum/public/fifteen-unit-public-pbl-runtime.js \
            tests/curriculum/pgc-r06-reasoning-mixed-pbl-inventory.test.js \
            tests/curriculum/pgc-r06-a06-five-pbl-residual-closeout.test.js \
            tools/curriculum/apply-pgc-r06-a06-canonical-gap-field-repair.mjs \
            tools/curriculum/materialize-pgc-r06-a06-five-pbl-residual-closeout.mjs \
            data/curriculum/public-generation/PGC-R06-A06.five-pbl-residual-diagnostics.json \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            data/curriculum/public-generation/reasoning_mixed_pbl_route_inventory.csv \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            docs/curriculum/output/PGC-R06-A06_5ResidualPBLFixtureDiversityFullFix.md
          if git diff --cached --quiet; then
            echo "A06 authorities already synchronized."
          else
            git commit -m "chore(pgc-r06): materialize A06 authorities and retire writer [skip ci]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
