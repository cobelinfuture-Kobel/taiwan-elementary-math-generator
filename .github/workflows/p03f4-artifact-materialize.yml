name: P03F4 Artifact Finalize

on:
  push:
    branches:
      - p03f-w3-direct-product-vertical-slice004-v1

permissions:
  contents: write

concurrency:
  group: p03f4-artifact-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice004-v1
          fetch-depth: 0

      - name: Record visual review and exact committed hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('.')
          output = root / 'docs/curriculum/output/p03f-slice004-product-admission'
          html_path = output / 'g3b-u09-tenth-decimal.html'
          pdf_path = output / 'g3b-u09-tenth-decimal.pdf'
          report_path = output / 'p03f-slice004-product-acceptance-report.json'
          manifest_path = root / 'data/curriculum/full-product/p03f/slice004-product-admission.manifest.json'

          for path in (html_path, pdf_path, report_path, manifest_path):
              if not path.exists():
                  raise SystemExit(f'P03F4_REQUIRED_FILE_MISSING:{path}')

          html_hash = hashlib.sha256(html_path.read_bytes()).hexdigest()
          pdf_hash = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
          materialization_sha = subprocess.check_output([
              'git', 'log', '--format=%H', '--grep=chore(p03f4): materialize Chromium acceptance artifacts', '-1'
          ], text=True).strip()
          if not materialization_sha:
              raise SystemExit('P03F4_MATERIALIZATION_COMMIT_NOT_FOUND')

          report = json.loads(report_path.read_text())
          report['status'] = 'PASS_VISUAL_AND_SEMANTIC_REVIEWED'
          report['htmlSha256'] = html_hash
          report['pdfSha256'] = pdf_hash
          report['visualReview'] = {
              'status': 'PASS_VISUAL_AND_SEMANTIC_REVIEWED',
              'questionPageReviewed': True,
              'answerKeyPageReviewed': True,
              'physicalPageParityReviewed': True,
              'clippedTextFindingCount': 0,
              'overlapFindingCount': 0,
              'brokenGlyphFindingCount': 0,
              'semanticScopeFindingCount': 0
          }
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')

          manifest = json.loads(manifest_path.read_text())
          manifest['status'] = 'SLICE004_ARTIFACT_REVIEWED_PENDING_CLAIM_AND_EXACT_HEAD_CI'
          manifest['expectedCounts'].update({
              'chromiumPdfWitnessCount': 1,
              'newProductAdmissionCount': 1,
              'cumulativeW3ProductAdmissionCount': 5,
              'remainingDirectSliceCount': 49,
              'remainingDirectKnowledgePointCount': 77
          })
          manifest['exactAcceptance'].update({
              'nodeTestsPassed': 2502,
              'nodeTestsFailed': 0,
              'chromiumPdfPrintPassed': True,
              'physicalPageParityPassed': True,
              'overflowSweepPassed': True,
              'artifactHashSweepPassed': True,
              'visualReviewPassed': True,
              'committedHtmlSha256': html_hash,
              'committedPdfSha256': pdf_hash,
              'preD0NodeWorkflowRunId': 30317926276,
              'preD0NodeWorkflowHeadSha': '05fdcc8bd3bbbd99c31d24de0bedeb835380176c',
              'preD0ChromiumArtifactId': 8672900996,
              'preD0ChromiumArtifactDigest': 'sha256:7f5286e696cf6bdd131897c4eb846e92fc81e30d384a90831ae0a70f73d558a8',
              'artifactMaterializationCommitSha': materialization_sha
          })
          manifest['mainlineBoundary'].update({
              'queuePositionConsumed': 4,
              'slice004KnowledgePointAdmitted': True,
              'nextQueuePositionStarted': False,
              'otherG3BU09KnowledgePointsAdmitted': False,
              'applicationStoryGenerationAdded': False,
              'parallelRuntimePipelineAdded': False
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          print(f'P03F4_HTML_SHA256={html_hash}')
          print(f'P03F4_PDF_SHA256={pdf_hash}')
          print(f'P03F4_MATERIALIZATION_SHA={materialization_sha}')
          PY

      - name: Commit reviewed artifact metadata and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p03f4-artifact-materialize.yml
          git add docs/curriculum/output/p03f-slice004-product-admission data/curriculum/full-product/p03f/slice004-product-admission.manifest.json
          git commit -m "chore(p03f4): record reviewed artifact hashes"
          git push origin HEAD:p03f-w3-direct-product-vertical-slice004-v1
