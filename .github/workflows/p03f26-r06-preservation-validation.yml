name: P03F26 R06 Preservation Validation

on:
  pull_request:
    branches:
      - p03f26-g4a-u09-rank8

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore terminal R06 UI authority as preservation input
        run: |
          git show a97bd829d65775e499b2e14ddb734f143b11decb:data/curriculum/public-generation/ui_capability_binding_contract.json > data/curriculum/public-generation/ui_capability_binding_contract.json

      - name: Materialize current Slice026 R02 authority with R06 preservation
        run: node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs

      - name: Focused preservation and Slice026 acceptance
        run: |
          node --test \
            tests/curriculum/p03f-slice025-improper-mixed-integer-conversion.test.js \
            tests/curriculum/p03f-slice026-authority-preflight.test.js \
            tests/curriculum/p03f-slice026-g4a-u09-rank8-decimal.test.js \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js \
            tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js \
            tests/curriculum/pgc-r06-a07-final-global-live-d0-closeout.test.js

      - name: Full repository regression
        run: npm test

      - name: Verify deterministic output scope
        run: |
          git diff --check
          git status --short

      - name: Stage exact remediation artifact
        run: |
          mkdir -p tmp/p03f26-r06-preservation/tools/curriculum
          mkdir -p tmp/p03f26-r06-preservation/tests/curriculum
          mkdir -p tmp/p03f26-r06-preservation/data/curriculum/public-generation
          mkdir -p tmp/p03f26-r06-preservation/docs/curriculum/output
          cp tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs tmp/p03f26-r06-preservation/tools/curriculum/
          cp tests/curriculum/p03f-slice025-improper-mixed-integer-conversion.test.js tmp/p03f26-r06-preservation/tests/curriculum/
          cp data/curriculum/public-generation/ui_capability_binding_contract.json tmp/p03f26-r06-preservation/data/curriculum/public-generation/
          cp data/curriculum/public-generation/ui_option_filter_matrix.csv tmp/p03f26-r06-preservation/data/curriculum/public-generation/
          cp docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md tmp/p03f26-r06-preservation/docs/curriculum/output/

      - name: Upload exact remediation artifact
        uses: actions/upload-artifact@v4
        with:
          name: p03f26-r06-preservation-remediation
          path: tmp/p03f26-r06-preservation
          if-no-files-found: error
