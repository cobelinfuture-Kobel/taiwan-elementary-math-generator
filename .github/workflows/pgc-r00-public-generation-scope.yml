name: PGC-R00 Public Generation Scope Freeze

on:
  pull_request:
    paths:
      - "data/curriculum/public-generation/**"
      - "docs/curriculum/output/PGC-R00_authority_boundary_readback.md"
      - "site/assets/browser/pipeline/build-worksheet-document-p01e-closeout.js"
      - "tests/curriculum/pgc-r00-public-generation-scope.test.js"
      - "tests/curriculum/pgc-r08-a04-a06-capacity-shortfall.test.js"
      - "tests/curriculum/pgc-r08-a04-a07-final-global-d0-closeout.test.js"
      - "tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-diagnostic.mjs"
      - "tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-replay.mjs"
      - "tools/curriculum/run-pgc-r08-a03-all-legal-routes.mjs"
      - ".github/workflows/pgc-r00-public-generation-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize temporary GCI-S01 evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import zlib from "node:zlib";
          import { materializeGciS01WorkflowInventory } from "./tools/governance/materialize-gci-s01-workflow-inventory.mjs";

          const root = ".github/ci/gci-s01";
          const inventoryPath = `${root}/workflow-inventory.json.br`;
          const fanoutPath = `${root}/workflow-fanout-matrix.json.br`;
          const ownershipPath = `${root}/workflow-ownership-readback.json.br`;
          const manifestPath = `${root}/evidence-manifest.json`;
          const readBr = (file) => JSON.parse(zlib.brotliDecompressSync(fs.readFileSync(file)).toString("utf8"));
          const inventoryAsOfCommit = readBr(inventoryPath).inventoryAsOfCommit;
          const report = materializeGciS01WorkflowInventory({
            excludeFiles: [
              ".github/workflows/pr-gate.yml",
              ".github/workflows/pgc-r06-a02-g5a-u02-live-diagnostics.yml",
              ".github/workflows/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.yml",
              ".github/workflows/pgc-r06-a07-final-global-live-d0-closeout.yml",
            ],
          });
          const oldFanout = readBr(fanoutPath);
          const oldOwnership = readBr(ownershipPath);
          const next = [
            [inventoryPath, { inventoryAsOfCommit, ...report }],
            [fanoutPath, {
              ...oldFanout,
              inventoryAsOfCommit,
              summary: report.summary,
              triggerMatrix: report.triggerMatrix,
              sharedPathOverlapMatrix: report.sharedPathOverlapMatrix,
            }],
            [ownershipPath, {
              ...oldOwnership,
              inventoryAsOfCommit,
              summary: report.summary,
              workflowIds: report.workflowIds,
              ownershipMatrix: report.ownershipMatrix,
            }],
          ];
          const brotliOptions = {
            params: {
              [zlib.constants.BROTLI_PARAM_QUALITY]: 11,
              [zlib.constants.BROTLI_PARAM_MODE]: zlib.constants.BROTLI_MODE_TEXT,
            },
          };
          const artifactRows = [];
          for (const [file, value] of next) {
            const serialized = Buffer.from(JSON.stringify(value, null, 2), "utf8");
            const compressed = zlib.brotliCompressSync(serialized, brotliOptions);
            fs.writeFileSync(file, compressed);
            artifactRows.push({
              path: file,
              mediaType: "application/json",
              contentEncoding: "br",
              sha256: crypto.createHash("sha256").update(compressed).digest("hex"),
              compressedBytes: compressed.length,
              uncompressedBytes: serialized.length,
            });
          }
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          fs.writeFileSync(manifestPath, `${JSON.stringify({
            ...manifest,
            inventoryAsOfCommit,
            artifacts: artifactRows,
          }, null, 2)}\n`);
          console.log(JSON.stringify({ inventoryAsOfCommit, summary: report.summary, artifacts: artifactRows }, null, 2));
          NODE

      - name: Upload temporary GCI-S01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a07-gci-s01-${{ github.run_id }}
          path: .github/ci/gci-s01
          if-no-files-found: error
          retention-days: 14

      - name: Focused PGC-R00 contract
        run: node --test tests/curriculum/pgc-r00-public-generation-scope.test.js

      - name: Full regression
        run: npm test

      - name: Install exact-replay dependencies
        run: npm install --no-audit --no-fund --no-save --package-lock=false playwright

      - name: Focused R08 A05-A07 contracts
        run: >-
          node --test
          tests/curriculum/pgc-r08-a04-a05-regenerate-identity.test.js
          tests/curriculum/pgc-r08-a04-a05-application-alias.test.js
          tests/curriculum/pgc-r08-a04-a05-browser-selector-route.test.js
          tests/curriculum/pgc-r08-a04-a06-capacity-shortfall.test.js
          tests/curriculum/pgc-r08-a04-a07-final-global-d0-closeout.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exact ten-route browser replay
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p tmp/pgc-r08-a04-a05-regenerate-identity
          node tools/curriculum/run-pgc-r08-a04-a05-regenerate-identity-replay.mjs \
            2>&1 | tee tmp/pgc-r08-a04-a05-regenerate-identity/exact-replay.log
          replay_status=${PIPESTATUS[0]}
          printf '%s\n' "${replay_status}" \
            > tmp/pgc-r08-a04-a05-regenerate-identity/exit-code.txt
          exit 0

      - name: Upload A05 replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a05-regenerate-identity-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a04-a05-regenerate-identity
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact ten-route browser replay
        shell: bash
        run: test "$(cat tmp/pgc-r08-a04-a05-regenerate-identity/exit-code.txt)" = "0"

      - name: Materialize A06 exact three-route diagnostic
        run: node tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-diagnostic.mjs

      - name: Exact three-route capacity replay
        shell: bash
        run: |
          set -o pipefail
          set +e
          node tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-replay.mjs \
            2>&1 | tee tmp/pgc-r08-a04-a06-capacity-shortfall/exact-replay.log
          replay_status=${PIPESTATUS[0]}
          printf '%s\n' "${replay_status}" \
            > tmp/pgc-r08-a04-a06-capacity-shortfall/exit-code.txt
          exit 0

      - name: Upload A06 replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a06-capacity-shortfall-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a04-a06-capacity-shortfall
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact three-route capacity replay
        shell: bash
        run: test "$(cat tmp/pgc-r08-a04-a06-capacity-shortfall/exit-code.txt)" = "0"

      - name: Final exact 793-route browser replay
        shell: bash
        run: |
          set -o pipefail
          set +e
          node tools/curriculum/run-pgc-r08-a03-all-legal-routes.mjs \
            2>&1 | tee tmp/pgc-r08-a04-a07-final-global-d0-closeout.log
          replay_status=${PIPESTATUS[0]}
          printf '%s\n' "${replay_status}" \
            > tmp/pgc-r08-a04-a07-final-global-d0-closeout.exit-code.txt
          exit 0

      - name: Upload A07 final global replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a07-final-global-d0-closeout-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a03-all-legal-routes
            tmp/pgc-r08-a04-a07-final-global-d0-closeout.log
            tmp/pgc-r08-a04-a07-final-global-d0-closeout.exit-code.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify final exact 793-route browser replay
        shell: bash
        run: |
          test "$(cat tmp/pgc-r08-a04-a07-final-global-d0-closeout.exit-code.txt)" = "0"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("tmp/pgc-r08-a03-all-legal-routes/report.json", "utf8"));
            if (report.status !== "PASS_ALL_793_LEGAL_ROUTES") throw new Error(report.status);
            if (report.summary.executedRouteCount !== 793) throw new Error("executedRouteCount");
            if (report.summary.terminalRouteCount !== 793) throw new Error("terminalRouteCount");
            if (report.summary.passRouteCount !== 793) throw new Error("passRouteCount");
            if (report.summary.failRouteCount !== 0) throw new Error("failRouteCount");
            if (report.summary.browserConsoleErrorCount !== 0) throw new Error("browserConsoleErrorCount");
            if (report.summary.browserPageErrorCount !== 0) throw new Error("browserPageErrorCount");
          '
