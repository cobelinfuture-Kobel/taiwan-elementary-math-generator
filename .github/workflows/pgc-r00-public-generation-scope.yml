name: PGC-R00 Public Generation Scope Freeze

on:
  pull_request:
    paths:
      - "data/curriculum/public-generation/**"
      - "docs/curriculum/output/PGC-R00_authority_boundary_readback.md"
      - "tests/curriculum/pgc-r00-public-generation-scope.test.js"
      - ".github/workflows/pgc-r00-public-generation-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Focused PGC-R00 contract
        run: node --test tests/curriculum/pgc-r00-public-generation-scope.test.js

      - name: Full regression
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p tmp/pgc-r00-diagnostics
          npm test 2>&1 | tee tmp/pgc-r00-diagnostics/npm-test.log
          test_status=${PIPESTATUS[0]}
          printf '%s\n' "${test_status}" > tmp/pgc-r00-diagnostics/exit-code.txt
          exit 0

      - name: Upload full-regression diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r00-full-regression-${{ github.run_id }}
          path: tmp/pgc-r00-diagnostics
          if-no-files-found: error
          retention-days: 3

      - name: Verify full regression
        shell: bash
        run: test "$(cat tmp/pgc-r00-diagnostics/exit-code.txt)" = "0"

      - name: Install exact-replay dependencies
        run: npm install --no-audit --no-fund --no-save --package-lock=false playwright

      - name: Focused regenerate-identity contract
        run: node --test tests/curriculum/pgc-r08-a04-a05-regenerate-identity.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exact ten-route browser replay
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p tmp/pgc-r08-a04-a05-regenerate-identity
          node tools/curriculum/run-pgc-r08-a04-a05-regenerate-identity-replay.mjs \
            2>&1 | tee tmp/pgc-r08-a04-a05-regenerate-identity/exact-replay.log
          replay_status=${PIPESTATUS[0]}
          printf '%s\n' "${replay_status}" \
            > tmp/pgc-r08-a04-a05-regenerate-identity/exit-code.txt
          exit 0

      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a05-regenerate-identity-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a04-a05-regenerate-identity
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact ten-route browser replay
        shell: bash
        run: test "$(cat tmp/pgc-r08-a04-a05-regenerate-identity/exit-code.txt)" = "0"
