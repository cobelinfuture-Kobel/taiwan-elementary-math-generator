name: PGC-R00 Public Generation Scope Freeze

on:
  pull_request:
    paths:
      - "data/curriculum/public-generation/**"
      - "docs/curriculum/output/PGC-R00_authority_boundary_readback.md"
      - "site/assets/browser/pipeline/build-worksheet-document-p01e-closeout.js"
      - "tests/curriculum/pgc-r00-public-generation-scope.test.js"
      - "tests/curriculum/pgc-r08-a04-a06-capacity-shortfall.test.js"
      - "tests/curriculum/pgc-r09-a03-public-site-smoke.test.js"
      - "tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-diagnostic.mjs"
      - "tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-replay.mjs"
      - "tools/curriculum/run-pgc-r09-a03-public-site-smoke.mjs"
      - ".github/workflows/pgc-r00-public-generation-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Focused PGC-R00 contract
        run: node --test tests/curriculum/pgc-r00-public-generation-scope.test.js

      - name: Focused R09 A01 contract
        run: node --test tests/curriculum/pgc-r09-a01-exact-head-execution.test.js

      - name: Focused R09 A03 public-site smoke contract
        run: node --test tests/curriculum/pgc-r09-a03-public-site-smoke.test.js

      - name: Full regression
        run: npm test

      - name: Install exact-replay dependencies
        run: npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.51.1

      - name: Focused R08 A05-A06 contracts
        run: >-
          node --test
          tests/curriculum/pgc-r08-a04-a05-regenerate-identity.test.js
          tests/curriculum/pgc-r08-a04-a05-application-alias.test.js
          tests/curriculum/pgc-r08-a04-a05-browser-selector-route.test.js
          tests/curriculum/pgc-r08-a04-a06-capacity-shortfall.test.js

      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: R09 A03 deployed public-site smoke
        run: node tools/curriculum/run-pgc-r09-a03-public-site-smoke.mjs

      - name: Upload R09 A03 deployed public-site smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r09-a03-public-site-smoke-${{ github.run_id }}
          path: tmp/pgc-r09-a03-public-site-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Exact ten-route browser replay
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p tmp/pgc-r08-a04-a05-regenerate-identity
          node tools/curriculum/run-pgc-r08-a04-a05-regenerate-identity-replay.mjs \
            2>&1 | tee tmp/pgc-r08-a04-a05-regenerate-identity/exact-replay.log
          replay_status=${PIPESTATUS[0]}
          printf '%s\n' "${replay_status}" \
            > tmp/pgc-r08-a04-a05-regenerate-identity/exit-code.txt
          exit 0

      - name: Upload A05 replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a05-regenerate-identity-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a04-a05-regenerate-identity
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact ten-route browser replay
        shell: bash
        run: test "$(cat tmp/pgc-r08-a04-a05-regenerate-identity/exit-code.txt)" = "0"

      - name: Materialize A06 exact three-route diagnostic
        run: node tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-diagnostic.mjs

      - name: Exact three-route capacity replay
        shell: bash
        run: |
          set -o pipefail
          set +e
          node tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-replay.mjs \
            2>&1 | tee tmp/pgc-r08-a04-a06-capacity-shortfall/exact-replay.log
          replay_status=${PIPESTATUS[0]}
          printf '%s\n' "${replay_status}" \
            > tmp/pgc-r08-a04-a06-capacity-shortfall/exit-code.txt
          exit 0

      - name: Upload A06 replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a06-capacity-shortfall-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a04-a06-capacity-shortfall
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact three-route capacity replay
        shell: bash
        run: test "$(cat tmp/pgc-r08-a04-a06-capacity-shortfall/exit-code.txt)" = "0"

      - name: R09 A01 exact 793-route browser replay
        shell: bash
        run: |
          set -o pipefail
          set +e
          node tools/curriculum/run-pgc-r08-a03-all-legal-routes.mjs \
            2>&1 | tee tmp/pgc-r09-a01-exact-793-route-replay.log
          replay_status=${PIPESTATUS[0]}
          printf '%s\n' "${replay_status}" > tmp/pgc-r09-a01-exact-793-route-replay.exit-code.txt
          exit 0

      - name: Upload R09 A01 exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r09-a01-exact-head-execution-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a03-all-legal-routes
            tmp/pgc-r09-a01-exact-793-route-replay.log
            tmp/pgc-r09-a01-exact-793-route-replay.exit-code.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify R09 A01 exact 793-route browser replay
        shell: bash
        run: |
          test "$(cat tmp/pgc-r09-a01-exact-793-route-replay.exit-code.txt)" = "0"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("tmp/pgc-r08-a03-all-legal-routes/report.json", "utf8"));
            if (report.status !== "PASS_ALL_793_LEGAL_ROUTES") throw new Error(report.status);
            if (report.summary.executedRouteCount !== 793) throw new Error("executedRouteCount");
            if (report.summary.terminalRouteCount !== 793) throw new Error("terminalRouteCount");
            if (report.summary.passRouteCount !== 793) throw new Error("passRouteCount");
            if (report.summary.failRouteCount !== 0) throw new Error("failRouteCount");
            if (report.summary.browserConsoleErrorCount !== 0) throw new Error("browserConsoleErrorCount");
            if (report.summary.browserPageErrorCount !== 0) throw new Error("browserPageErrorCount");
          '
