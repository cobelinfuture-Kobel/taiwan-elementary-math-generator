name: PGC-R06 A01 G4B-U04 Bounded Capacity FullFix

on:
  pull_request:
    paths:
      - "tools/curriculum/apply-pgc-r06-g4b-u04-inverse-capacity-patch.mjs"
      - "tools/curriculum/apply-pgc-r06-g4b-u04-unique-pool-capacity-patch.mjs"
      - "tools/curriculum/materialize-pgc-r06-a01-g4b-u04-bounded-capacity-diagnostics.mjs"
      - "tools/curriculum/reconcile-pgc-r06-a01-g4b-u04-capacity-contract.mjs"
      - "tools/curriculum/materialize-pgc-r05-reconciled-capacity-consumers.mjs"
      - "tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs"
      - "tools/curriculum/materialize-pgc-r06-reasoning-mixed-pbl-inventory.mjs"
      - "tests/curriculum/pgc-r06-a01-*.test.js"
      - "site/modules/curriculum/batch-b/g4b-u04-class-c-generator.js"
      - "site/modules/curriculum/batch-b/g4b-u04-inverse-unique-case-pool.js"
      - "site/modules/curriculum/public/public-generator-capacity-registry.js"
      - "data/curriculum/public-generation/generator_capacity_contract.json"
      - "data/curriculum/public-generation/route_capacity_matrix.csv"
      - "data/curriculum/public-generation/cross_seed_diversity_report.csv"
      - "data/curriculum/public-generation/ui_capability_binding_contract.json"
      - "data/curriculum/public-generation/ui_option_filter_matrix.csv"
      - "data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json"
      - "data/curriculum/public-generation/reasoning_mixed_pbl_route_inventory.csv"
      - "data/curriculum/public-generation/PGC-R06-A01.g4b-u04-bounded-capacity-diagnostics.json"
      - "data/curriculum/public-generation/PGC-R06-A01.g4b-u04-bounded-capacity-diagnostics.csv"
      - "data/curriculum/public-generation/PGC-R06-A01.g4b-u04-capacity-contract-reconciliation.json"
      - "docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md"
      - "docs/curriculum/output/PGC-R06_reasoning_mixed_pbl_inventory.md"
      - "docs/curriculum/output/PGC-R06-A01_G4B_U04_bounded_capacity_diagnostics.md"
      - "docs/curriculum/output/PGC-R06-A01_G4B_U04_CAPACITY_CONTRACT_CLOSEOUT.md"
      - ".github/workflows/pgc-r06-a01-g4b-u04-bounded-capacity-full-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r06-a01-g4b-u04-bounded-capacity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fullfix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout R06 A01 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check A01 authorities
        run: |
          node --check tools/curriculum/apply-pgc-r06-g4b-u04-inverse-capacity-patch.mjs
          node --check tools/curriculum/apply-pgc-r06-g4b-u04-unique-pool-capacity-patch.mjs
          node --check tools/curriculum/materialize-pgc-r06-a01-g4b-u04-bounded-capacity-diagnostics.mjs
          node --check tools/curriculum/reconcile-pgc-r06-a01-g4b-u04-capacity-contract.mjs
          node --check tools/curriculum/materialize-pgc-r05-reconciled-capacity-consumers.mjs
          node --check tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs
          node --check tools/curriculum/materialize-pgc-r06-reasoning-mixed-pbl-inventory.mjs
          node --check tests/curriculum/pgc-r06-a01-g4b-u04-bounded-capacity.test.js
          node --check tests/curriculum/pgc-r06-a01-g4b-u04-capacity-contract-closeout.test.js

      - name: Apply G4B-U04 bounded reasoning producer FullFix
        run: node tools/curriculum/apply-pgc-r06-g4b-u04-inverse-capacity-patch.mjs

      - name: Apply G4B-U04 canonical unique-pool capacity FullFix
        run: node tools/curriculum/apply-pgc-r06-g4b-u04-unique-pool-capacity-patch.mjs

      - name: Materialize 15-route live diagnostics
        run: node tools/curriculum/materialize-pgc-r06-a01-g4b-u04-bounded-capacity-diagnostics.mjs

      - name: Require all 15 bounded routes live at 20 questions
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06-A01.g4b-u04-bounded-capacity-diagnostics.json", "utf8"));
          if (report.summary.targetRouteCount !== 15
            || report.summary.live20PassRouteCount !== 15
            || report.summary.live20FailRouteCount !== 0
            || report.routes.some((route) => route.questionType === "pbl")
            || report.routes.some((route) => route.diagnosticRuns.some((run) => run.uniquePromptCount !== 20 || run.answerKeyItemCount !== 20))) {
            throw new Error(`PGC_R06_A01_LIVE_GATE_FAILED:${JSON.stringify(report.summary)}`);
          }
          const kps = new Set(report.routes.flatMap((route) => route.selectedKnowledgePointIds));
          for (const required of [
            "kp_g4b_u04_approximation_symbol_reading",
            "kp_g4b_u04_inverse_rounding_unknown_digit",
            "kp_g4b_u04_inverse_rounding_possible_original",
          ]) {
            if (!kps.has(required)) throw new Error(`PGC_R06_A01_REQUIRED_KP_MISSING:${required}`);
          }
          console.log(`PGC_R06_A01_LIVE_GATE=PASS:${JSON.stringify(report.summary)}`);
          NODE

      - name: Reconcile 15-route capacity contract and public bindings
        run: node tools/curriculum/reconcile-pgc-r06-a01-g4b-u04-capacity-contract.mjs

      - name: Materialize reconciled public capacity consumers
        run: |
          node tools/curriculum/materialize-pgc-r05-reconciled-capacity-consumers.mjs
          node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs

      - name: Refresh R06 reasoning mixed PBL repair queue
        run: node tools/curriculum/materialize-pgc-r06-reasoning-mixed-pbl-inventory.mjs

      - name: Finalize A01 contract reconciliation and queue closeout
        run: node tools/curriculum/reconcile-pgc-r06-a01-g4b-u04-capacity-contract.mjs --finalize

      - name: Focused G4B-U04 and A01 acceptance
        run: |
          node --test tests/curriculum/s69-g4b-u04-class-c-generator-validator.test.js
          node --test tests/curriculum/g4b-u04-r2b-prompt-deduplication.test.js
          node --test tests/curriculum/s72-g4b-u04-promotion-resolver-selector.test.js
          node --test tests/curriculum/pgc-r02-public-ui-capability-binding.test.js
          node --test tests/curriculum/pgc-r03-generator-capacity-contract.test.js
          node --test tests/curriculum/pgc-r06-a01-g4b-u04-bounded-capacity.test.js
          node --test tests/curriculum/pgc-r06-a01-g4b-u04-capacity-contract-closeout.test.js

      - name: Full repository regression
        run: npm test

      - name: Commit deterministic A01 runtime, contract and closeout artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/modules/curriculum/batch-b/g4b-u04-class-c-generator.js \
            site/modules/curriculum/batch-b/g4b-u04-inverse-unique-case-pool.js \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/route_capacity_matrix.csv \
            data/curriculum/public-generation/cross_seed_diversity_report.csv \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/ui_option_filter_matrix.csv \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            data/curriculum/public-generation/reasoning_mixed_pbl_route_inventory.csv \
            data/curriculum/public-generation/PGC-R06-A01.g4b-u04-bounded-capacity-diagnostics.json \
            data/curriculum/public-generation/PGC-R06-A01.g4b-u04-bounded-capacity-diagnostics.csv \
            data/curriculum/public-generation/PGC-R06-A01.g4b-u04-capacity-contract-reconciliation.json \
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md \
            docs/curriculum/output/PGC-R06_reasoning_mixed_pbl_inventory.md \
            docs/curriculum/output/PGC-R06-A01_G4B_U04_bounded_capacity_diagnostics.md \
            docs/curriculum/output/PGC-R06-A01_G4B_U04_CAPACITY_CONTRACT_CLOSEOUT.md
          if git diff --cached --quiet; then
            echo "R06 A01 runtime, contract and closeout artifacts already synchronized."
          else
            git commit -m "close(pgc-r06): reconcile G4B-U04 bounded route capacity [skip ci]"
            git fetch origin "${{ github.head_ref || github.ref_name }}"
            git rebase "origin/${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload A01 closeout artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r06-a01-g4b-u04-bounded-capacity
          path: |
            data/curriculum/public-generation/generator_capacity_contract.json
            data/curriculum/public-generation/route_capacity_matrix.csv
            data/curriculum/public-generation/cross_seed_diversity_report.csv
            data/curriculum/public-generation/ui_capability_binding_contract.json
            data/curriculum/public-generation/ui_option_filter_matrix.csv
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json
            data/curriculum/public-generation/reasoning_mixed_pbl_route_inventory.csv
            data/curriculum/public-generation/PGC-R06-A01.g4b-u04-bounded-capacity-diagnostics.json
            data/curriculum/public-generation/PGC-R06-A01.g4b-u04-bounded-capacity-diagnostics.csv
            data/curriculum/public-generation/PGC-R06-A01.g4b-u04-capacity-contract-reconciliation.json
            site/modules/curriculum/public/public-generator-capacity-registry.js
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md
            docs/curriculum/output/PGC-R06_reasoning_mixed_pbl_inventory.md
            docs/curriculum/output/PGC-R06-A01_G4B_U04_bounded_capacity_diagnostics.md
            docs/curriculum/output/PGC-R06-A01_G4B_U04_CAPACITY_CONTRACT_CLOSEOUT.md
          if-no-files-found: error
