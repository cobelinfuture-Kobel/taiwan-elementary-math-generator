name: P03F14 Slice014 Product Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p03f14-slice014-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  chromium:
    if: github.head_ref == 'p03f-w3-slice014-chromium-acceptance-v1'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Install project dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1
      - name: Validate Slice014 pre-D0 state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/p03f-slice014-product-acceptance
          node tools/curriculum/validate-p03f-slice014-product-admission.mjs 2>&1 | tee tmp/p03f-slice014-product-acceptance/validator.log
      - name: Run read-only Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice014-product-acceptance.mjs
      - name: Verify repository remained read-only
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload Slice014 product acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice014-product-acceptance
          path: tmp/p03f-slice014-product-acceptance
          if-no-files-found: error
          retention-days: 30
