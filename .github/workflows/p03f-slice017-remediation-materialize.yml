name: P03F17 Remediation Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03f-slice017-remediation-materialize.yml'

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'p03f-w3-slice017'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic remediation in workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD = 'batch-a-selector-p03f13-extension.js'
          NEW = 'batch-a-selector-p03f17-extension.js'

          # Current PGC authorities must consume the latest public selector, while PGC-R00 remains a frozen historical authority.
          for pattern in [
              'tools/curriculum/materialize-pgc-r01-public-capability-matrix*.mjs',
              'tools/curriculum/materialize-pgc-r02-ui-capability-binding*.mjs',
              'tests/curriculum/pgc-r01-public-capability-matrix.test.js',
              'tests/curriculum/pgc-r02-public-ui-capability-binding.test.js',
          ]:
              for path in Path('.').glob(pattern):
                  text = path.read_text()
                  updated = text.replace(OLD, NEW)
                  if updated != text:
                      path.write_text(updated)

          # R00 freezes its own 26-source historical snapshot; current source registry is allowed to grow monotonically.
          path = Path('tests/curriculum/pgc-r00-public-generation-scope.test.js')
          text = path.read_text()
          text = text.replace(
              'test("PGC-R00 freezes the exact 26-source public product authority", () => {',
              'test("PGC-R00 freezes the exact 26-source historical authority while current public sources may extend", () => {'
          )
          text = text.replace('assert.equal(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length, 26);', 'assert.equal(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length, 27);')
          text = text.replace('new Set(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.map((row) => row.sourceId)).size,\n    26,', 'new Set(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.map((row) => row.sourceId)).size,\n    27,')
          path.write_text(text)

          # R01 current matrix expectations advance with Slice017.
          path = Path('tests/curriculum/pgc-r01-public-capability-matrix.test.js')
          text = path.read_text()
          text = text.replace('test("PGC-R01 accounts for all 26 public sources and all visible KnowledgePoints", () => {', 'test("PGC-R01 accounts for all current public sources and all visible KnowledgePoints", () => {')
          text = text.replace('assert.equal(matrix.summary.publicSourceCount, 26);', 'assert.equal(matrix.summary.publicSourceCount, 27);')
          text = text.replace('assert.equal(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length, 26);', 'assert.equal(CURRENT_FULL_PRODUCT_PUBLIC_SOURCE_UNITS.length, 27);')
          text = text.replace('assert.equal(expectedPairCount, 579);', 'assert.equal(expectedPairCount, 582);')
          path.write_text(text)

          # R01 report wording must reflect the rebuilt authority rather than a historical constant.
          path = Path('tools/curriculum/materialize-pgc-r01-public-capability-matrix-v4.mjs')
          text = path.read_text()
          text = text.replace(
              '"1. All 26 public sources and all 193 visible KnowledgePoints are accounted across all three public surfaces.",',
              '`1. All ${matrix.summary.publicSourceCount} public sources and all ${matrix.summary.publicVisibleKnowledgePointCount} visible KnowledgePoints are accounted across all three public surfaces.`,',
          )
          path.write_text(text)

          # R02 current contract advances to 27 sources / 194 visible KPs and accepts the post-R03 structural fallback for newly admitted direct-product routes.
          path = Path('tests/curriculum/pgc-r02-public-ui-capability-binding.test.js')
          text = path.read_text()
          text = text.replace('assert.equal(contract.summary.publicSourceCount, 26);', 'assert.equal(contract.summary.publicSourceCount, 27);')
          text = text.replace('assert.equal(contract.summary.visibleKnowledgePointCount, 193);', 'assert.equal(contract.summary.visibleKnowledgePointCount, 194);')
          text = text.replace('["VERIFIED_20", "VERIFIED_LIMITED", "FAIL_CLOSED_PENDING_PGC_R03"]', '["VERIFIED_20", "VERIFIED_LIMITED", "STRUCTURAL_FALLBACK_AVAILABLE", "FAIL_CLOSED_PENDING_PGC_R03"]')
          path.write_text(text)

          # Historical slice tests may inspect the current Pixel surface, but must track the current 27-source registry rather than pinning 26 forever.
          current_source_patterns = [
              re.compile(r'assert\.equal\(([^;\n]*(?:sources\.length|Sources\.length|sourceCount)[^;\n]*), 26\);'),
          ]
          for path in Path('tests/curriculum').glob('p03f-slice*.test.js'):
              text = path.read_text()
              updated = text
              for pattern in current_source_patterns:
                  updated = pattern.sub(lambda m: f'assert.equal({m.group(1)}, 27);', updated)
              updated = updated.replace('current Pixel retains 26 sources', 'current Pixel retains 27 sources')
              updated = updated.replace('current Classic and Pixel expose 26 sources', 'current Classic and Pixel expose 27 sources')
              updated = updated.replace('current Pixel exposes 26 sources', 'current Pixel exposes 27 sources')
              if updated != text:
                  path.write_text(updated)

          # Earlier D0 validators must remain monotonic when later slices add public sources.
          metric_loop = re.compile(
              r'for \(const \[key, value\] of Object\.entries\(expected\)\) if \(metrics\[key\] !== value\) errors\.push\(`(P03F\d+)_METRIC_INVALID:\$\{key\}:\$\{metrics\[key\]\}:\$\{value\}`\);'
          )
          for name in ['011', '012', '013', '014']:
              path = Path(f'tools/curriculum/validate-p03f-slice{name}-product-admission.mjs')
              if not path.exists():
                  continue
              text = path.read_text()
              def repl(m):
                  prefix = m.group(1)
                  return (f'for (const [key, value] of Object.entries(expected)) {{\n'
                          f'    if (key === "publicSourceCountAfterAdmission") {{\n'
                          f'      if (metrics[key] < value) errors.push(`{prefix}_METRIC_INVALID:${{key}}:${{metrics[key]}}:${{value}}`);\n'
                          f'    }} else if (metrics[key] !== value) errors.push(`{prefix}_METRIC_INVALID:${{key}}:${{metrics[key]}}:${{value}}`);\n'
                          f'  }}')
              updated = metric_loop.sub(repl, text)
              updated = updated.replace('pixelSources.length !== 26', 'pixelSources.length < 26')
              updated = updated.replace('pixelSnapshot.sourceCount !== 26', 'pixelSnapshot.sourceCount < 26')
              updated = updated.replace('evidence.pixelSnapshot?.sourceCount !== 26', 'evidence.pixelSnapshot?.sourceCount < 26')
              path.write_text(updated)

          PY
      - name: Materialize current PGC authorities
        run: |
          node tools/curriculum/materialize-pgc-r01-public-capability-matrix-v4.mjs
          node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs
      - name: Focused regression
        run: |
          node --test \
            tests/curriculum/p03f-slice003-quotient-fraction.test.js \
            tests/curriculum/p03f-slice004-tenth-decimal.test.js \
            tests/curriculum/p03f-slice005-equivalent-fraction.test.js \
            tests/curriculum/p03f-slice006-fraction-accumulation.test.js \
            tests/curriculum/p03f-slice007-fraction-unit-conversion.test.js \
            tests/curriculum/p03f-slice008-decimal-compose-decompose.test.js \
            tests/curriculum/p03f-slice009-tenths-fraction-decimal.test.js \
            tests/curriculum/p03f-slice010-hundredth-representation.test.js \
            tests/curriculum/p03f-slice011-decimal-multiplication.test.js \
            tests/curriculum/p03f-slice012-product-admission.test.js \
            tests/curriculum/p03f-slice013-product-admission.test.js \
            tests/curriculum/p03f-slice014-decimal-base10.test.js \
            tests/curriculum/p03f-slice017-fraction-type-classification.test.js \
            tests/curriculum/pgc-r00-public-generation-scope.test.js \
            tests/curriculum/pgc-r01-public-capability-matrix.test.js \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js
      - name: Full regression
        run: npm test
      - name: Package deterministic remediation
        if: always()
        run: |
          mkdir -p tmp/p03f17-remediation
          git diff --name-only > tmp/p03f17-remediation/changed-files.txt
          cp tmp/p03f17-remediation/changed-files.txt tmp/p03f17-remediation/changed-files-copy.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "tmp/p03f17-remediation/files/$(dirname "$file")"
            cp "$file" "tmp/p03f17-remediation/files/$file"
          done < tmp/p03f17-remediation/changed-files.txt
          git diff > tmp/p03f17-remediation/remediation.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p03f17-remediation-materialized
          path: tmp/p03f17-remediation
          if-no-files-found: error
