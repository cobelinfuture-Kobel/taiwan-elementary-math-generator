name: P03F28 R02 Exact Materialization Staging

on:
  push:
    branches:
      - p03f28-r02-materialize-staging
    paths:
      - ".github/workflows/p03f28-r02-materialize-staging.yml"
      - "site/modules/curriculum/public/public-ui-capability-binding.js"
      - "tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs"
      - "tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs"
      - "site/modules/curriculum/registry/batch-a-selector-p03f28-extension.js"
      - "tests/curriculum/pgc-r02-public-ui-capability-binding.test.js"

permissions:
  contents: write

concurrency:
  group: p03f28-r02-materialize-staging
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: p03f28-r02-materialize-staging
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize current R02 through R03 preservation wrapper
        run: node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs

      - name: Verify exact 219-KP authority and R06 A07 terminal lineage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const contract = JSON.parse(fs.readFileSync('data/curriculum/public-generation/ui_capability_binding_contract.json', 'utf8'));
          assert.equal(contract.status, 'PASS');
          assert.equal(contract.summary.publicSourceCount, 29);
          assert.equal(contract.summary.visibleKnowledgePointCount, 219);
          assert.equal(contract.summary.gapCount, 0);
          assert.equal(contract.lastR06A07Closeout?.taskId, 'PGC-R06-A07_FinalReconciliationGlobalLiveGateAndD0Closeout');
          assert.equal(contract.lastR06A07Closeout?.status, 'PASS_R06_A07_GLOBAL_LIVE_RUNTIME_RECONCILED_AND_D0_CLOSED');
          assert.equal(contract.r06TerminalStatus, 'D0_CLOSED');
          console.log('P03F28_R02_EXACT_AUTHORITY=PASS_29_SOURCES_219_KPS_R06_A07_D0_PRESERVED');
          NODE

      - name: Focused preservation acceptance
        run: |
          node --test \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js \
            tests/curriculum/pgc-r06-a07-final-global-live-d0-closeout.test.js \
            tests/curriculum/p03f-slice028-g5a-u01-rank8-decimal.test.js

      - name: Commit only deterministic R02 outputs and retire staging workflow
        run: |
          rm .github/workflows/p03f28-r02-materialize-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/ui_option_filter_matrix.csv \
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md \
            .github/workflows/p03f28-r02-materialize-staging.yml
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/p03f28-r02-materialize-staging.yml"
            "data/curriculum/public-generation/ui_capability_binding_contract.json"
            "data/curriculum/public-generation/ui_option_filter_matrix.csv"
            "docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${staged[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "${staged[@]}"
            exit 2
          fi
          git commit -m "data(p03f28): materialize current 219-KP R02 authority [skip ci]"
          git push origin HEAD:p03f28-r02-materialize-staging
