name: PGC-R04 Numeric Generation FullFix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r04-numeric-generation-full-fix
  cancel-in-progress: true

jobs:
  numeric-fullfix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout R04 branch
        uses: actions/checkout@v4
        with:
          ref: pgc-r04-numeric-generation-full-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize embedded final-patcher literals
        run: node tools/curriculum/fix-pgc-r04-final-patcher-literals.mjs

      - name: Syntax-check R04 authorities
        run: |
          node --check tools/curriculum/apply-pgc-r04-public-count-contract-patch.mjs
          node --check tools/curriculum/apply-pgc-r04-seed-parameterization-patch.mjs
          node --check tools/curriculum/run-pgc-r04-seed-parameterization-idempotent.mjs
          node --check tools/curriculum/apply-pgc-r04-bounded-runtime-expansion-patch.mjs
          node --check tools/curriculum/run-pgc-r04-bounded-runtime-expansion-idempotent.mjs
          node --check tools/curriculum/apply-pgc-r04-bounded-runtime-postfix.mjs
          node --check tools/curriculum/fix-pgc-r04-final-patcher-literals.mjs
          node --check tools/curriculum/apply-pgc-r04-number-theory-prepatch.mjs
          node --check tools/curriculum/apply-pgc-r04-final-legacy-producer-patch.mjs
          node --check tools/curriculum/apply-pgc-r04-final-12-route-patch.mjs
          node --check tools/curriculum/apply-pgc-r04-problem-type-seed-projection-patch.mjs
          node --check tools/curriculum/apply-pgc-r04-s102-common-factor-seed-projection-patch.mjs
          node --check tools/curriculum/apply-pgc-r04-legacy-contract-reconciliation.mjs
          node --check tools/curriculum/apply-pgc-r04-final-regression-reconciliation.mjs
          node --check tools/curriculum/locate-pgc-r04-remaining-producers.mjs
          node --check tools/curriculum/materialize-pgc-r04-numeric-gap-diagnostics.mjs
          node --check tests/curriculum/pgc-r04-numeric-20x10-live-acceptance.test.js
          node --check site/modules/curriculum/batch-a/numeric-unique-allocation-fullfix.js
          node --check site/modules/curriculum/batch-a/batch-a-browser-question-router.js

      - name: Apply public 20-question validator contract
        run: node tools/curriculum/apply-pgc-r04-public-count-contract-patch.mjs

      - name: Apply seed-aware parameterization to existing numeric runtimes
        run: node tools/curriculum/run-pgc-r04-seed-parameterization-idempotent.mjs

      - name: Expand bounded numeric runtime parameter spaces
        run: node tools/curriculum/run-pgc-r04-bounded-runtime-expansion-idempotent.mjs

      - name: Normalize expanded runtime declarations
        run: node tools/curriculum/apply-pgc-r04-bounded-runtime-postfix.mjs

      - name: Prepatch one-line number-theory LCM authority
        run: node tools/curriculum/apply-pgc-r04-number-theory-prepatch.mjs

      - name: Apply final legacy numeric producer FullFixes
        run: node tools/curriculum/apply-pgc-r04-final-legacy-producer-patch.mjs

      - name: Apply final twelve-route capacity and diversity FullFixes
        run: node tools/curriculum/apply-pgc-r04-final-12-route-patch.mjs

      - name: Apply deterministic G5A-U02 problem-type seed projection
        run: node tools/curriculum/apply-pgc-r04-problem-type-seed-projection-patch.mjs

      - name: Apply deterministic G5A-U02 S102 common-factor seed projection
        run: node tools/curriculum/apply-pgc-r04-s102-common-factor-seed-projection-patch.mjs

      - name: Reconcile protected legacy product contracts
        run: node tools/curriculum/apply-pgc-r04-legacy-contract-reconciliation.mjs

      - name: Reconcile final full-regression contracts
        run: node tools/curriculum/apply-pgc-r04-final-regression-reconciliation.mjs

      - name: Rebuild canonical G5A-U02 browser bundle
        run: |
          npx --yes esbuild@0.25.5 \
            src/curriculum/g5a-u02/browser-dynamic-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --minify \
            --banner:js='/* GENERATED CANONICAL G5A-U02 RUNTIME — DO NOT EDIT */' \
            --outfile=site/modules/curriculum/batch-b/g5a-u02-browser-dynamic-runtime.bundle.js
          npx --yes esbuild@0.25.5 \
            src/curriculum/g5a-u02/browser-dynamic-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --minify \
            --banner:js='/* GENERATED CANONICAL G5A-U02 RUNTIME — DO NOT EDIT */' \
            --outfile=/tmp/g5a-u02-browser-dynamic-runtime.bundle.js
          cmp site/modules/curriculum/batch-b/g5a-u02-browser-dynamic-runtime.bundle.js /tmp/g5a-u02-browser-dynamic-runtime.bundle.js

      - name: Locate remaining legacy numeric producers
        run: node tools/curriculum/locate-pgc-r04-remaining-producers.mjs

      - name: Materialize numeric runtime gap diagnostics
        run: node tools/curriculum/materialize-pgc-r04-numeric-gap-diagnostics.mjs

      - name: Commit deterministic runtime and diagnostic artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/curriculum/apply-pgc-r04-final-legacy-producer-patch.mjs \
            tools/curriculum/apply-pgc-r04-final-12-route-patch.mjs \
            tools/curriculum/apply-pgc-r04-problem-type-seed-projection-patch.mjs \
            tools/curriculum/apply-pgc-r04-s102-common-factor-seed-projection-patch.mjs \
            tools/curriculum/apply-pgc-r04-legacy-contract-reconciliation.mjs \
            tools/curriculum/apply-pgc-r04-final-regression-reconciliation.mjs \
            tests/curriculum/batch-a/g4a-u01-phase3-runtime-fix.test.js \
            tests/curriculum/g4b-u04-r2b-prompt-deduplication.test.js \
            tests/curriculum/s72-g4b-u04-promotion-resolver-selector.test.js \
            site/modules/curriculum/batch-a/batch-a-browser-validator-p03f*.js \
            site/modules/curriculum/batch-a/batch-a-browser-generator-core.js \
            site/modules/curriculum/batch-a/numeric-unique-allocation-fullfix.js \
            site/modules/curriculum/batch-a/g3a-u03-quality-generator.js \
            site/modules/curriculum/batch-a/g3a-u06-remainder-generator.js \
            site/modules/curriculum/batch-a/g3a-u06-word-problem-generator.js \
            site/modules/curriculum/batch-a/g3a-u06-parity-generator.js \
            site/modules/curriculum/batch-a/g3a-u06-division-generator.js \
            site/modules/curriculum/batch-a/g4a-u01-phase1-generator.js \
            site/modules/curriculum/batch-a/g4a-u01-phase3-runtime-fix-generator.js \
            site/modules/curriculum/batch-a/factor-multiple-runtime.js \
            site/modules/curriculum/batch-a/number-theory-runtime.js \
            site/modules/curriculum/batch-a/slice002-fraction-runtime.js \
            site/modules/curriculum/batch-b/g4b-u04-class-c-generator.js \
            site/modules/curriculum/batch-b/g4b-u04-prompt-deduplication.js \
            site/modules/curriculum/batch-b/g5a-u02-browser-dynamic-runtime.bundle.js \
            src/curriculum/g5a-u02 \
            site/modules/curriculum/batch-a/quotient-fraction-runtime.js \
            site/modules/curriculum/batch-a/simplest-fraction-runtime.js \
            site/modules/curriculum/batch-a/tenth-decimal-runtime.js \
            site/modules/curriculum/batch-a/hundredth-decimal-runtime.js \
            site/modules/curriculum/batch-a/equivalent-fraction-runtime.js \
            site/modules/curriculum/batch-a/same-denominator-fraction-compare-runtime.js \
            site/modules/curriculum/batch-a/discrete-fraction-conversion-runtime.js \
            site/modules/curriculum/batch-a/decimal-read-write-runtime.js \
            site/modules/curriculum/batch-a/decimal-compose-decompose-runtime.js \
            site/modules/curriculum/batch-a/tenths-fraction-decimal-runtime.js \
            site/modules/curriculum/batch-a/one-decimal-times-integer-runtime.js \
            site/modules/curriculum/batch-a/equivalence-cross-product-cases.js \
            site/modules/curriculum/batch-a/quotient-as-fraction-context-runtime.js \
            data/curriculum/public-generation/PGC-R04.numeric-gap-diagnostics.json \
            data/curriculum/public-generation/PGC-R04.remaining-producer-locator.json \
            data/curriculum/public-generation/numeric_generation_gap_inventory.csv \
            docs/curriculum/output/PGC-R04_numeric_generation_gap_diagnostics.md
          if git diff --cached --quiet; then
            echo "R04 runtime and diagnostic artifacts already synchronized."
          else
            git commit -m "fix(pgc-r04): sync canonical browser bundle [skip ci]"
            git fetch origin pgc-r04-numeric-generation-full-fix
            git rebase origin/pgc-r04-numeric-generation-full-fix
            git push origin HEAD:pgc-r04-numeric-generation-full-fix
          fi

      - name: Focused R04 allocator acceptance
        run: node --test tests/curriculum/pgc-r04-numeric-unique-allocation.test.js

      - name: Focused R04 diagnostic acceptance
        run: node --test tests/curriculum/pgc-r04-numeric-gap-diagnostics.test.js

      - name: Live R04 numeric 20x10 seed acceptance
        run: node --test tests/curriculum/pgc-r04-numeric-20x10-live-acceptance.test.js

      - name: Upload R04 numeric diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r04-numeric-gap-diagnostics
          path: |
            data/curriculum/public-generation/PGC-R04.numeric-gap-diagnostics.json
            data/curriculum/public-generation/PGC-R04.remaining-producer-locator.json
            data/curriculum/public-generation/numeric_generation_gap_inventory.csv
            docs/curriculum/output/PGC-R04_numeric_generation_gap_diagnostics.md
          if-no-files-found: warn

