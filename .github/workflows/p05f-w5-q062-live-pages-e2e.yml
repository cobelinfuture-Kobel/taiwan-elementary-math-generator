name: P05F W5 Q062 Post-Merge Pages E2E
on:
  push:
    branches: [main]
    paths:
      - "site/modules/curriculum/registry/g5a-u09-composite-polygon-area-selector-projection-p05f62.js"
      - "site/modules/curriculum/registry/batch-a-selector-p05f62-extension.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p05f62.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p05f62-extension.js"
      - "site/modules/curriculum/batch-a/g5a-u09-composite-polygon-area-runtime-p05f62.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p05f62.js"
      - "site/modules/renderer/g5a-u09-composite-polygon-area-diagram-p05f62.js"
      - "site/modules/renderer/rectangle-square-area-formula-diagram.js"
permissions:
  contents: read
jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/run-p05f-w5-q062-live-pages-e2e.mjs
        env:
          P05F62_DEPLOYMENT_RETRIES: "30"
          P05F62_DEPLOYMENT_RETRY_DELAY_MS: "15000"
      - uses: actions/upload-artifact@v4
        with:
          name: p05f-w5-q062-pages-e2e
          path: tmp/p05f-w5-q062-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
