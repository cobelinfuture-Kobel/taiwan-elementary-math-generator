name: PGC-R08 A06 Capacity Shortfall Diagnostic

on:
  pull_request:
    paths:
      - "tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-diagnostic.mjs"
      - "tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-replay.mjs"
      - ".github/workflows/pgc-r08-a04-a06-capacity-shortfall-diagnostic.yml"
      - "data/curriculum/public-generation/PGC-R08-A04.active-repair-state.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize exact three-route diagnostic
        run: node tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-diagnostic.mjs

      - name: Install exact-replay dependencies
        run: npm install --no-audit --no-fund --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Replay exact three capacity-shortfall routes
        run: node tools/curriculum/run-pgc-r08-a04-a06-capacity-shortfall-replay.mjs

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r08-a04-a06-capacity-shortfall-${{ github.run_id }}
          path: |
            tmp/pgc-r08-a04-a06-capacity-shortfall
            tmp/pgc-r08-a03-all-legal-routes/failures
          if-no-files-found: error
          retention-days: 7
