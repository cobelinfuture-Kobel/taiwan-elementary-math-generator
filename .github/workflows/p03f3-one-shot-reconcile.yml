name: P03F3 One-Shot Historical Authority Reconciliation

on:
  push:
    branches:
      - p03f-w3-direct-product-vertical-slice003-v1

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice003-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/curriculum/p03f3-reconcile-historical-authorities.mjs
