name: P03F23 Governance Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p03f23-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'p03f23-g6a-u02-rank7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Materialize Slice023 current governance
        run: |
          cp data/curriculum/public-generation/ui_capability_binding_contract.json /tmp/p03f23-prior-r02.json
          sed -i \
            -e 's/batch-a-selector-p03f22-extension/batch-a-selector-p03f23-extension/g' \
            -e 's/selectorAuthority: "batch-a-selector-p03f22-extension.js"/selectorAuthority: "batch-a-selector-p03f23-extension.js"/g' \
            tools/curriculum/materialize-pgc-r01-public-capability-matrix.mjs
          node tools/curriculum/materialize-pgc-r01-public-capability-matrix-v4.mjs
          node tools/curriculum/reconcile-p03f23-current-pgc-r02.mjs /tmp/p03f23-prior-r02.json

      - name: Verify focused governance contracts
        run: |
          node --test \
            tests/curriculum/pgc-r01-public-capability-matrix.test.js \
            tests/curriculum/pgc-r02-kp-driven-ui-binding.test.js \
            tests/curriculum/p03f-slice023-reciprocal-core.test.js

      - name: Commit exact generated artifacts
        run: |
          git add -- \
            data/curriculum/public-generation/public_generation_capability_matrix.csv \
            data/curriculum/public-generation/public_generation_capability_matrix.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/ui_option_filter_matrix.csv \
            tools/curriculum/materialize-pgc-r01-public-capability-matrix.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(p03f23): materialize current governance artifacts"
          git push origin "HEAD:${{ github.head_ref }}"
