name: PGC-R05 G3B-U04 Producer Locator

on:
  pull_request:
    paths:
      - "tools/curriculum/locate-pgc-r05-g3b-u04-producers.mjs"
      - "data/curriculum/public-generation/PGC-R05.g3b-u04-producer-locator.json"
      - ".github/workflows/pgc-r05-g3b-u04-producer-locator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r05-g3b-u04-producer-locator
  cancel-in-progress: true

jobs:
  locate-producers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout milestone branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate shared G3B-U04 producers
        run: node tools/curriculum/locate-pgc-r05-g3b-u04-producers.mjs

      - name: Commit deterministic locator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curriculum/public-generation/PGC-R05.g3b-u04-producer-locator.json
          if git diff --cached --quiet; then
            echo "Locator already synchronized."
          else
            git commit -m "docs(pgc-r05): materialize G3B-U04 producer locator [skip ci]"
            git fetch origin "${{ github.head_ref || github.ref_name }}"
            git rebase "origin/${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload locator
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r05-g3b-u04-producer-locator
          path: data/curriculum/public-generation/PGC-R05.g3b-u04-producer-locator.json
          if-no-files-found: error
