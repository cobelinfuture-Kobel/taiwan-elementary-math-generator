name: P05F W5 Q023 Post-Merge Pages E2E

on:
  push:
    branches: [main]
    paths:
      - 'data/curriculum/full-product/p05f/q023-g3b-u05-area-conservation-irregular-grid-implementation.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p05f-w5-q023-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run true Q023 exact deployed Pages E2E
        env:
          P05F23_DEPLOYMENT_RETRIES: "36"
          P05F23_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: node tools/curriculum/run-p05f-w5-q023-live-pages-e2e.mjs
      - name: Upload Q023 exact Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05f-w5-q023-pages-e2e
          path: tmp/p05f-w5-q023-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
