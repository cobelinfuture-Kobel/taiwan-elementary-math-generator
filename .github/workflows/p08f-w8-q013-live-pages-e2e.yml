name: P08F W8 Q013 Post-Merge Pages E2E

on:
  push:
    branches:
      - main
    paths:
      - 'data/curriculum/full-product/p08f/q013-g5a-u05-polygon-angle-sum-reasoning-implementation.json'
      - 'data/curriculum/full-product/p08f/q013-technical-e6-learner-visual-review-pending.json'
      - 'tools/curriculum/run-p08f-w8-slice013-classic-ui-acceptance.mjs'
      - 'tools/curriculum/run-p08f-w8-q013-live-pages-e2e.mjs'
      - '.github/workflows/p08f-w8-q013-live-pages-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p08f-w8-q013-postmerge-pages-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Q013 exact deployed Main Pages E2E
        env:
          P08F13_DEPLOYMENT_RETRIES: "30"
          P08F13_DEPLOYMENT_RETRY_DELAY_MS: "15000"
        run: node tools/curriculum/run-p08f-w8-q013-live-pages-e2e.mjs
      - name: Upload Q013 Main Pages E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p08f-w8-q013-pages-e2e
          path: tmp/p08f-w8-q013-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
