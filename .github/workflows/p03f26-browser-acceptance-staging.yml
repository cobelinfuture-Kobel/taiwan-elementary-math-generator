name: P03F26 Browser Acceptance Staging

on:
  push:
    branches:
      - p03f26-browser-acceptance-staging

permissions:
  contents: write

jobs:
  chromium:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Slice026 Chromium acceptance
        run: node tools/curriculum/render-p03f-slice026-product-acceptance.mjs

      - name: Upload Slice026 acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p03f26-browser-acceptance
          path: tmp/p03f-slice026-product-acceptance
          if-no-files-found: error

      - name: Publish staging run evidence
        run: |
          mkdir -p docs/curriculum/output
          cat > docs/curriculum/output/.p03f26-browser-staging-run.json <<EOF
          {
            "taskId": "P03F_W3DirectProductVerticalSlice026ChromiumAcceptance",
            "sourceHeadSha": "8bff312d30a443ff9969f711d9baa85b3f886e23",
            "workflowRunId": ${GITHUB_RUN_ID},
            "workflowRunAttempt": ${GITHUB_RUN_ATTEMPT},
            "artifactName": "p03f26-browser-acceptance",
            "status": "PASS_AUTOMATED_PENDING_VISUAL_REVIEW"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/curriculum/output/.p03f26-browser-staging-run.json
          git commit -m "test(p03f26): record browser acceptance run [skip ci]"
          git push origin HEAD:p03f26-browser-acceptance-staging
