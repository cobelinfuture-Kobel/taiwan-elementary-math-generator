name: P03F15 Slice015 Product Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/curriculum/render-p03f-slice015-product-acceptance.mjs"
      - ".github/workflows/p03f-slice015-product-acceptance.yml"
      - "data/curriculum/full-product/p03f/slice015-same-denominator-fraction-authority.json"
      - "site/modules/curriculum/batch-a/**p03f15*.js"
      - "site/modules/curriculum/batch-a/same-denominator-fraction-runtime-p03f15.js"
      - "site/modules/curriculum/registry/batch-a-selector-p03f15-extension.js"
      - "site/modules/curriculum/registry/g3b-u07-same-denominator-selector-projection.js"
      - "tests/curriculum/p03f-slice015-same-denominator-fraction.test.js"

permissions:
  contents: read

jobs:
  chromium-product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Slice015 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice015-product-acceptance.mjs

      - name: Upload Slice015 product acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice015-product-acceptance-${{ github.sha }}
          path: tmp/p03f-slice015-product-acceptance/
          if-no-files-found: error
          retention-days: 14
