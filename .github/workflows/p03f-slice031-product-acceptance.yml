name: P03F Slice031 Product Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

# Exact-head acceptance rematerializes current PGC-R01/R02 authority and verifies the stable worksheet consumer path.
# TEMPORARY Slice031 reconciliation export: generated authority is committed only to a detached staging branch,
# never to the PR head. The final PR head restores contents: read before merge.
concurrency:
  group: p03f31-product-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-product-acceptance:
    if: github.head_ref == 'p03f31-g5b-u04-rank8-decimal-times-integer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Rematerialize current PGC-R01 and PGC-R02 authority
        run: |
          node tools/curriculum/materialize-pgc-r01-public-capability-matrix-v5.mjs
          node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r04.mjs
          node --test \
            tests/curriculum/p03f-slice031-g5b-u04-rank8-decimal-times-integer.test.js \
            tests/curriculum/pgc-r00-public-generation-scope.test.js \
            tests/curriculum/pgc-r01-public-capability-matrix.test.js \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js

      - name: Export deterministic authority to detached staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/curriculum/public-generation/public_generation_capability_matrix.json \
            data/curriculum/public-generation/public_generation_capability_matrix.csv \
            docs/curriculum/output/PGC-R01_capability_gap_report.md \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/ui_option_filter_matrix.csv \
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md
          git commit -m "data(p03f31): export deterministic current authority [skip ci]"
          git push --force origin HEAD:refs/heads/p03f31-authority-export-staging

      - name: Upload rematerialized public authority
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice031-rematerialized-public-authority
          path: |
            data/curriculum/public-generation/public_generation_capability_matrix.json
            data/curriculum/public-generation/public_generation_capability_matrix.csv
            docs/curriculum/output/PGC-R01_capability_gap_report.md
            data/curriculum/public-generation/ui_capability_binding_contract.json
            data/curriculum/public-generation/ui_option_filter_matrix.csv
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md
          if-no-files-found: error
          retention-days: 30

      - name: Install Chromium and acceptance font
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium

      - name: Run Slice031 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice031-product-acceptance.mjs

      - name: Upload Slice031 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice031-product-acceptance
          path: tmp/p03f-slice031-product-acceptance
          if-no-files-found: error
          retention-days: 30
