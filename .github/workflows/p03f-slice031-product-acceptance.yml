name: P03F Slice031 Product Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

# TEMPORARY remediation export: normalize stale current-inventory assertions on a detached staging branch only.
# The final PR head restores contents: read before merge.
concurrency:
  group: p03f31-product-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export-stale-current-test-reconciliation:
    if: github.head_ref == 'p03f31-g5b-u04-rank8-decimal-times-integer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconcile Slice031 current inventory expectations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'tests/curriculum/p03f-slice003-quotient-fraction.test.js',
            'tests/curriculum/p03f-slice004-tenth-decimal.test.js',
            'tests/curriculum/p03f-slice005-equivalent-fraction.test.js',
            'tests/curriculum/p03f-slice006-same-denominator-compare.test.js',
            'tests/curriculum/p03f-slice007-fraction-unit-conversion.test.js',
            'tests/curriculum/p03f-slice008-decimal-compose-decompose.test.js',
            'tests/curriculum/p03f-slice009-tenths-fraction-decimal.test.js',
            'tests/curriculum/p03f-slice010-hundredth-decimal.test.js',
            'tests/curriculum/p03f-slice011-decimal-multiplication.test.js',
            'tests/curriculum/p03f-slice012-equivalence-cross-product.test.js',
            'tests/curriculum/p03f-slice013-simplest-fraction.test.js',
            'tests/curriculum/p03f-slice025-improper-mixed-integer-conversion.test.js',
            'tests/curriculum/p03f-slice027-public-ui-binding.test.js',
            'tests/curriculum/p03f-slice028-public-ui-binding.test.js',
            'tests/curriculum/p03f-slice030-g5a-u06-rank8-fraction.test.js',
          ];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            const lines = text.split('\n').map((line) => {
              if (/assert\.equal\(/.test(line) && /(?:source|sources)/i.test(line) && /, 30\);/.test(line)) {
                return line.replace(/, 30\);/, ', 31);');
              }
              if (/assert\.equal\(/.test(line) && /(?:visible|knowledge|snapshot|registry)/i.test(line) && /, 224\);/.test(line)) {
                return line.replace(/, 224\);/, ', 225);');
              }
              if (/^test\(/.test(line) && /current/i.test(line)) {
                return line
                  .replace(/\b30 public sources\b/g, '31 public sources')
                  .replace(/\b30 sources\b/g, '31 sources')
                  .replace(/\b224 current KPs\b/g, '225 current KPs')
                  .replace(/\b224 visible KPs\b/g, '225 visible KPs')
                  .replace(/\bto 224\b/g, 'to 225');
              }
              return line;
            }).join('\n');
            if (text === before) throw new Error(`NO_STALE_CURRENT_EXPECTATION_UPDATED:${file}`);
            fs.writeFileSync(file, text);
          }
          NODE
          git diff --check
          git diff -- tests/curriculum/p03f-slice003-quotient-fraction.test.js tests/curriculum/p03f-slice004-tenth-decimal.test.js tests/curriculum/p03f-slice005-equivalent-fraction.test.js tests/curriculum/p03f-slice006-same-denominator-compare.test.js tests/curriculum/p03f-slice007-fraction-unit-conversion.test.js tests/curriculum/p03f-slice008-decimal-compose-decompose.test.js tests/curriculum/p03f-slice009-tenths-fraction-decimal.test.js tests/curriculum/p03f-slice010-hundredth-decimal.test.js tests/curriculum/p03f-slice011-decimal-multiplication.test.js tests/curriculum/p03f-slice012-equivalence-cross-product.test.js tests/curriculum/p03f-slice013-simplest-fraction.test.js tests/curriculum/p03f-slice025-improper-mixed-integer-conversion.test.js tests/curriculum/p03f-slice027-public-ui-binding.test.js tests/curriculum/p03f-slice028-public-ui-binding.test.js tests/curriculum/p03f-slice030-g5a-u06-rank8-fraction.test.js

      - name: Export reconciled tests to detached staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/curriculum/p03f-slice003-quotient-fraction.test.js \
            tests/curriculum/p03f-slice004-tenth-decimal.test.js \
            tests/curriculum/p03f-slice005-equivalent-fraction.test.js \
            tests/curriculum/p03f-slice006-same-denominator-compare.test.js \
            tests/curriculum/p03f-slice007-fraction-unit-conversion.test.js \
            tests/curriculum/p03f-slice008-decimal-compose-decompose.test.js \
            tests/curriculum/p03f-slice009-tenths-fraction-decimal.test.js \
            tests/curriculum/p03f-slice010-hundredth-decimal.test.js \
            tests/curriculum/p03f-slice011-decimal-multiplication.test.js \
            tests/curriculum/p03f-slice012-equivalence-cross-product.test.js \
            tests/curriculum/p03f-slice013-simplest-fraction.test.js \
            tests/curriculum/p03f-slice025-improper-mixed-integer-conversion.test.js \
            tests/curriculum/p03f-slice027-public-ui-binding.test.js \
            tests/curriculum/p03f-slice028-public-ui-binding.test.js \
            tests/curriculum/p03f-slice030-g5a-u06-rank8-fraction.test.js
          git commit -m "test(p03f31): reconcile stale current inventory assertions [skip ci]"
          git push --force origin HEAD:refs/heads/p03f31-stale-current-tests-export

  chromium-product-acceptance:
    if: github.head_ref == 'p03f31-g5b-u04-rank8-decimal-times-integer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Rematerialize current PGC-R01 and PGC-R02 authority
        run: |
          node tools/curriculum/materialize-pgc-r01-public-capability-matrix-v5.mjs
          node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r04.mjs
          node --test \
            tests/curriculum/p03f-slice031-g5b-u04-rank8-decimal-times-integer.test.js \
            tests/curriculum/pgc-r00-public-generation-scope.test.js \
            tests/curriculum/pgc-r01-public-capability-matrix.test.js \
            tests/curriculum/pgc-r02-public-ui-capability-binding.test.js

      - name: Upload rematerialized public authority
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice031-rematerialized-public-authority
          path: |
            data/curriculum/public-generation/public_generation_capability_matrix.json
            data/curriculum/public-generation/public_generation_capability_matrix.csv
            docs/curriculum/output/PGC-R01_capability_gap_report.md
            data/curriculum/public-generation/ui_capability_binding_contract.json
            data/curriculum/public-generation/ui_option_filter_matrix.csv
            docs/curriculum/output/PGC-R02_ui_capability_binding_readback.md
          if-no-files-found: error
          retention-days: 30

      - name: Install Chromium and acceptance font
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium

      - name: Run Slice031 Chromium product acceptance
        run: node tools/curriculum/render-p03f-slice031-product-acceptance.mjs

      - name: Upload Slice031 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice031-product-acceptance
          path: tmp/p03f-slice031-product-acceptance
          if-no-files-found: error
          retention-days: 30
