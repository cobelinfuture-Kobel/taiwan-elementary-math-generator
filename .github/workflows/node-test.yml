name: Node Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: node-test-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Preserve legacy required-check compatibility
        run: |
          echo "Node Test is a temporary required-check compatibility bridge."
          echo "PR Gate / aggregate is the authoritative pull-request regression gate."
