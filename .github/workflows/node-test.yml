name: P03F5 Bootstrap Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f5-bootstrap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice005-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice005-v1
          fetch-depth: 1

      - name: Fetch canonical main
        run: git fetch origin main --depth=1

      - name: Validate staged payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c tmp/p03f5-bootstrap/payload.*
          cat tmp/p03f5-bootstrap/payload.* > /tmp/p03f5.b64
          test "$(wc -c < /tmp/p03f5.b64)" -eq 33553
          base64 -d /tmp/p03f5.b64 > /tmp/p03f5.tar.gz
          gzip -t /tmp/p03f5.tar.gz
          test "$(tar -tzf /tmp/p03f5.tar.gz | wc -l)" -eq 23

      - name: Extract exact implementation tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/p03f5.tar.gz
          test -f src/curriculum/full-product/p03f-slice005-product-admission.mjs
          test -f .github/workflows/p03f5-slice005-product-acceptance.yml

      - name: Prepare canonical commit tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/p03f5-bootstrap
          rm -f .github/workflows/p03f5-bootstrap.yml
          git checkout origin/main -- .github/workflows/node-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short

      - name: Commit exact implementation tree
        run: git commit -m "feat(p03f5): implement W3 direct-product slice005"

      - name: Push exact implementation tree
        run: git push origin HEAD:p03f-w3-direct-product-vertical-slice005-v1
