name: Node Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: node-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        id: full_tests
        continue-on-error: true
        run: |
          mkdir -p tmp
          set -o pipefail
          npm test 2>&1 | tee tmp/npm-test.log
      - name: Install Chromium for product acceptance
        if: steps.full_tests.outcome == 'success' && github.event_name == 'pull_request' && (github.head_ref == 'closeout/15-unit-public-worksheet-v1' || github.head_ref == 'full-product/p01d1-g5b-u05-large-number' || github.head_ref == 'full-product/p01d2-g6a-u01-number-theory' || github.head_ref == 'full-product/p01d3-g5a-u03-factor-multiple' || github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout')
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run 15-unit Chromium PDF and live UI acceptance
        if: steps.full_tests.outcome == 'success' && github.event_name == 'pull_request' && github.head_ref == 'closeout/15-unit-public-worksheet-v1'
        run: node tools/curriculum/render-15-unit-public-worksheet-pdf-smoke.mjs
      - name: Run P01D1 G5B-U05 Chromium PDF acceptance
        if: steps.full_tests.outcome == 'success' && github.event_name == 'pull_request' && (github.head_ref == 'full-product/p01d1-g5b-u05-large-number' || github.head_ref == 'full-product/p01d2-g6a-u01-number-theory' || github.head_ref == 'full-product/p01d3-g5a-u03-factor-multiple' || github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout')
        run: node tools/curriculum/render-p01d1-g5b-u05-pdf-smoke.mjs
      - name: Run P01D2 G6A-U01 Chromium PDF acceptance
        if: steps.full_tests.outcome == 'success' && github.event_name == 'pull_request' && (github.head_ref == 'full-product/p01d2-g6a-u01-number-theory' || github.head_ref == 'full-product/p01d3-g5a-u03-factor-multiple' || github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout')
        run: node tools/curriculum/render-p01d2-g6a-u01-pdf-smoke.mjs
      - name: Run P01D3 G5A-U03 Chromium PDF acceptance
        if: steps.full_tests.outcome == 'success' && github.event_name == 'pull_request' && (github.head_ref == 'full-product/p01d3-g5a-u03-factor-multiple' || github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout')
        run: node tools/curriculum/render-p01d3-g5a-u03-pdf-smoke.mjs
      - name: Run P01E W1 public UI HTML PDF print closeout
        if: steps.full_tests.outcome == 'success' && github.event_name == 'pull_request' && github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout'
        run: node tools/curriculum/render-p01e-w1-public-closeout.mjs
      - name: Commit exact P01E HTML PDF evidence once
        if: steps.full_tests.outcome == 'success' && github.event_name == 'pull_request' && github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          target="docs/curriculum/output/p01e-w1-public-closeout"
          if git cat-file -e "origin/${HEAD_BRANCH}:${target}/report.json" 2>/dev/null; then
            echo "Committed P01E artifacts already exist; skip materialization."
            exit 0
          fi
          git fetch origin "$HEAD_BRANCH"
          git switch -C "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          rm -rf "$target"
          mkdir -p "$target"
          cp tmp/p01e-w1-public-closeout/*.html "$target"/
          cp tmp/p01e-w1-public-closeout/*.pdf "$target"/
          cp tmp/p01e-w1-public-closeout/report.json "$target"/
          sha256sum "$target"/*.html "$target"/*.pdf "$target"/report.json > "$target"/SHA256SUMS
          test "$(find "$target" -maxdepth 1 -name '*.html' | wc -l)" -eq 8
          test "$(find "$target" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "P01E: commit exact HTML PDF artifacts [p01e-artifacts]"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Upload full regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-full-regression-diagnostics
          path: tmp/npm-test.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload 15-unit public worksheet closeout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fifteen-unit-public-worksheet-closeout-report
          path: tmp/15-unit-public-worksheet-closeout-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload 15-unit Chromium acceptance artifacts
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'closeout/15-unit-public-worksheet-v1'
        uses: actions/upload-artifact@v4
        with:
          name: fifteen-unit-public-worksheet-chromium-acceptance
          path: tmp/15-unit-public-worksheet-pdf-smoke
          if-no-files-found: warn
          retention-days: 30
      - name: Upload P01D1 Chromium acceptance artifacts
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'full-product/p01d1-g5b-u05-large-number' || github.head_ref == 'full-product/p01d2-g6a-u01-number-theory' || github.head_ref == 'full-product/p01d3-g5a-u03-factor-multiple' || github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout')
        uses: actions/upload-artifact@v4
        with:
          name: p01d1-g5b-u05-chromium-acceptance
          path: tmp/p01d1-g5b-u05-pdf-smoke
          if-no-files-found: warn
          retention-days: 30
      - name: Upload P01D2 Chromium acceptance artifacts
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'full-product/p01d2-g6a-u01-number-theory' || github.head_ref == 'full-product/p01d3-g5a-u03-factor-multiple' || github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout')
        uses: actions/upload-artifact@v4
        with:
          name: p01d2-g6a-u01-chromium-acceptance
          path: tmp/p01d2-g6a-u01-pdf-smoke
          if-no-files-found: warn
          retention-days: 30
      - name: Upload P01D3 Chromium acceptance artifacts
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'full-product/p01d3-g5a-u03-factor-multiple' || github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout')
        uses: actions/upload-artifact@v4
        with:
          name: p01d3-g5a-u03-chromium-acceptance
          path: tmp/p01d3-g5a-u03-pdf-smoke
          if-no-files-found: warn
          retention-days: 30
      - name: Upload P01E W1 public closeout artifacts
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'full-product/p01e-w1-public-ui-html-pdf-print-closeout'
        uses: actions/upload-artifact@v4
        with:
          name: p01e-w1-public-ui-html-pdf-print-closeout
          path: tmp/p01e-w1-public-closeout
          if-no-files-found: warn
          retention-days: 30
      - name: Block after full regression failure
        if: steps.full_tests.outcome == 'failure'
        run: exit 1
