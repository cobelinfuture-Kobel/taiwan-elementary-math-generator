name: P03F5 Bootstrap Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f5-bootstrap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice005-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice005-v1
          fetch-depth: 1

      - name: Materialize non-workflow implementation tree
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/p03f5-bootstrap/payload.* | base64 -d > /tmp/p03f5.tar.gz
          gzip -t /tmp/p03f5.tar.gz
          tar -xzf /tmp/p03f5.tar.gz
          test -f src/curriculum/full-product/p03f-slice005-product-admission.mjs
          rm -f .github/workflows/p03f5-slice005-product-acceptance.yml
          rm -rf tmp/p03f5-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(p03f5): materialize non-workflow slice005 tree"
          git push origin HEAD:p03f-w3-direct-product-vertical-slice005-v1
