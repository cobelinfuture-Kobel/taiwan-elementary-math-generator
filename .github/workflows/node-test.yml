name: Node Test Post-Merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-test-post-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Post-merge full repository regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        shell: bash
        run: |
          mkdir -p tmp
          set -o pipefail
          npm test 2>&1 | tee tmp/npm-test-post-merge.log
      - name: Upload post-merge regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-post-merge-diagnostics
          path: tmp/npm-test-post-merge.log
          if-no-files-found: error
          retention-days: 30
