name: P06F W6 Q016 Post-Merge Pages E2E
on:
  push:
    branches: [main]
    paths:
      - "site/modules/renderer/pie-chart-comparison-data.js"
      - "site/modules/renderer/html-renderer.js"
      - "site/modules/curriculum/registry/g6b-u06-compare-pie-charts-selector-projection-p06f16.js"
      - "site/modules/curriculum/registry/batch-a-selector-p06f16-extension.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p06f16.js"
      - "site/modules/curriculum/batch-a/g6b-u06-compare-pie-charts-runtime-p06f16.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p06f16.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p06f16-extension.js"
permissions:
  contents: read
jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/run-p06f-w6-q016-live-pages-e2e.mjs
        env:
          P06F16_DEPLOYMENT_RETRIES: "40"
          P06F16_DEPLOYMENT_RETRY_DELAY_MS: "15000"
      - uses: actions/upload-artifact@v4
        with:
          name: p06f-w6-q016-pages-e2e
          path: tmp/p06f-w6-q016-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
