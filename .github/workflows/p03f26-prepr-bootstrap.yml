name: P03F26 Pre-PR Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'data/curriculum/full-product/p03f/slice026-*'
      - 'site/modules/curriculum/**'
      - 'site/assets/browser/state/public-pattern-group-selection.js'
      - 'site/pixel/pixel-registry-bridge.js'
      - 'tools/curriculum/**'
      - 'tests/curriculum/**'
      - '.github/workflows/p03f26-prepr-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'p03f26-g4a-u09-rank8' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cut current consumers to Slice026
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            "site/modules/curriculum/registry/batch-a-selector-extension.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
              ("P03F25 successor", "P03F26 successor"),
            ],
            "site/modules/curriculum/public/public-ui-capability-binding.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/assets/browser/state/public-pattern-group-selection.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/pixel/pixel-registry-bridge.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "site/modules/curriculum/batch-a/batch-a-browser-worksheet-s59j-r1-extension.js": [
              ("batch-a-browser-worksheet-p03f25-extension.js", "batch-a-browser-worksheet-p03f26-extension.js"),
            ],
            "tools/curriculum/materialize-pgc-r02-ui-capability-binding.mjs": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
            ],
            "tests/curriculum/pgc-r02-public-ui-capability-binding.test.js": [
              ("batch-a-selector-p03f25-extension.js", "batch-a-selector-p03f26-extension.js"),
              ("assert.equal(contract.summary.visibleKnowledgePointCount, 212);", "assert.equal(contract.summary.visibleKnowledgePointCount, 216);"),
            ],
          }
          for repo_path, pairs in replacements.items():
            path = Path(repo_path)
            text = path.read_text(encoding="utf-8")
            original = text
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f"P03F26_EXPECTED_TOKEN_MISSING:{repo_path}:{old}")
              text = text.replace(old, new)
            if text == original:
              raise SystemExit(f"P03F26_NO_CHANGE:{repo_path}")
            path.write_text(text, encoding="utf-8")

          public_binding = Path("site/modules/curriculum/public/public-ui-capability-binding.js")
          text = public_binding.read_text(encoding="utf-8")
          import_anchor = 'import { G4A_U06_P03F25_KP_ID } from "../registry/g4a-u06-improper-mixed-conversion-selector-projection-p03f25.js";'
          import_line = 'import { G4A_U09_P03F26_SOURCE_ID } from "../registry/g4a-u09-rank8-decimal-selector-projection-p03f26.js";'
          if import_line not in text:
            if import_anchor not in text:
              raise SystemExit("P03F26_PUBLIC_BINDING_IMPORT_ANCHOR_MISSING")
            text = text.replace(import_anchor, import_anchor + "\n" + import_line)

          function_anchor = "\nfunction needsStructuralFallback(binding) {"
          function_block = r'''
function g4aU09CurrentBinding(input = {}) {
  if (input.sourceId !== G4A_U09_P03F26_SOURCE_ID) return null;
  const selectionMode = input.selectionMode ?? SOURCE_UNIT_MODE;
  const visibleRows = listVisibleBatchAKnowledgePoints().filter((row) => row.sourceId === G4A_U09_P03F26_SOURCE_ID);
  const allowedIds = visibleRows.map((row) => row.knowledgePointId);
  const requested = uniqueStrings(input.selectedKnowledgePointIds).filter((id) => allowedIds.includes(id));
  let selectedKnowledgePointIds;
  if (selectionMode === SINGLE_KP_MODE) {
    selectedKnowledgePointIds = [requested[0] ?? allowedIds[0]].filter(Boolean);
  } else if (selectionMode === SAME_UNIT_MIXED_MODE) {
    selectedKnowledgePointIds = requested.length > 0 ? requested : allowedIds;
  } else {
    selectedKnowledgePointIds = allowedIds;
  }
  const compatiblePatternGroups = selectedKnowledgePointIds.flatMap((knowledgePointId) => {
    const row = visibleRows.find((entry) => entry.knowledgePointId === knowledgePointId);
    return getVisiblePatternGroupsForKnowledgePoint(knowledgePointId).map((group) => Object.freeze({
      ...group,
      knowledgePointId,
      knowledgePointDisplayName: row?.displayName ?? knowledgePointId,
      effectiveQuestionType: "numeric",
      uiQuestionType: "numeric",
      displayLabel: row?.displayName ?? group.displayName ?? "數字題",
      selected: true,
    }));
  });
  const compatiblePatternGroupIds = uniqueStrings(compatiblePatternGroups.map((group) => group.patternGroupId));
  return Object.freeze({
    sourceId: G4A_U09_P03F26_SOURCE_ID,
    surfaceId: input.surfaceId ?? PUBLIC_UI_SURFACES.CLASSIC,
    selectionMode,
    availableSelectionModes: Object.freeze([
      Object.freeze({ value: SOURCE_UNIT_MODE, enabled: true }),
      Object.freeze({ value: SINGLE_KP_MODE, enabled: allowedIds.length > 0 }),
      Object.freeze({ value: SAME_UNIT_MIXED_MODE, enabled: allowedIds.length >= 2 }),
      Object.freeze({ value: "mixedKnowledgePointsCrossUnit", enabled: false }),
    ]),
    selectedKnowledgePointIds: Object.freeze(selectedKnowledgePointIds),
    selectedKnowledgePointCount: selectedKnowledgePointIds.length,
    availableQuestionTypeOptions: Object.freeze([Object.freeze({ value: "numeric", label: "數字題" })]),
    questionType: "numeric",
    compatiblePatternGroups: Object.freeze(compatiblePatternGroups),
    compatiblePatternGroupIds: Object.freeze(compatiblePatternGroupIds),
    selectedCompatiblePatternGroupIds: Object.freeze(compatiblePatternGroupIds),
    depthOptions: Object.freeze([]),
    contextOptions: Object.freeze([]),
    depthMode: null,
    contextMode: null,
    questionCount: PUBLIC_UI_SAFE_QUESTION_COUNT,
    capacityStatus: "STRUCTURAL_FALLBACK_AVAILABLE",
    capacityRegistryStatus: PUBLIC_GENERATOR_CAPACITY_REGISTRY_STATUS,
    capacityRouteIds: Object.freeze([]),
    capacityQualityStatuses: Object.freeze(["P03F26_G4A_U09_SIX_KP_STRUCTURAL_RUNTIME"]),
    capacityReconciliation: PUBLIC_UI_RUNTIME_CAPACITY_RECONCILIATION,
    blocked: false,
    blockedReasons: Object.freeze([]),
  });
}
'''
          if "function g4aU09CurrentBinding(input = {})" not in text:
            if function_anchor not in text:
              raise SystemExit("P03F26_PUBLIC_BINDING_FUNCTION_ANCHOR_MISSING")
            text = text.replace(function_anchor, "\n" + function_block + function_anchor, 1)

          resolve_anchor = "  const g4aU06 = g4aU06CurrentBinding(input);\n  if (g4aU06) return g4aU06;"
          resolve_replacement = resolve_anchor + "\n  const g4aU09 = g4aU09CurrentBinding(input);\n  if (g4aU09) return g4aU09;"
          if "const g4aU09 = g4aU09CurrentBinding(input);" not in text:
            if resolve_anchor not in text:
              raise SystemExit("P03F26_PUBLIC_BINDING_RESOLVE_ANCHOR_MISSING")
            text = text.replace(resolve_anchor, resolve_replacement, 1)
          public_binding.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary bootstrap from candidate tree
        run: |
          rm -f .github/workflows/p03f26-prepr-bootstrap.yml
          rm -f .github/p03f26-bootstrap-trigger.txt

      - name: Materialize current PGC-R02 authority
        run: node tools/curriculum/materialize-pgc-r02-ui-capability-binding-r03.mjs

      - name: Run focused Slice026 contracts
        run: node --test tests/curriculum/p03f-slice026-authority-preflight.test.js tests/curriculum/p03f-slice026-g4a-u09-rank8-decimal.test.js tests/curriculum/pgc-r02-public-ui-capability-binding.test.js

      - name: Run full regression
        run: npm test

      - name: Commit current cutover and generated authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(p03f26): cut current consumers to Slice026 [skip ci]"
          git push origin HEAD:p03f26-g4a-u09-rank8
