name: P06F W6 Q001 Post-Merge Pages E2E
on:
  push:
    branches: [main]
    paths:
      - "site/modules/curriculum/batch-a/source-units.js"
      - "site/modules/curriculum/registry/g3a-u07-pattern-relation-selector-projection-p06f01.js"
      - "site/modules/curriculum/registry/batch-a-selector-p06f01-extension.js"
      - "site/modules/curriculum/registry/batch-a-selector-p04f33-extension.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p06f01.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p04f33.js"
      - "site/modules/curriculum/batch-a/g3a-u07-pattern-relation-runtime-p06f01.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p06f01.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p05f60.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p06f01-extension.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p05f60-extension.js"
      - ".github/workflows/p06f-w6-q001-live-pages-e2e.yml"
permissions:
  contents: read
jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/run-p06f-w6-q001-live-pages-e2e.mjs
        env:
          P06F01_DEPLOYMENT_RETRIES: "30"
          P06F01_DEPLOYMENT_RETRY_DELAY_MS: "15000"
      - uses: actions/upload-artifact@v4
        with:
          name: p06f-w6-q001-pages-e2e
          path: tmp/p06f-w6-q001-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
