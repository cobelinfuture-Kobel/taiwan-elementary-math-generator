name: P07F W7 Q007 Post-Merge Pages E2E
on:
  push:
    branches: [main]
    paths:
      - "site/modules/curriculum/registry/g6a-u09-scale-factor-length-selector-projection-p07f07.js"
      - "site/modules/curriculum/registry/batch-a-selector-p07f07-extension.js"
      - "site/modules/curriculum/public/public-ui-capability-binding-p07f07.js"
      - "site/modules/curriculum/batch-a/g6a-u09-scale-factor-length-runtime-p07f07.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p07f07.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p07f07-extension.js"
      - "site/modules/curriculum/batch-a/source-units.js"
permissions:
  contents: read
jobs:
  live-pages-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tools/curriculum/run-p07f-w7-q007-live-pages-e2e.mjs
        env:
          P07F07_DEPLOYMENT_RETRIES: "60"
          P07F07_DEPLOYMENT_RETRY_DELAY_MS: "15000"
      - uses: actions/upload-artifact@v4
        with:
          name: p07f-w7-q007-pages-e2e
          path: tmp/p07f-w7-q007-live-pages-e2e
          if-no-files-found: error
          retention-days: 30
