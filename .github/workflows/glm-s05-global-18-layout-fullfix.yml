name: GLM-S05 Global 18-Layout FullFix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-global-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate architecture
        run: node --test tests/curriculum/glm-s04-global-layout-architecture.test.js

      - name: Capture focused 270-scenario diagnostic
        run: node tools/curriculum/run-glm-s05-focused-diagnostic.mjs

      - name: Validate FullFix
        run: node --test tests/curriculum/glm-s05-global-18-layout-fullfix.test.js

      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glm-s05-focused-diagnostic
          if-no-files-found: error
          retention-days: 30
          path: docs/curriculum/output/glm-s05-focused-diagnostic/current.json

      - name: Remove transient diagnostic before clean-tree gate
        if: always()
        run: rm -rf docs/curriculum/output/glm-s05-focused-diagnostic

      - name: Verify repository remains clean
        if: always()
        run: git diff --exit-code && git status --short

