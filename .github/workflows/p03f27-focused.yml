name: P03F27 Focused Product Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p03f27-focused.yml"
      - "data/curriculum/full-product/p03f/slice027-g4b-u08-rank8-fraction-authority.json"
      - "site/modules/curriculum/registry/g4b-u08-rank8-fraction-selector-projection-p03f27.js"
      - "site/modules/curriculum/registry/batch-a-selector-p03f27-extension.js"
      - "site/modules/curriculum/batch-a/source-pattern-full-product-p03f27-extension.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-generator-p03f27.js"
      - "site/modules/curriculum/batch-a/g4b-u08-rank8-fraction-runtime-p03f27.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-question-router-p03f27.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-validator-p03f27.js"
      - "site/modules/curriculum/batch-a/batch-a-browser-worksheet-p03f27-extension.js"
      - "tests/curriculum/p03f-slice027-*.test.js"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Slice027 focused contracts
        run: node --test tests/curriculum/p03f-slice027-authority-preflight.test.js tests/curriculum/p03f-slice027-g4b-u08-rank8-fraction.test.js
