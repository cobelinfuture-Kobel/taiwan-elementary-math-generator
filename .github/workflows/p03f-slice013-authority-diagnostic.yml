name: P03F13 W02 Authority Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice013-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Extract exact W02 authority objects and capability witnesses
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tmp/p03f-slice013-authority-diagnostic
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { materializeP03FSlice013ProductAdmission } from './src/curriculum/full-product/p03f-slice013-product-admission.mjs';
          const target = 'ps_g5a_u04_quotient_as_fraction_context_share_per_recipient_application';
          const files = [
            'docs/curriculum/output/postg-app/w02-a06/POSTG_APP_W02_A06_PRODUCTION_EQUIVALENT_PACKAGE.json',
            'docs/curriculum/output/postg-app/w02-a07/POSTG_APP_W02_A07_HUMAN_REVIEW_DATA.json',
            'data/curriculum/application/assessment/w02-atomic-context-single-application-candidate-pack-index.json',
          ];
          const results = [];
          function walk(value, location, sourceFile) {
            if (!value || typeof value !== 'object') return;
            if (value.patternSpecId === target
              || value.applicationPatternSpecId === target
              || value.generatedItemId === `shared_generated_${target}`
              || String(value.bindingCandidateId ?? '').includes('g5a_u04_quotient_as_fraction_context')) {
              results.push({ sourceFile, location, value });
            }
            if (Array.isArray(value)) value.forEach((child, index) => walk(child, `${location}[${index}]`, sourceFile));
            else for (const [key, child] of Object.entries(value)) walk(child, `${location}.${key}`, sourceFile);
          }
          for (const sourceFile of files) walk(JSON.parse(fs.readFileSync(sourceFile, 'utf8')), '$', sourceFile);
          const admission = materializeP03FSlice013ProductAdmission();
          const q = admission.generation.questions[0];
          const directArithmetic = admission.fractionArithmetic.execute({
            action: 'MULTIPLY', knowledgePointId: q.metadata.knowledgePointId, sourceNodeId: q.sourceId,
            leftValue: { numerator: q.simplestNumerator, denominator: q.simplestDenominator },
            rightValue: { numerator: q.commonFactor, denominator: q.commonFactor },
            resultPolicy: { allowedMagnitudeClasses: ['PROPER_FRACTION','IMPROPER_FRACTION','WHOLE_NUMBER'], allowZero: false, maxCanonicalDenominator: 60 },
            assertedCapabilityId: 'cap_fraction_arithmetic',
          });
          fs.writeFileSync('tmp/p03f-slice013-authority-diagnostic/extracted.json', `${JSON.stringify({ target, count: results.length, results, capabilityWitnesses: admission.capabilityWitnesses, directArithmetic, arithmeticDescriptor: admission.fractionArithmetic.getDescriptor(q.metadata.knowledgePointId) }, null, 2)}\n`);
          if (results.length === 0 || admission.capabilityWitnesses.length === 0) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p03f-slice013-authority-diagnostic
          path: tmp/p03f-slice013-authority-diagnostic
          if-no-files-found: error
          retention-days: 7
