name: P03F13 W02 Authority Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice013-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Locate exact W02 authority
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tmp/p03f-slice013-authority-diagnostic
          grep -R -n -C 12 --exclude-dir=.git \
            -e 'kp_g5a_u04_quotient_as_fraction_context' \
            -e 'ps_g5a_u04_quotient_as_fraction_context_share_per_recipient_application' \
            -e 'w02_bind_ps_g5a_u04_quotient_as_fraction_context' \
            data src site docs tools tests \
            > tmp/p03f-slice013-authority-diagnostic/matches.txt || true
          find data/curriculum/application -type f -print \
            > tmp/p03f-slice013-authority-diagnostic/application-files.txt
          test -s tmp/p03f-slice013-authority-diagnostic/matches.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p03f-slice013-authority-diagnostic
          path: tmp/p03f-slice013-authority-diagnostic
          if-no-files-found: error
          retention-days: 7
