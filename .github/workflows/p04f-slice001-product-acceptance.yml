name: P04F Slice001 Product Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04f1-product-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-core-acceptance:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p04f1-w4-ruler-reading-implementation-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run P04F1 focused contracts
        run: |
          node --test \
            tests/curriculum/p04f-slice001-g3a-u04-ruler-reading.test.js \
            tests/curriculum/p04f-slice001-current-public-binding.test.js

  chromium-product-acceptance:
    needs: focused-core-acceptance
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p04f1-w4-ruler-reading-implementation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and acceptance font
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @fontsource/noto-sans-tc@5.2.9
          npx playwright install --with-deps chromium
      - name: Run P04F1 Chromium product acceptance
        run: node tools/curriculum/render-p04f-slice001-product-acceptance.mjs
      - name: Upload P04F1 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04f-slice001-product-acceptance
          path: tmp/p04f-slice001-product-acceptance
          if-no-files-found: error
          retention-days: 30
