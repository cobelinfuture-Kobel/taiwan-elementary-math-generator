name: P01E Exact Artifact Materialization

on:
  push:
    branches:
      - full-product/p01e-w1-public-ui-html-pdf-print-closeout
    paths:
      - .github/workflows/p01e-exact-artifact-materialization.yml

permissions:
  contents: write

concurrency:
  group: p01e-exact-artifact-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor == 'cobelinfuture-Kobel'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: full-product/p01e-w1-public-ui-html-pdf-print-closeout
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate exact P01E artifacts
        run: node tools/curriculum/render-p01e-w1-public-closeout.mjs

      - name: Materialize committed evidence
        run: |
          set -euo pipefail
          target="docs/curriculum/output/p01e-w1-public-closeout"
          rm -rf "$target"
          mkdir -p "$target"
          cp tmp/p01e-w1-public-closeout/*.html "$target"/
          cp tmp/p01e-w1-public-closeout/*.pdf "$target"/
          cp tmp/p01e-w1-public-closeout/report.json "$target"/
          sha256sum "$target"/*.html "$target"/*.pdf "$target"/report.json > "$target"/SHA256SUMS
          test "$(find "$target" -maxdepth 1 -name '*.html' | wc -l)" -eq 8
          test "$(find "$target" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('docs/curriculum/output/p01e-w1-public-closeout/report.json', 'utf8'));
          if (report.status !== 'PASS') throw new Error('P01E report is not PASS');
          if (report.actualPdfCaseCount !== 8 || report.numericPdfPass !== 4 || report.applicationPdfPass !== 4) throw new Error('P01E PDF counts invalid');
          if (report.overflowFindingCount !== 0 || report.consoleErrorCount !== 0 || report.pageErrorCount !== 0) throw new Error('P01E browser acceptance errors present');
          if (report.classic?.generationCount !== 8 || report.pixel?.generationCount !== 8) throw new Error('P01E live UI counts invalid');
          NODE

      - name: Commit exact artifacts to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/curriculum/output/p01e-w1-public-closeout
          git diff --cached --quiet && { echo "No artifact changes to commit"; exit 0; }
          git commit -m "P01E: commit exact HTML PDF artifacts [p01e-artifacts]"
          git push origin HEAD:full-product/p01e-w1-public-ui-html-pdf-print-closeout
