name: P03F5 E5 Artifact Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f5-e5-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice005-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice005-v1
          fetch-depth: 1

      - name: Finalize committed hashes, visual review and E5 claim
        run: python tmp/p03f5-finalize-e5.py

      - name: Commit E5 evidence only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/curriculum/output/p03f-slice005-product-admission/p03f-slice005-product-acceptance-report.json \
            data/curriculum/full-product/p03f/slice005-product-admission.manifest.json \
            data/project/milestones/FPL-P03F5.claim.json \
            docs/curriculum/output/P03F_W3_DIRECT_PRODUCT_VERTICAL_SLICE005_READBACK.md
          git rm tmp/p03f5-finalize-e5.py
          git commit -m "chore(p03f5): admit reviewed artifacts at E5"
          git push origin HEAD:p03f-w3-direct-product-vertical-slice005-v1
