name: P03F5 Artifact Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f5-artifact-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice005-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice005-v1
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and Chromium
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Render exact slice005 artifacts
        run: node tools/curriculum/render-p03f-slice005-product-acceptance.mjs

      - name: Commit materialized artifacts only
        shell: bash
        run: |
          set -euo pipefail
          destination="docs/curriculum/output/p03f-slice005-product-admission"
          mkdir -p "$destination"
          cp tmp/p03f-slice005-product-acceptance/g4b-u08-equivalent-fraction.html "$destination/"
          cp tmp/p03f-slice005-product-acceptance/g4b-u08-equivalent-fraction.pdf "$destination/"
          cp tmp/p03f-slice005-product-acceptance/p03f-slice005-product-acceptance-report.json "$destination/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          git commit -m "chore(p03f5): materialize Chromium acceptance artifacts"
          git push origin HEAD:p03f-w3-direct-product-vertical-slice005-v1
