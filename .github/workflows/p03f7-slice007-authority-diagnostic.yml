name: P03F7 Payload Integrity Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p03f7-payload-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice007-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Audit exact payload
        shell: bash
        run: |
          set +e
          OUT=tmp/p03f7-payload-integrity
          mkdir -p "$OUT"
          {
            echo '=== lengths ==='
            wc -c .p03f7-bootstrap/part_00 .p03f7-bootstrap/part_01 .p03f7-bootstrap/part_02 .p03f7-bootstrap/part_03 .p03f7-bootstrap/part_04
            echo '=== part hashes ==='
            sha256sum .p03f7-bootstrap/part_00 .p03f7-bootstrap/part_01 .p03f7-bootstrap/part_02 .p03f7-bootstrap/part_03 .p03f7-bootstrap/part_04
            cat .p03f7-bootstrap/part_00 .p03f7-bootstrap/part_01 .p03f7-bootstrap/part_02 .p03f7-bootstrap/part_03 .p03f7-bootstrap/part_04 > "$OUT/payload.b64"
            echo '=== combined ==='
            wc -c "$OUT/payload.b64"
            sha256sum "$OUT/payload.b64"
            base64 --decode "$OUT/payload.b64" > "$OUT/payload.tar.gz"
            echo "base64_status=$?"
            wc -c "$OUT/payload.tar.gz"
            sha256sum "$OUT/payload.tar.gz"
            tar -tzf "$OUT/payload.tar.gz" > "$OUT/tar-list.txt"
            echo "tar_status=$?"
            head -50 "$OUT/tar-list.txt"
          } > "$OUT/audit.txt" 2>&1
          cat "$OUT/audit.txt"
      - name: Upload integrity audit
        uses: actions/upload-artifact@v4
        with:
          name: p03f7-payload-integrity
          path: tmp/p03f7-payload-integrity
          if-no-files-found: error
          retention-days: 7
