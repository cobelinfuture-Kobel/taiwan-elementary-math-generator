name: P03F7 Slice007 Implementation Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f7-implementation-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice007-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: p03f-w3-direct-product-vertical-slice007-v1
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair and decode exact implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p = Path('.p03f7-bootstrap/part_03')
          data = p.read_text()
          old = sha256(data.encode()).hexdigest()
          if old == '8db98ef5565f441a2051bf202c3afa5940aafffde5b56374f74f6f07cfdf36a3':
              needle = 'VaDzEDCdedh'
              assert data.count(needle) == 1
              data = data.replace(needle, 'VaDzEDCadedh', 1)
              p.write_text(data)
          assert len(data) == 7000
          assert sha256(data.encode()).hexdigest() == '9f3860f436f2d86ef8809407d173f4fb5fb95f4c5ada458cd9fa18da1d4ac530'
          PY
          cat .p03f7-bootstrap/part_00 .p03f7-bootstrap/part_01 .p03f7-bootstrap/part_02 .p03f7-bootstrap/part_03 .p03f7-bootstrap/part_04 > /tmp/p03f7_payload.b64
          test "$(wc -c < /tmp/p03f7_payload.b64)" -eq 30892
          echo 'b24c734cecd1f31bf0e340ef1b50b12a6802f504b3238e60ce504f148653c666  /tmp/p03f7_payload.b64' | sha256sum -c -
          base64 --decode /tmp/p03f7_payload.b64 > /tmp/p03f7_payload.tar.gz
          echo '4e4abd13f1c19c780c8ce6efe4c39efae6bb9a8191f98bc593edeb2920a7626e  /tmp/p03f7_payload.tar.gz' | sha256sum -c -
          mkdir -p .p03f7-payload
          tar -xzf /tmp/p03f7_payload.tar.gz -C .p03f7-payload
      - name: Materialize and validate successor architecture
        shell: bash
        run: |
          set -euo pipefail
          cp .p03f7-payload/tools/curriculum/p03f7-materialize-implementation.py tools/curriculum/p03f7-materialize-implementation.py
          python tools/curriculum/p03f7-materialize-implementation.py
          rm -rf .p03f7-bootstrap .p03f7-payload
          while IFS= read -r file; do node --check "$file"; done < <(find site src tools tests -type f \( -name '*p03f7*.js' -o -name '*p03f7*.mjs' -o -name '*fraction-unit-conversion*.js' -o -name '*fraction-unit-conversion*.mjs' \) | sort)
          node --test tests/curriculum/p03f-slice007-fraction-unit-conversion.test.js
          node tools/curriculum/validate-p03f-slice007-product-admission.mjs
      - name: Commit and push with diagnostics
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT=/tmp/p03f7-commit-diagnostic
          mkdir -p "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short > "$OUT/status.txt" 2>&1
          git diff --cached --stat > "$OUT/stat.txt" 2>&1
          git diff --cached --check > "$OUT/diff-check.txt" 2>&1
          CHECK=$?
          git commit -m "feat(p03f7): implement fraction unit conversion D0 slice" > "$OUT/commit.txt" 2>&1
          COMMIT=$?
          if [ "$COMMIT" -eq 0 ]; then
            git rev-parse HEAD > "$OUT/commit-sha.txt"
            git push origin HEAD:p03f-w3-direct-product-vertical-slice007-v1 > "$OUT/push.txt" 2>&1
            PUSH=$?
          else
            PUSH=99
            echo 'push skipped because commit failed' > "$OUT/push.txt"
          fi
          printf 'diff_check_status=%s\ncommit_status=%s\npush_status=%s\n' "$CHECK" "$COMMIT" "$PUSH" > "$OUT/result.txt"
          cat "$OUT/result.txt"
          exit $(( CHECK != 0 || COMMIT != 0 || PUSH != 0 ))
      - name: Upload commit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f7-commit-diagnostic
          path: /tmp/p03f7-commit-diagnostic
          if-no-files-found: error
          retention-days: 7
      - name: Enforce publish success
        if: steps.publish.outcome != 'success'
        run: exit 1
