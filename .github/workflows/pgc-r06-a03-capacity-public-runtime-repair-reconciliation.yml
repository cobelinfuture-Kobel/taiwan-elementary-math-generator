name: PGC-R06 A03 Capacity Public Runtime Repair Reconciliation

on:
  pull_request:
    paths:
      - "tools/curriculum/apply-pgc-r06-a03-binding-identity-join-fix.mjs"
      - "tools/curriculum/apply-pgc-r06-a03-diversity-gap-derivation-fix.mjs"
      - "tools/curriculum/apply-pgc-r06-a03-v3-evidence-compatibility-fix.mjs"
      - "tools/curriculum/materialize-pgc-r06-a03-capacity-public-runtime-repair-reconciliation.mjs"
      - "tests/curriculum/pgc-r03-generator-capacity-contract.test.js"
      - "tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js"
      - "data/curriculum/public-generation/generator_capacity_contract.json"
      - "data/curriculum/public-generation/ui_capability_binding_contract.json"
      - "data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json"
      - "data/curriculum/public-generation/PGC-R06-A02.g5a-u02-live-diagnostics.json"
      - "site/modules/curriculum/public/public-generator-capacity-registry.js"
      - "site/modules/curriculum/public/public-ui-capability-binding.js"
      - "docs/curriculum/output/PGC-R06-A03_CapacityPublicRuntimeRepairReconciliation.md"
      - ".github/workflows/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r06-a03-reconciliation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply canonical public-binding identity join
        run: node tools/curriculum/apply-pgc-r06-a03-binding-identity-join-fix.mjs

      - name: Apply live-evidence diversity-gap derivation
        run: node tools/curriculum/apply-pgc-r06-a03-diversity-gap-derivation-fix.mjs

      - name: Apply V3 evidence and registry compatibility
        run: node tools/curriculum/apply-pgc-r06-a03-v3-evidence-compatibility-fix.mjs

      - name: Materialize four-node reconciliation
        run: node tools/curriculum/materialize-pgc-r06-a03-capacity-public-runtime-repair-reconciliation.mjs

      - name: Syntax-check reconciliation authorities
        run: |
          node --check tools/curriculum/apply-pgc-r06-a03-binding-identity-join-fix.mjs
          node --check tools/curriculum/apply-pgc-r06-a03-diversity-gap-derivation-fix.mjs
          node --check tools/curriculum/apply-pgc-r06-a03-v3-evidence-compatibility-fix.mjs
          node --check tools/curriculum/materialize-pgc-r06-a03-capacity-public-runtime-repair-reconciliation.mjs
          node --check site/modules/curriculum/public/public-generator-capacity-registry.js
          node --check site/modules/curriculum/public/public-ui-capability-binding.js
          node --check tests/curriculum/pgc-r03-generator-capacity-contract.test.js
          node --check tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js

      - name: Focused four-node acceptance
        run: node --test tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js

      - name: Existing capacity contract acceptance
        run: node --test tests/curriculum/pgc-r03-generator-capacity-contract.test.js

      - name: Full repository regression
        run: npm test

      - name: Commit reconciled authorities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/curriculum/materialize-pgc-r06-a03-capacity-public-runtime-repair-reconciliation.mjs \
            tests/curriculum/pgc-r03-generator-capacity-contract.test.js \
            tests/curriculum/pgc-r06-a03-capacity-public-runtime-repair-reconciliation.test.js \
            data/curriculum/public-generation/generator_capacity_contract.json \
            data/curriculum/public-generation/ui_capability_binding_contract.json \
            data/curriculum/public-generation/PGC-R06.reasoning-mixed-pbl-inventory.json \
            site/modules/curriculum/public/public-generator-capacity-registry.js \
            site/modules/curriculum/public/public-ui-capability-binding.js \
            docs/curriculum/output/PGC-R06-A03_CapacityPublicRuntimeRepairReconciliation.md
          if git diff --cached --quiet; then
            echo "PGC-R06 A03 authorities already synchronized."
          else
            git commit -m "feat(pgc-r06): reconcile capacity public runtime and repair queue [skip ci]"
            git fetch origin "${{ github.head_ref || github.ref_name }}"
            git rebase "origin/${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
