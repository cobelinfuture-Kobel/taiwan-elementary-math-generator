name: P03F9 Slice009 Product Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p03f9-slice009-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  chromium:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice009-v1'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P03F9_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout pull request head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install project dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false playwright@1.51.1
      - name: Detect binary materialization state
        id: materialization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('data/curriculum/full-product/p03f/slice009-product-admission.manifest.json', 'utf8'));
          const needsMaterialization = manifest.status === 'SLICE009_RUNTIME_CONNECTED_PENDING_CHROMIUM_ACCEPTANCE';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needsMaterialization}\n`);
          NODE
      - name: Validate slice009 fail-closed or admitted state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/p03f-slice009-product-acceptance
          node tools/curriculum/validate-p03f-slice009-product-admission.mjs 2>&1 | tee tmp/p03f-slice009-product-acceptance/validator.log
      - name: Render Chromium acceptance
        run: node tools/curriculum/render-p03f-slice009-product-acceptance.mjs
      - name: Materialize runner binary artifacts
        if: steps.materialization.outputs.needed == 'true'
        run: node tools/curriculum/materialize-p03f-slice009-runner-artifacts.mjs
      - name: Commit runner binary artifacts
        if: steps.materialization.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/curriculum/full-product/p03f/slice009-product-admission.manifest.json \
            docs/curriculum/output/p03f-slice009-product-admission/g3b-u09-tenths-fraction-decimal.html \
            docs/curriculum/output/p03f-slice009-product-admission/g3b-u09-tenths-fraction-decimal.pdf \
            docs/curriculum/output/p03f-slice009-product-admission/p03f-slice009-product-acceptance-report.json
          git diff --cached --quiet && exit 0
          git commit -m "P03F9: materialize runner binary HTML PDF artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload slice009 product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice009-product-acceptance
          path: tmp/p03f-slice009-product-acceptance
          if-no-files-found: warn
          retention-days: 30
