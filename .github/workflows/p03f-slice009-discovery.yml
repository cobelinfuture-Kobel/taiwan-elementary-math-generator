name: P03F9 Slice009 Authority Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discovery:
    if: github.head_ref == 'p03f-w3-direct-product-vertical-slice009-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize exact queue and source authority
        run: |
          mkdir -p tmp/p03f-slice009-discovery
          node tools/curriculum/diagnose-p03f-slice009-authority.mjs | tee tmp/p03f-slice009-discovery/authority.log
      - name: Trace current P03F8 consumer imports
        shell: bash
        run: |
          {
            echo '=== p03f8 worksheet extension references ==='
            grep -R -n --exclude-dir=.git 'batch-a-browser-worksheet-p03f8-extension' . || true
            echo '=== requestsP03F8DecimalSlice references ==='
            grep -R -n --exclude-dir=.git 'requestsP03F8DecimalSlice' . || true
            echo '=== p03f8 generator references ==='
            grep -R -n --exclude-dir=.git 'batch-a-browser-generator-p03f8' . || true
            echo '=== p03f8 validator references ==='
            grep -R -n --exclude-dir=.git 'batch-a-browser-validator-p03f8' . || true
            echo '=== p03f8 selector references ==='
            grep -R -n --exclude-dir=.git 'batch-a-selector-p03f8-extension' . || true
          } | tee tmp/p03f-slice009-discovery/consumer-trace.log
      - name: Upload bounded discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: p03f-slice009-authority-discovery
          path: tmp/p03f-slice009-discovery
          if-no-files-found: error
          retention-days: 30
