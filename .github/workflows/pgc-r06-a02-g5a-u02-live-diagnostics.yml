name: PGC-R06 A02 G5A-U02 Live Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgc-r06-a02-g5a-u02-live-diagnostics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout A02 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply all-queued-gap diagnostic scope
        run: node tools/curriculum/apply-pgc-r06-a02-g5a-u02-diagnostic-scope-patch.mjs

      - name: Apply G5A-U02 reasoning mixed diversity FullFix
        run: node tools/curriculum/apply-pgc-r06-a02-g5a-u02-duplicate-prompt-patch.mjs

      - name: Apply Class C seed collision FullFix
        run: node tools/curriculum/apply-pgc-r06-a02-g5a-u02-class-c-seed-collision-fix.mjs

      - name: Apply S107 deterministic diversity FullFix
        run: node tools/curriculum/apply-pgc-r06-a02-g5a-u02-s107-diversity-fix.mjs

      - name: Syntax-check A02 authorities
        run: |
          node --check tools/curriculum/apply-pgc-r06-a02-g5a-u02-diagnostic-scope-patch.mjs
          node --check tools/curriculum/apply-pgc-r06-a02-g5a-u02-duplicate-prompt-patch.mjs
          node --check tools/curriculum/apply-pgc-r06-a02-g5a-u02-class-c-seed-collision-fix.mjs
          node --check tools/curriculum/apply-pgc-r06-a02-g5a-u02-s107-diversity-fix.mjs
          node --check tools/curriculum/materialize-pgc-r06-a02-g5a-u02-live-diagnostics.mjs
          node --check src/curriculum/g5a-u02/browser-dynamic-entry.js
          node --check src/curriculum/g5a-u02/class-c-generator-validator.js
          node --check src/curriculum/g5a-u02/class-c-hidden-projection-binding.js
          node --check src/curriculum/g5a-u02/class-d-semantic-generator-validator.js
          node --check src/curriculum/g5a-u02/s101-representation-runtime.js
          node --check src/curriculum/g5a-u02/s103-digit-code-runtime.js
          node --check src/curriculum/g5a-u02/s107-selection-symbolic-common-runtime.js
          node --check src/curriculum/g5a-u02/s108-remainder-transfer-runtime.js

      - name: Rebuild canonical G5A-U02 browser bundle
        run: |
          npx --yes esbuild@0.25.5 \
            src/curriculum/g5a-u02/browser-dynamic-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --minify \
            --banner:js='/* GENERATED CANONICAL G5A-U02 RUNTIME — DO NOT EDIT */' \
            --outfile=site/modules/curriculum/batch-b/g5a-u02-browser-dynamic-runtime.bundle.js
          npx --yes esbuild@0.25.5 \
            src/curriculum/g5a-u02/browser-dynamic-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --minify \
            --banner:js='/* GENERATED CANONICAL G5A-U02 RUNTIME — DO NOT EDIT */' \
            --outfile=/tmp/g5a-u02-browser-dynamic-runtime.bundle.js
          cmp site/modules/curriculum/batch-b/g5a-u02-browser-dynamic-runtime.bundle.js /tmp/g5a-u02-browser-dynamic-runtime.bundle.js

      - name: Materialize 98-route public-pipeline diagnostics
        run: node tools/curriculum/materialize-pgc-r06-a02-g5a-u02-live-diagnostics.mjs

      - name: Require all 98 routes live at 20 questions
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("data/curriculum/public-generation/PGC-R06-A02.g5a-u02-live-diagnostics.json", "utf8"));
          if (report.summary.targetRouteCount !== 98
            || report.summary.live20PassRouteCount !== 98
            || report.summary.live20FailRouteCount !== 0
            || report.routes.length !== 98
            || report.routes.some((route) => route.sourceId !== "g5a_u02_5a02")
            || report.routes.some((route) => route.diagnosticRuns.some((run) => run.uniquePromptCount !== 20 || run.answerKeyItemCount !== 20))) {
            throw new Error(`PGC_R06_A02_LIVE_GATE_FAILED:${JSON.stringify(report.summary)}`);
          }
          console.log(`PGC_R06_A02_LIVE_GATE=PASS:${JSON.stringify(report.summary)}`);
          NODE

      - name: Focused G5A-U02 generator validator acceptance
        run: |
          node --test tests/curriculum/g5a-u02-class-c-generator-validator.test.js
          node --test tests/curriculum/g5a-u02-class-d-semantic-generator-validator.test.js
          node --test tests/curriculum/g5a-u02-canonical-resolver.test.js

      - name: Full repository regression
        run: npm test

      - name: Commit deterministic runtime and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/curriculum/materialize-pgc-r06-a02-g5a-u02-live-diagnostics.mjs \
            src/curriculum/g5a-u02/browser-dynamic-entry.js \
            src/curriculum/g5a-u02/class-c-generator-validator.js \
            src/curriculum/g5a-u02/class-c-hidden-projection-binding.js \
            src/curriculum/g5a-u02/class-d-semantic-generator-validator.js \
            src/curriculum/g5a-u02/s101-representation-runtime.js \
            src/curriculum/g5a-u02/s103-digit-code-runtime.js \
            src/curriculum/g5a-u02/s107-selection-symbolic-common-runtime.js \
            src/curriculum/g5a-u02/s108-remainder-transfer-runtime.js \
            site/modules/curriculum/batch-b/g5a-u02-browser-dynamic-runtime.bundle.js \
            data/curriculum/public-generation/PGC-R06-A02.g5a-u02-live-diagnostics.json \
            data/curriculum/public-generation/PGC-R06-A02.g5a-u02-live-diagnostics.csv \
            docs/curriculum/output/PGC-R06-A02_G5A_U02_live_diagnostics.md
          if git diff --cached --quiet; then
            echo "A02 runtime and diagnostics already synchronized."
          else
            git commit -m "fix(pgc-r06): close G5A-U02 reasoning mixed prompt diversity [skip ci]"
            git fetch origin "${{ github.head_ref || github.ref_name }}"
            git rebase "origin/${{ github.head_ref || github.ref_name }}"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload A02 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgc-r06-a02-g5a-u02-live-diagnostics
          path: |
            data/curriculum/public-generation/PGC-R06-A02.g5a-u02-live-diagnostics.json
            data/curriculum/public-generation/PGC-R06-A02.g5a-u02-live-diagnostics.csv
            docs/curriculum/output/PGC-R06-A02_G5A_U02_live_diagnostics.md
          if-no-files-found: error

